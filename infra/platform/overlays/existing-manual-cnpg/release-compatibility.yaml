# Only for the reviewed official CNPG 1.30.1 manual layout; see ../../README.md.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cloudnative-pg
  namespace: flux-system
spec:
  postRenderers:
    - kustomize:
        patches:
          - target:
              group: apps
              version: v1
              kind: Deployment
              name: cnpg-controller-manager
              namespace: cnpg-system
            patch: |
              [
                {
                  "op": "remove",
                  "path": "/spec/selector/matchLabels/app.kubernetes.io~1instance"
                },
                {
                  "op": "replace",
                  "path": "/spec/template/spec/containers/0/livenessProbe/httpGet/port",
                  "value": 9443
                },
                {
                  "op": "replace",
                  "path": "/spec/template/spec/containers/0/readinessProbe/httpGet/port",
                  "value": 9443
                },
                {
                  "op": "replace",
                  "path": "/spec/template/spec/containers/0/startupProbe/httpGet/port",
                  "value": 9443
                }
              ]
          - target:
              version: v1
              kind: Service
              name: cnpg-webhook-service
              namespace: cnpg-system
            patch: |
              [
                {
                  "op": "remove",
                  "path": "/spec/selector/app.kubernetes.io~1instance"
                },
                {
                  "op": "replace",
                  "path": "/spec/ports/0/targetPort",
                  "value": 9443
                },
                {
                  "op": "remove",
                  "path": "/spec/ports/0/name"
                }
              ]
          - target:
              group: rbac.authorization.k8s.io
              version: v1
              kind: ClusterRole
              name: cnpg-controller-manager
            patch: |
              [
                {
                  "op": "replace",
                  "path": "/metadata/name",
                  "value": "cnpg-manager"
                }
              ]
          - target:
              group: rbac.authorization.k8s.io
              version: v1
              kind: ClusterRoleBinding
              name: cnpg-controller-manager
            patch: |
              [
                {
                  "op": "replace",
                  "path": "/metadata/name",
                  "value": "cnpg-manager-rolebinding"
                },
                {
                  "op": "replace",
                  "path": "/roleRef/name",
                  "value": "cnpg-manager"
                }
              ]
          - target:
              group: rbac.authorization.k8s.io
              version: v1
              kind: ClusterRole
              name: cnpg-controller-manager-view
            patch: |
              apiVersion: rbac.authorization.k8s.io/v1
              kind: ClusterRole
              metadata:
                name: cnpg-controller-manager-view
              $patch: delete
          - target:
              group: rbac.authorization.k8s.io
              version: v1
              kind: ClusterRole
              name: cnpg-controller-manager-edit
            patch: |
              apiVersion: rbac.authorization.k8s.io/v1
              kind: ClusterRole
              metadata:
                name: cnpg-controller-manager-edit
              $patch: delete
