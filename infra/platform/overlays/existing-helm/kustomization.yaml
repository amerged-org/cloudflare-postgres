apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  - target:
      group: helm.toolkit.fluxcd.io
      version: v2
      kind: HelmRelease
      name: cloudnative-pg
    patch: |-
      - op: add
        path: /spec/suspend
        value: true
  - target:
      group: helm.toolkit.fluxcd.io
      version: v2
      kind: HelmRelease
      name: plugin-barman-cloud
    patch: |-
      - op: add
        path: /spec/suspend
        value: true
