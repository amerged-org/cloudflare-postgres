# Opt-in only after release identities and current Helm values have been checked.
# The manually applied operators stay suspended; only two Helm releases are managed.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: pgcf-platform
  namespace: flux-system
spec:
  interval: 30m
  url: https://github.com/amerged-org/cloudflare-postgres
  ref:
    commit: REPLACE_WITH_REVIEWED_COMMIT_SHA
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: pgcf-platform
  namespace: flux-system
spec:
  interval: 30m
  timeout: 5m
  path: ./infra/platform/overlays/existing-helm
  prune: true
  sourceRef:
    kind: GitRepository
    name: pgcf-platform
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: cilium
      namespace: flux-system
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: openebs
      namespace: flux-system
