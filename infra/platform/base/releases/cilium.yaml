apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
  namespace: flux-system
  labels:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  interval: 30m
  timeout: 10m
  releaseName: cilium
  targetNamespace: kube-system
  storageNamespace: kube-system
  chartRef:
    kind: OCIRepository
    name: cilium-chart
    namespace: flux-system
  install:
    crds: CreateReplace
    replace: true
    remediation:
      retries: 0
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 0
  driftDetection:
    mode: enabled
  valuesFrom:
    - kind: ConfigMap
      name: pgcf-cilium-values
      valuesKey: values.yaml
