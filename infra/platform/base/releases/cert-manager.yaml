apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: flux-system
  labels:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  interval: 30m
  timeout: 5m
  releaseName: cert-manager
  targetNamespace: cert-manager
  storageNamespace: cert-manager
  dependsOn:
    - name: cilium
      namespace: flux-system
  chartRef:
    kind: OCIRepository
    name: cert-manager-chart
    namespace: flux-system
  install:
    crds: CreateReplace
    remediation:
      retries: 0
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 0
  driftDetection:
    mode: enabled
  valuesFrom:
    - kind: ConfigMap
      name: pgcf-cert-manager-values
      valuesKey: values.yaml
