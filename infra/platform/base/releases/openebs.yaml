apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openebs
  namespace: flux-system
  labels:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  interval: 30m
  timeout: 15m
  releaseName: openebs
  targetNamespace: openebs
  storageNamespace: openebs
  dependsOn:
    - name: cilium
      namespace: flux-system
  chartRef:
    kind: OCIRepository
    name: openebs-chart
    namespace: flux-system
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  driftDetection:
    mode: enabled
  valuesFrom:
    - kind: ConfigMap
      name: pgcf-openebs-values
      valuesKey: values.yaml
