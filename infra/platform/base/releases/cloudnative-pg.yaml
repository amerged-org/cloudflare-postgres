apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cloudnative-pg
  namespace: flux-system
  labels:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  interval: 30m
  timeout: 5m
  releaseName: cloudnative-pg
  targetNamespace: cnpg-system
  storageNamespace: cnpg-system
  dependsOn:
    - name: cilium
      namespace: flux-system
  chartRef:
    kind: OCIRepository
    name: cloudnative-pg-chart
    namespace: flux-system
  install:
    crds: CreateReplace
    remediation:
      retries: 0
    serverSideApply: true
    disableTakeOwnership: true
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 0
    serverSideApply: enabled
    disableTakeOwnership: true
  driftDetection:
    mode: enabled
  valuesFrom:
    - kind: ConfigMap
      name: pgcf-cloudnative-pg-values
      valuesKey: values.yaml
