# Retain only the LocalPV LVM engine and its bundled CSI snapshot support.
engines:
  local:
    lvm:
      enabled: true
    zfs:
      enabled: false
    rawfile:
      enabled: false
    hostpath:
      enabled: false
  replicated:
    mayastor:
      enabled: false
loki:
  enabled: false
alloy:
  enabled: false
preUpgradeHook:
  enabled: false
lvm-localpv:
  analytics:
    enabled: false
  lvmNode:
    tolerations:
      - key: pgcf.io/quarantine
        operator: Exists
        effect: NoSchedule
  lvmController:
    tolerations:
      - key: pgcf.io/quarantine
        operator: Exists
        effect: NoSchedule
