apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: pgcf-lvm
  labels:
    kustomize.toolkit.fluxcd.io/prune: disabled
provisioner: local.csi.openebs.io
parameters:
  storage: lvm
  vgpattern: "^pgcf$"
  thinProvision: "no"
  fsType: ext4
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
reclaimPolicy: Retain
---
# A pool slot's 1 GiB placeholder: a slot is single use, so its volume is deleted with it.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: pgcf-slot
  labels:
    kustomize.toolkit.fluxcd.io/prune: disabled
provisioner: local.csi.openebs.io
parameters:
  storage: lvm
  vgpattern: "^pgcf$"
  thinProvision: "no"
  fsType: ext4
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: false
reclaimPolicy: Delete
