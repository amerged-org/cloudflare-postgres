apiVersion: v1
kind: Service
metadata:
  name: pgcf-gateway
  namespace: pgcf-system
  labels:
    app.kubernetes.io/name: pgcf-gateway
    app.kubernetes.io/part-of: pgcf
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: pgcf-gateway
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgcf-gateway
  namespace: pgcf-system
  labels:
    app.kubernetes.io/name: pgcf-gateway
    app.kubernetes.io/part-of: pgcf
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pgcf-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pgcf-gateway
        app.kubernetes.io/part-of: pgcf
    spec:
      serviceAccountName: pgcf-gateway
      enableServiceLinks: false
      tolerations:
        - key: pgcf.io/quarantine
          operator: Exists
          effect: NoSchedule
      # The gateway drains for up to 30 s after SIGTERM.
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: pgcf-gateway
      containers:
        - name: gateway
          image: pgcf-regional
          command: [node, /app/gateway.mjs]
          env:
            - name: PGCF_REGION_ID
              valueFrom:
                configMapKeyRef:
                  name: pgcf-regional
                  key: PGCF_REGION_ID
            - name: PGCF_ROUTE_KEY
              valueFrom:
                secretKeyRef:
                  name: pgcf-gateway
                  key: PGCF_ROUTE_KEY
            - name: PGCF_GATEWAY_POD_UID
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: metadata.uid
            - name: PGCF_GATEWAY_PORT
              value: "8080"
            # Literal substitutions are owned by the high-trust Native Kustomization,
            # never a Regional-writable ConfigMap or an untrusted storage ledger.
            - name: PGCF_STORAGE_AUTHORITY_KEYS
              value: '${PGCF_STORAGE_AUTHORITY_KEYS}'
            - name: PGCF_STORAGE_AUTHORITY_KEYS_SHA256
              value: '${PGCF_STORAGE_AUTHORITY_KEYS_SHA256}'
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: "1"
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            failureThreshold: 2
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
