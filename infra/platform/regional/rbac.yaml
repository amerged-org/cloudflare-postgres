apiVersion: v1
kind: ServiceAccount
metadata:
  name: pgcf-agent
  namespace: pgcf-system
  labels:
    app.kubernetes.io/name: pgcf-agent
    app.kubernetes.io/part-of: pgcf
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pgcf-gateway
  namespace: pgcf-system
  labels:
    app.kubernetes.io/name: pgcf-gateway
    app.kubernetes.io/part-of: pgcf
---
# cloudflared never talks to the Kubernetes API.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pgcf-cloudflared
  namespace: pgcf-system
  labels:
    app.kubernetes.io/name: pgcf-cloudflared
    app.kubernetes.io/part-of: pgcf
automountServiceAccountToken: false
---
# The agent owns every per-database namespace and its resources. Namespace names are dynamic, so
# these rules are cluster-wide. There is no pods/exec or cluster-wide pods/log access, and no
# RBAC or workload-controller access.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pgcf-agent
  labels:
    app.kubernetes.io/part-of: pgcf
rules:
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get, list, watch, create, update, patch, delete]
  # Role-password, archive-credential and CA Secrets live in the database namespaces. Secret names
  # are dynamic, so get cannot be limited by resourceNames; list and watch are not granted.
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, create, update, patch, delete]
  - apiGroups: [""]
    resources: [resourcequotas, limitranges]
    verbs: [get, list, create, update, patch, delete]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [get, list, create, update, patch, delete]
  - apiGroups: [cilium.io]
    resources: [ciliumnetworkpolicies]
    verbs: [get, list, create, update, patch, delete]
  - apiGroups: [postgresql.cnpg.io]
    resources: [clusters, scheduledbackups]
    verbs: [get, list, create, update, patch, delete]
  # Observe actual backup health and create one initial retry after hibernation rejection.
  - apiGroups: [postgresql.cnpg.io]
    resources: [backups]
    verbs: [get, list, create]
  - apiGroups: [barmancloud.cnpg.io]
    resources: [objectstores]
    verbs: [get, list, create, update, patch, delete]
  # Delete flow: find the PV bound to a database, set reclaim policy Delete, then wait for it.
  - apiGroups: [""]
    resources: [persistentvolumeclaims]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [persistentvolumes]
    verbs: [get, list, patch, delete]
  # Waiting for the LV to disappear after the PV is gone.
  - apiGroups: [local.openebs.io]
    resources: [lvmvolumes]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [nodes, pods]
    verbs: [get, list]
  # Native controller shared watches only enqueue exact database identities.
  - apiGroups: [""]
    resources: [pods]
    verbs: [watch]
  # A runtime switch deletes only the exact primary Pod under its UID and resourceVersion, so that
  # CNPG recreates it under the selected RuntimeClass. Pods are never created or updated; only the
  # native overlay patches one, in place and for its requests, through pods/resize.
  - apiGroups: [""]
    resources: [pods]
    verbs: [delete]
  - apiGroups: [postgresql.cnpg.io]
    resources: [clusters]
    verbs: [watch]
  # Verified kubelet summaries measure whole-filesystem use, including WAL; no node proxy access.
  - apiGroups: [""]
    resources: [nodes/stats]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pgcf-agent
  labels:
    app.kubernetes.io/part-of: pgcf
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: pgcf-agent
subjects:
  - kind: ServiceAccount
    name: pgcf-agent
    namespace: pgcf-system
---
# The agent publishes the CNPG server CA of each database as ConfigMap ca-<id> for the gateway and
# reads the shared R2 credential it copies into each database namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pgcf-fleet-observer
  namespace: flux-system
  labels:
    app.kubernetes.io/part-of: pgcf
rules:
  - apiGroups: [source.toolkit.fluxcd.io]
    resources: [gitrepositories, ocirepositories, helmcharts]
    verbs: [get, list]
  - apiGroups: [helm.toolkit.fluxcd.io]
    resources: [helmreleases]
    verbs: [get, list]
  - apiGroups: [kustomize.toolkit.fluxcd.io]
    resources: [kustomizations]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pgcf-fleet-observer
  namespace: flux-system
  labels:
    app.kubernetes.io/part-of: pgcf
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pgcf-fleet-observer
subjects:
  - kind: ServiceAccount
    name: pgcf-agent
    namespace: pgcf-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pgcf-storage-observer
  namespace: openebs
  labels:
    app.kubernetes.io/part-of: pgcf
rules:
  # Fresh lvs/vgs through authenticated Kubernetes HTTPS; no exec or host writer.
  - apiGroups: [""]
    resources: [pods/proxy]
    verbs: [get]
  - apiGroups: [apps]
    resources: [daemonsets]
    verbs: [get]
  # Qualification reads only the signed current driver Pod's bounded workqueue errors.
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  # One run-owned Pending probe: unexpected finalizers or Ready state are retained.
  - apiGroups: [local.openebs.io]
    resources: [lvmsnapshots]
    verbs: [get, create, delete]
  - apiGroups: [local.openebs.io]
    resources: [lvmnodes]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pgcf-storage-observer
  namespace: openebs
  labels:
    app.kubernetes.io/part-of: pgcf
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pgcf-storage-observer
subjects:
  - kind: ServiceAccount
    name: pgcf-agent
    namespace: pgcf-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pgcf-agent
  namespace: pgcf-system
  labels:
    app.kubernetes.io/part-of: pgcf
rules:
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, list, create, update, patch, delete]
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [pgcf-backup-s3, pgcf-gateway]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pgcf-agent
  namespace: pgcf-system
  labels:
    app.kubernetes.io/part-of: pgcf
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pgcf-agent
subjects:
  - kind: ServiceAccount
    name: pgcf-agent
    namespace: pgcf-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pgcf-gateway
  namespace: pgcf-system
  labels:
    app.kubernetes.io/part-of: pgcf
rules:
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pgcf-gateway
  namespace: pgcf-system
  labels:
    app.kubernetes.io/part-of: pgcf
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pgcf-gateway
subjects:
  - kind: ServiceAccount
    name: pgcf-gateway
    namespace: pgcf-system
---
# Exact ready writer PodUID/IP discovery for TLS routing; no workload or Secret access.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pgcf-gateway-endpoints
  labels:
    app.kubernetes.io/part-of: pgcf
rules:
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pgcf-gateway-endpoints
  labels:
    app.kubernetes.io/part-of: pgcf
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: pgcf-gateway-endpoints
subjects:
  - kind: ServiceAccount
    name: pgcf-gateway
    namespace: pgcf-system
---
# Pool mutation rights remain in its fixed restricted namespace. Existing cluster-wide Pod
# reads/deletes do not authorize workload creation elsewhere.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pgcf-pool-controller
  namespace: pgcf-pool
  labels:
    app.kubernetes.io/part-of: pgcf
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [create, patch]
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [pgcf-pool-bind-keys]
    verbs: [get, update, patch]
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pgcf-pool-controller
  namespace: pgcf-pool
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pgcf-pool-controller
subjects:
  - kind: ServiceAccount
    name: pgcf-agent
    namespace: pgcf-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pgcf-pool-primary-lease
  labels:
    app.kubernetes.io/part-of: pgcf
rules:
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    resourceNames: [database]
    verbs: [get, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pgcf-pool-primary-lease
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: pgcf-pool-primary-lease
subjects:
  - kind: ServiceAccount
    name: pgcf-agent
    namespace: pgcf-system
---
# The gateway discovers actual pool runtime identity; no Secrets or late tenant labels.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pgcf-pool-gateway
  namespace: pgcf-pool
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pgcf-pool-gateway
  namespace: pgcf-pool
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pgcf-pool-gateway
subjects:
  - kind: ServiceAccount
    name: pgcf-gateway
    namespace: pgcf-system
---
# Node UID/boot checks invalidate a bound target after reboot or hardware replacement.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pgcf-pool-gateway-nodes
rules:
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pgcf-pool-gateway-nodes
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: pgcf-pool-gateway-nodes
subjects:
  - kind: ServiceAccount
    name: pgcf-gateway
    namespace: pgcf-system
