apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - config.yaml
  - rbac.yaml
  - network-policies.yaml
  - cloudflared.yaml
  - gateway.yaml
  - agent.yaml
# CI publishes one image for the agent and gateway. A private overlay may replace newName/newTag
# for a locally imported Dev image (see ../README.md).
images:
  - name: pgcf-regional
    newName: ghcr.io/amerged-org/pgcf-regional
    digest: sha256:14191e73d2bde4897856f1be7eeccca30a9d41f52e1665a818c6ecab2ba1483a
  - name: cloudflared
    newName: docker.io/cloudflare/cloudflared
    # cloudflared 2026.10.0 multi-arch index
    digest:
      # cloudflared 2026.10.0 Linux/amd64 manifest, derived from versions.lock.json
      sha256:1a50cc8893b3f0dd283805d2efcd3336210aced60a83d967fb2bbc8ab69b5f35
