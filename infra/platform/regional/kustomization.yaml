apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - config.yaml
  - rbac.yaml
  - network-policies.yaml
  - cloudflared.yaml
  - gateway.yaml
  - agent.yaml
# CI publishes one image for the agent and gateway. A private overlay may replace newName/newTag
# for a locally imported Dev image (see ../README.md).
images:
  - name: pgcf-regional
    newName: ghcr.io/amerged-org/pgcf-regional
    digest: sha256:905f3931af9b594b9fb9d90fedfc03f728ec3627e0f89626c1fde0db475dabb1
  - name: cloudflared
    newName: docker.io/cloudflare/cloudflared
    # cloudflared 2026.9.3 multi-arch index
    digest: sha256:072c067d25ccbe61d46e18f0d0723255f2bb5304f7317caa95b27031520ff92c
