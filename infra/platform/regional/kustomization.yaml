apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - config.yaml
  - rbac.yaml
  - network-policies.yaml
  - cloudflared.yaml
  - gateway.yaml
  - agent.yaml
# CI publishes one image for the agent and gateway. A private overlay may replace newName/newTag
# for a locally imported Dev image (see ../README.md).
images:
  - name: pgcf-regional
    newName: ghcr.io/amerged-org/pgcf-regional
    digest: sha256:14191e73d2bde4897856f1be7eeccca30a9d41f52e1665a818c6ecab2ba1483a
  - name: cloudflared
    newName: docker.io/cloudflare/cloudflared
    # cloudflared 2026.10.0 multi-arch index
    digest: sha256:9b49eed8f62806d5d45ddf59ecefb5710429598ea6d3fcccd2af938f621b2b07
