# The native controller selects a region's compute pool only after it reads node-bootstrap's
# runtime admission for the current profile. It reads these exact objects and never writes them.
- op: add
  path: /rules/-
  value:
    apiGroups: [node.k8s.io]
    resources: [runtimeclasses]
    resourceNames: [pgcf-prestarted]
    verbs: [get]
- op: add
  path: /rules/-
  value:
    apiGroups: [admissionregistration.k8s.io]
    resources: [mutatingadmissionpolicies, mutatingadmissionpolicybindings]
    resourceNames: [pgcf-cnpg-prestarted]
    verbs: [get]

# Native runtime attestations retain metadata-only watch continuity for these actual identities.
- op: add
  path: /rules/-
  value:
    apiGroups: [""]
    resources: [secrets, configmaps, persistentvolumes, nodes]
    verbs: [list, watch]

# A pool hit gives the claimed slot Pod's postgres container the class's requests in place,
# through the Pod's resize subresource (requests only, under the Pod's UID).
# Database namespaces are dynamic and RBAC cannot scope by label, so the right is cluster-wide,
# like the Pod delete of the base role.
- op: add
  path: /rules/-
  value:
    apiGroups: [""]
    resources: [pods/resize]
    verbs: [patch]

# Runtime attestations prove the objects of a database Pod unchanged by metadata-only watches of
# them, as for the runtime objects above, instead of reading each of them again. The base
# role lists and reads these kinds already.
- op: add
  path: /rules/-
  value:
    apiGroups: [""]
    resources: [resourcequotas, limitranges]
    verbs: [watch]
- op: add
  path: /rules/-
  value:
    apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [watch]
- op: add
  path: /rules/-
  value:
    apiGroups: [cilium.io]
    resources: [ciliumnetworkpolicies]
    verbs: [watch]
- op: add
  path: /rules/-
  value:
    apiGroups: [postgresql.cnpg.io]
    resources: [scheduledbackups]
    verbs: [watch]
- op: add
  path: /rules/-
  value:
    apiGroups: [barmancloud.cnpg.io]
    resources: [objectstores]
    verbs: [watch]
- op: add
  path: /rules/-
  value:
    apiGroups: [local.openebs.io]
    resources: [lvmvolumes]
    verbs: [watch]
