# Selected only by a release containing both qualified native runtime images.
# The common regional resources remain the single source for RBAC, network, services and limits;
# the native controller adds read access to the runtime admission it waits for and the right to
# resize the requests of a parked instance Pod in place. The node attach agent ships in the
# controller image; the controller and gateway may reach pool slots and the agent.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../regional-gateway-native
  - attach.yaml
patches:
  - path: agent.yaml
  - path: config.yaml
  - path: rbac.yaml
    target:
      group: rbac.authorization.k8s.io
      version: v1
      kind: ClusterRole
      name: pgcf-agent
  - path: policies-pool-agent.yaml
    target:
      group: cilium.io
      version: v2
      kind: CiliumNetworkPolicy
      namespace: pgcf-system
      name: pgcf-agent
  - path: policies-pool-gateway.yaml
    target:
      group: cilium.io
      version: v2
      kind: CiliumNetworkPolicy
      namespace: pgcf-system
      name: pgcf-gateway
