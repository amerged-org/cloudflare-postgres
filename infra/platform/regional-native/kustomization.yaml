# Selected only by a release containing both qualified native runtime images.
# The common regional resources remain the single source for RBAC, network, services and limits;
# the native controller adds only read access to the runtime admission it waits for.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../regional-gateway-native
patches:
  - path: agent.yaml
  - path: config.yaml
  - path: rbac.yaml
    target:
      group: rbac.authorization.k8s.io
      version: v1
      kind: ClusterRole
      name: pgcf-agent
