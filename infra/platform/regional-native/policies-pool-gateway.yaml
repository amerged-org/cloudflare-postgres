# The gateway dials a pool slot that serves a woken database.
- op: add
  path: /spec/egress/-
  value:
    toEndpoints:
      - matchLabels:
          cnpg.io/cluster: database
        matchExpressions:
          - key: k8s:io.kubernetes.pod.namespace
            operator: Exists
          - key: k8s:io.cilium.k8s.namespace.labels.pgcf.io/slot
            operator: Exists
    toPorts:
      - ports:
          - port: "5432"
            protocol: TCP
