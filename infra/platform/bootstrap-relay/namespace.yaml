apiVersion: v1
kind: Namespace
metadata:
  name: pgcf-bootstrap-transport
  labels:
    # Host networking gives native bootstrap connections the selected VPS's fixed source address.
    # Both containers still run unprivileged with no Kubernetes service-account credentials.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
    kustomize.toolkit.fluxcd.io/prune: disabled
