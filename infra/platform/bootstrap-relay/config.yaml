apiVersion: v1
kind: ConfigMap
metadata:
  name: pgcf-bootstrap-relay
  namespace: pgcf-bootstrap-transport
data:
  PGCF_BOOTSTRAP_RELAY_REGION: "${PGCF_BOOTSTRAP_RELAY_ISSUER_REGION}"
  PGCF_BOOTSTRAP_RELAY_ISSUER_REGION: "${PGCF_BOOTSTRAP_RELAY_ISSUER_REGION}"
  PGCF_BOOTSTRAP_RELAY_HOST: "127.0.0.1"
  PGCF_BOOTSTRAP_RELAY_PORT: "8082"
  PGCF_BOOTSTRAP_RELAY_PUBLIC_KEYS: |-
    ${PGCF_BOOTSTRAP_RELAY_PUBLIC_KEYS}
  PGCF_BOOTSTRAP_RELAY_ALLOWED_TARGET_REGIONS: |-
    ${PGCF_BOOTSTRAP_RELAY_ALLOWED_TARGET_REGIONS}
