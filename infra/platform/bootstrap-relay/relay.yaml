apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgcf-bootstrap-relay
  namespace: pgcf-bootstrap-transport
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: pgcf-bootstrap-relay
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pgcf-bootstrap-relay
        app.kubernetes.io/part-of: pgcf
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      hostNetwork: true
      dnsPolicy: Default
      nodeSelector:
        kubernetes.io/hostname: "${PGCF_BOOTSTRAP_RELAY_NODE_NAME}"
      tolerations:
        - key: pgcf.io/quarantine
          operator: Equal
          value: bootstrap
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: relay
          image: pgcf-regional
          command: [node, /app/bootstrap-relay.mjs]
          envFrom:
            - configMapRef:
                name: pgcf-bootstrap-relay
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            exec:
              command:
                - node
                - --input-type=module
                - -e
                - "const r=await fetch('http://127.0.0.1:8082/_pgcf/bootstrap-relay/identity',{signal:AbortSignal.timeout(2000)});if(r.status!==200)process.exit(1)"
            periodSeconds: 5
            timeoutSeconds: 3
        - name: tunnel
          image: cloudflared
          args: [tunnel, --metrics, "127.0.0.1:20242", run]
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: pgcf-bootstrap-tunnel
                  key: token
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            exec:
              command:
                [cloudflared, tunnel, --metrics, "127.0.0.1:20242", ready]
            periodSeconds: 5
            timeoutSeconds: 3
