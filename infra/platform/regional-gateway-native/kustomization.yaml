# Gateway-first migration: retain the qualified legacy Regional controller.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../regional
patches:
  - path: gateway.yaml
  - path: rbac.yaml
    target:
      group: rbac.authorization.k8s.io
      version: v1
      kind: ClusterRole
      name: pgcf-gateway-endpoints
