apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgcf-bootstrap-relay
  namespace: pgcf-bootstrap-transport
spec:
  template:
    spec:
      securityContext:
        runAsUser: 65532
        runAsGroup: 65532
      containers:
        - name: relay
          image: pgcf-native-bootstrap-relay
          command: [/pgcf-native-bootstrap-relay]
          args: []
          ports:
            - name: http
              containerPort: 8082
              protocol: TCP
          # The protected host-network listener binds loopback, as its ConfigMap requires.
          livenessProbe:
            httpGet:
              host: 127.0.0.1
              path: /_pgcf/bootstrap-relay/identity
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            $patch: replace
            httpGet:
              host: 127.0.0.1
              path: /_pgcf/bootstrap-relay/identity
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
