# The writable root including /var and /boot. It is built small; first boot grows it to 8 GiB
# (usr/lib/repart.d/20-root.conf) and puts the LVM partition behind it.
[Partition]
Type=root
Label=pgcf-root
Format=ext4
# Copying / leaves out the contents of the ESP's well-known mount points, /efi and /boot.
# /efi belongs on the ESP; /boot holds Debian's kernels and initrds and stays on the root.
CopyFiles=/
CopyFiles=/boot:/boot
Minimize=guess
