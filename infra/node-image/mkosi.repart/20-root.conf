# SPDX-License-Identifier: Apache-2.0
# The writable root including /var and /boot. The 2 GiB build root holds the locked
# PostGIS runtime and its projection data. First boot grows it to 8 GiB and puts LVM behind it.
[Partition]
Type=root
Label=pgcf-root
Format=ext4
# Copying / leaves out the contents of the ESP's well-known mount points, /efi and /boot.
# /efi belongs on the ESP; /boot holds Debian's kernels and initrds and stays on the root.
CopyFiles=/
CopyFiles=/boot:/boot
SizeMinBytes=2G
