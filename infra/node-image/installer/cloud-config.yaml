#cloud-config
# SPDX-License-Identifier: Apache-2.0
# PGCF pull installer, passed as userData to Contabo's rescue action (plan 9.2) and rendered by the
# API (packages/contracts/src/node-installer.ts): the two placeholders become base64 of install.sh
# and of the KEY=value parameters.
# Stage 1 confirmed that rescue cloud-init runs write_files and runcmd. Contabo merges its own
# configuration, which turns SSH password login on and sets a root password: the drop-in below is
# written before sshd starts and is read first, and install.sh locks the password.
write_files:
  - path: /etc/ssh/sshd_config.d/00-pgcf-install.conf
    permissions: "0644"
    content: |
      PasswordAuthentication no
      KbdInteractiveAuthentication no
  - path: /run/pgcf-install/install.sh
    permissions: "0700"
    encoding: b64
    content: @@INSTALL_SH@@
  - path: /run/pgcf-install/params
    permissions: "0600"
    encoding: b64
    content: @@PARAMS@@
runcmd:
  - [/bin/bash, /run/pgcf-install/install.sh, /run/pgcf-install/params]
