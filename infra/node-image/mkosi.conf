# SPDX-License-Identifier: Apache-2.0
# One Debian 13 disk image for every PGCF node. builder/build.sh adds the snapshot or the local
# mirror of locked packages, the release name and SOURCE_DATE_EPOCH; see README.md.

[Distribution]
Distribution=debian
Release=trixie
Architecture=x86-64

[Output]
Format=disk
ImageId=pgcf-node
ManifestFormat=json
CompressOutput=no
# Fixed so that partition and filesystem identifiers do not change between builds.
Seed=6f0c2f0e-4a7b-4d33-9a51-2c6e1d0b8f45

[Build]
# Debian kernel packages build their initrd with initramfs-tools (mkosi sets INITRD=No otherwise).
Environment=INITRD=Yes
# mke2fs draws the root filesystem's directory hash seed at random; fixing it is the last step to
# an identical image from the same lock.
Environment=SYSTEMD_REPART_MKFS_OPTIONS_EXT4=-Ehash_seed=8b0f3c2e-5d1a-4e7b-9c64-2a7d9e1f0b53

[Content]
# mkosi installs the GRUB core images for BIOS and UEFI; the kernel and initrd stay Debian's
# own (initramfs-tools, /vmlinuz links) so that apt kernel updates boot without mkosi.
Bootable=auto
Bootloader=grub
BiosBootloader=grub
UnifiedKernelImages=no
Initrds=
KernelModulesInitrd=no
WithDocs=no
WithRecommends=no
Locale=C.UTF-8
Timezone=UTC
Packages=
        apt
        barman-cli-cloud=3.20.1-1.pgdg13+1
        ca-certificates
        cloudflared=2026.10.0
        dbus
        e2fsprogs
        grub-efi-amd64-bin
        grub-pc-bin
        initramfs-tools
        iproute2
        kmod
        libpq5=18.6-1.pgdg13+2
        linux-image-amd64
        lvm2
        netbase
        nftables
        openssh-server
        postgresql-18=18.6-1.pgdg13+2
        postgresql-18-pgvector=0.8.7-1.pgdg13+1
        procps
        systemd
        systemd-repart
        systemd-sysv
        systemd-timesyncd
        thin-provisioning-tools
        udev
        zstd
# mkosi copies each kernel to /usr/lib/modules/<version>/vmlinuz for its own boot entries; this
# image boots Debian's /boot instead. Host keys are secrets and per node (sshd-keygen.service
# creates them on first boot).
RemoveFiles=
        /usr/lib/modules/*/vmlinuz
        /etc/ssh/ssh_host_*
        /var/lib/systemd/random-seed
        /var/log/apt/*
        /var/log/alternatives.log
        /var/log/dpkg.log
        /var/cache/ldconfig/aux-cache
        /var/cache/debconf/*-old
        /var/lib/dpkg/*-old
