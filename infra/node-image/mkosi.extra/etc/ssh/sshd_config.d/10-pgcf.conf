# SPDX-License-Identifier: Apache-2.0
# The break-glass shell, reachable only through the node's Tunnel. sshd takes a user certificate
# signed by the CA in /etc/ssh/pgcf_user_ca.pub for a principal in /etc/ssh/principals/<user>, and
# nothing else. The image ships no CA key, so no login is possible until a CA key is written.
# RevokedKeys: sshd refuses every public key when the file is missing, so the image ships an empty
# key revocation list (header only).
ListenAddress 127.0.0.1
ListenAddress ::1
PasswordAuthentication no
KbdInteractiveAuthentication no
AuthenticationMethods publickey
PubkeyAuthentication yes
AuthorizedKeysFile none
TrustedUserCAKeys /etc/ssh/pgcf_user_ca.pub
AuthorizedPrincipalsFile /etc/ssh/principals/%u
RevokedKeys /etc/ssh/pgcf_revoked.krl
PermitRootLogin prohibit-password
AllowUsers root
MaxAuthTries 2
LoginGraceTime 20
MaxSessions 2
X11Forwarding no
AllowTcpForwarding no
AllowAgentForwarding no
PermitTunnel no
DisableForwarding yes
GSSAPIAuthentication no
ClientAliveInterval 30
ClientAliveCountMax 4
LogLevel VERBOSE
