#!/usr/sbin/nft -f
# SPDX-License-Identifier: Apache-2.0
# Deny all inbound: only replies to the node's own outbound flows and IPv6 neighbour discovery
# arrive. All database and operator traffic comes through the outbound Tunnel.
flush ruleset

table inet pgcf {
	chain input {
		type filter hook input priority filter; policy drop;
		iif "lo" accept
		ct state established,related accept
		icmpv6 type { nd-neighbor-solicit, nd-neighbor-advert, nd-router-advert } ip6 hoplimit 255 accept
	}

	chain forward {
		type filter hook forward priority filter; policy drop;
	}
}
