# Reclaims what journald's per-uid split left behind. SplitMode=uid (the default) wrote
# user-<uid>.journal for every uid outside systemd's own ranges, which the slot and database uids
# are. journald's vacuum removes archived files only, and these were active ones: 376 of them took the
# 1 GiB budget of the system journal on EU1, and the system journal of the boot before a reset
# ended 22.5 hours early (2026-10-23). pgcf-split.conf turns the split off; this removes the files
# by name, in the persistent and the volatile journal, and the system journal (system.journal,
# system@*.journal) is not among them. The agent runs this file with `systemd-tmpfiles --create
# --remove` when a release carries it, and a boot runs it again (the removal of a file that is not
# there is nothing).
r /var/log/journal/*/user-*.journal
r /var/log/journal/*/user-*.journal~
r /run/log/journal/*/user-*.journal
r /run/log/journal/*/user-*.journal~
