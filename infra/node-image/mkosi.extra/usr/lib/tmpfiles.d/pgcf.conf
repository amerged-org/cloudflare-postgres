d /var/lib/pgcf             0755 root root -
d /var/lib/pgcf/bin         0755 root root -
# Traversable but not listable, as the agent creates it (store.rs): a database reaches its own
# directory, and this one cannot be listed. tmpfiles resets the mode at every boot.
d /var/lib/pgcf/db          0711 root root -
d /var/lib/pgcf/credentials 0700 root root -
d /var/lib/pgcf/enrollment  0700 root root -
