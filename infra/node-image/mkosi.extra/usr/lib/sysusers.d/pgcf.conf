# Fixed system users. Database users (pgcf-<id>) are created by the agent with fixed uids from its
# own range; never from systemd's dynamic range (61184-65519), which recycles uids.
u pgcf-gateway      - "PGCF gateway" /nonexistent
u pgcf-cloudflared  - "PGCF Tunnel"  /nonexistent
