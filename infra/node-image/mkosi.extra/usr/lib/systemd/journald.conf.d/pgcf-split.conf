# One journal for every user. journald's default, SplitMode=uid, keeps /var/log/journal/<machine>/
# user-<uid>.journal for every uid outside systemd's system, dynamic and container ranges, with a
# POSIX ACL that grants that uid read access: the slot uids (300000 + n) and the database uids
# (200000 + n) are such uids. A uid that a second tenant uses would read the first one's log lines,
# DETAIL lines with data values included. With the split off no such file is made; PostgreSQL's
# lines are in the system journal, where the agent finds them by unit and invocation. Files made
# before are removed by pgcf-journal.conf (tmpfiles.d), and the units cannot see the journal
# directories.
[Journal]
SplitMode=none
