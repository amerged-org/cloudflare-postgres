# The 8 GiB root holds the journal; bound it so logs never fill the root.
[Journal]
Storage=persistent
Compress=yes
SystemMaxUse=1G
SystemKeepFree=2G
SystemMaxFileSize=64M
RuntimeMaxUse=64M
MaxRetentionSec=14day
RateLimitIntervalSec=30s
RateLimitBurst=10000
ForwardToSyslog=no
# The default is five minutes: a freeze would lose them, and they are what explains it.
SyncIntervalSec=15s
