# Static: Debian's kernel packages keep /vmlinuz and /initrd.img on the newest kernel and the .old
# links on the previous one, so apt kernel updates need no GRUB change. A one-shot boot of the
# previous kernel: grub-editenv /efi/grub/grubenv set next_entry=previous
set default=current
set timeout=3
serial --unit=0 --speed=115200
terminal_input console serial
terminal_output console serial

load_env
if [ "${next_entry}" ]; then
	set default="${next_entry}"
	set next_entry=
	save_env next_entry
fi

insmod part_gpt
insmod ext2
search --no-floppy --set=root --label pgcf-root

menuentry "PGCF node" --id current {
	linux /vmlinuz root=LABEL=pgcf-root rw console=tty0 console=ttyS0,115200n8
	initrd /initrd.img
}

menuentry "PGCF node (previous kernel)" --id previous {
	linux /vmlinuz.old root=LABEL=pgcf-root rw console=tty0 console=ttyS0,115200n8
	initrd /initrd.img.old
}
