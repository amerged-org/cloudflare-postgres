# Operator-owned trust data; never copy addresses from an unverified CSR.
# Populate each record from authenticated machine/provider enrollment.
# Keep real Node UIDs and addresses in the adopter's private configuration.
apiVersion: v1
kind: ConfigMap
metadata:
  name: pgcf-node-enrollment
  namespace: kubelet-serving-cert-approver
data:
  enrollment.json: |
    {
      "apiVersion": "pgcf.io/kubelet-serving-enrollment/v1",
      "nodes": []
    }
