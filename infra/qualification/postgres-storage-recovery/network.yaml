# Each policy selects only Pods in its own fresh namespace. SQL runs through
# the operator's authenticated Exec path and the local PostgreSQL Unix socket.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: qualification-boundary
  namespace: pgcf-wal-target-example
  labels:
    pgcf.io/qualification-run: REPLACE_WITH_OPERATION_ID
spec:
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: cnpg-system
            k8s:app.kubernetes.io/name: cloudnative-pg
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
  egress:
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "6443"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
---
