# Fresh qualification volumes only. Never replace the existing Retain class.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: pgcf-wal-storage-example
  labels:
    pgcf.io/qualification-run: REPLACE_WITH_OPERATION_ID
provisioner: local.csi.openebs.io
parameters:
  fsType: ext4
  storage: lvm
  thinProvision: "no"
  vgpattern: "^pgcf$"
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
reclaimPolicy: Delete
