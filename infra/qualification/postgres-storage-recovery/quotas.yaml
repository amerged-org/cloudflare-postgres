# Bootstrap Jobs can temporarily overlap an instance Pod. These quotas allow
# two bounded Pods; they do not increase either Cluster's one-instance count.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: qualification-bound
  namespace: pgcf-wal-target-example
  labels:
    pgcf.io/qualification-run: REPLACE_WITH_OPERATION_ID
spec:
  hard:
    pods: "2"
    persistentvolumeclaims: "2"
    requests.storage: 896Mi
    requests.cpu: 200m
    requests.memory: 512Mi
    limits.cpu: "1"
    limits.memory: 1Gi
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: qualification-bound
  namespace: pgcf-wal-neighbor-example
  labels:
    pgcf.io/qualification-run: REPLACE_WITH_OPERATION_ID
spec:
  hard:
    pods: "2"
    persistentvolumeclaims: "2"
    requests.storage: 384Mi
    requests.cpu: 200m
    requests.memory: 512Mi
    limits.cpu: "1"
    limits.memory: 1Gi
