apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: database
  namespace: pgcf-wal-target-example
  labels:
    pgcf.io/qualification-run: REPLACE_WITH_OPERATION_ID
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18.4-standard-trixie@sha256:ebf3919504d7523a63e8e2fee9b051211de714644b36469275558c624afd50ec
  inheritedMetadata:
    labels:
      pgcf.io/qualification-run: REPLACE_WITH_OPERATION_ID
  enableSuperuserAccess: false
  bootstrap:
    initdb:
      database: app
      owner: app
      encoding: UTF8
      localeCType: C
      localeCollate: C
  affinity:
    nodeSelector:
      kubernetes.io/hostname: REPLACE_WITH_AUTHENTICATED_NODE_NAME
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  storage:
    storageClass: pgcf-wal-storage-example
    size: 512Mi
  walStorage:
    storageClass: pgcf-wal-storage-example
    size: 128Mi
  postgresql:
    parameters:
      max_wal_size: 96MB
      max_slot_wal_keep_size: 1GB
      min_wal_size: 80MB
      checkpoint_timeout: 30min
      wal_compression: "off"
---
