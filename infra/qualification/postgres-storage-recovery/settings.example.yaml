# Copy the complete directory privately and replace these five values before
# rendering. This example is not an instruction to create lab resources.
apiVersion: v1
kind: ConfigMap
metadata:
  name: pgcf-wal-qualification-settings
  namespace: pgcf-wal-target-example
  labels:
    pgcf.io/qualification-run: REPLACE_WITH_OPERATION_ID
data:
  operationId: REPLACE_WITH_OPERATION_ID
  nodeName: REPLACE_WITH_AUTHENTICATED_NODE_NAME
  targetNamespace: pgcf-wal-target-example
  neighborNamespace: pgcf-wal-neighbor-example
  storageClassName: pgcf-wal-storage-example
