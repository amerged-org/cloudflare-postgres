# Dev only: use the individually verified Talos-imported runtime artifact.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../kubelet-serving-certificates
patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: kubelet-serving-cert-approver
      namespace: kubelet-serving-cert-approver
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: docker.io/library/pgcf-kubelet-approver:enrollment-6069c8a10058
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Never
