# Example only: requires the separately prepared frontend Certificate.
apiVersion: postgresql.cnpg.io/v1
kind: Pooler
metadata:
  name: pgcf-session-rw
  namespace: pgcf-example
spec:
  cluster:
    name: database
  instances: 1
  type: rw
  deploymentStrategy:
    type: Recreate
  pgbouncer:
    image: ghcr.io/cloudnative-pg/pgbouncer@sha256:b15c428057d1ffbc19fb70496911a5f1a47066dcc1315bf794f4e85ade29e2e5
    poolMode: session
    clientTLSSecret:
      name: pgcf-session-rw-tls
    parameters:
      client_tls_sslmode: require
      server_tls_sslmode: verify-full
      max_client_conn: "50"
      default_pool_size: "5"
      reserve_pool_size: "0"
      max_db_connections: "10"
      max_user_connections: "10"
      query_wait_timeout: "15"
      server_connect_timeout: "10"
      cancel_wait_timeout: "10"
  template:
    metadata:
      labels:
        pgcf.io/component: session-pooler
    spec:
      initContainers:
        - name: bootstrap-controller
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
      containers:
        - name: pgbouncer
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
