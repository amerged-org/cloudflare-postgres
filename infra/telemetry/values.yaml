prometheus-node-exporter:
  namespaceOverride: pgcf-node-metrics
  hostNetwork: true
  hostPID: true
  hostIPC: false
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi
  service:
    type: ClusterIP
    listenOnAllInterfaces: false
  securityContext:
    fsGroup: 65534
    runAsGroup: 65534
    runAsNonRoot: true
    runAsUser: 65534
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
  prometheus:
    monitor:
      enabled: true
      interval: 45s
      relabelings:
        - targetLabel: pgcf_component
          replacement: node-exporter
  image:
    digest: sha256:8c9bac11973b94b59be88d6e11fee4429aa743c8846cdc75d65b18db33f6a106
