apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: pgcf-platform
  namespace: pgcf-monitoring
  labels:
    release: pgcf-telemetry
spec:
  groups:
    - name: pgcf-platform
      rules:
        - alert: PGCFPlatformControllerUnavailable
          expr: kube_deployment_status_replicas_available{namespace=~"flux-system|cnpg-system",deployment=~"source-controller|kustomize-controller|helm-controller|notification-controller|cnpg-controller-manager|barman-cloud"}
            <
            kube_deployment_spec_replicas{namespace=~"flux-system|cnpg-system",deployment=~"source-controller|kustomize-controller|helm-controller|notification-controller|cnpg-controller-manager|barman-cloud"}
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: A platform controller or CNPG plugin has fewer available replicas than
              desired.
        - alert: PGCFPlatformScrapeDown
          expr: up{pgcf_component=~"flux|cnpg-operator|node-exporter"} == 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: A selected platform metrics target cannot be scraped.
        - alert: PGCFPVCMetricsMissing
          expr: (kube_persistentvolumeclaim_status_phase{phase="Bound"} == 1) unless
            on(namespace,persistentvolumeclaim)
            kubelet_volume_stats_capacity_bytes
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: A bound PVC has no kubelet volume statistics; storage visibility is
              incomplete.
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: pgcf-flux-state
  namespace: pgcf-monitoring
  labels:
    release: pgcf-telemetry
spec:
  groups:
  - name: pgcf-flux-state
    interval: 60s
    rules:
    - record: pgcf:flux_active
      expr: |-
        (max by (customresource_group,customresource_version,customresource_kind,resource_namespace,name,resource_uid) (pgcf_flux_resource_generation{resource_namespace="flux-system"}) > 0)
        unless on(customresource_group,customresource_version,customresource_kind,resource_namespace,name,resource_uid) (max by (customresource_group,customresource_version,customresource_kind,resource_namespace,name,resource_uid) (pgcf_flux_suspended{resource_namespace="flux-system"}) == 1)
        unless on(customresource_group,customresource_version,customresource_kind,resource_namespace,name,resource_uid) (max by (customresource_group,customresource_version,customresource_kind,resource_namespace,name,resource_uid) (pgcf_flux_deletion_timestamp{resource_namespace="flux-system"}) > 0)
    - record: pgcf:flux_current_ready
      expr: |-
        (max by (customresource_group,customresource_version,customresource_kind,resource_namespace,name,resource_uid) (pgcf_flux_ready_condition{resource_namespace="flux-system"}) == 1)
        and on(customresource_group,customresource_version,customresource_kind,resource_namespace,name,resource_uid) (max by (customresource_group,customresource_version,customresource_kind,resource_namespace,name,resource_uid) (pgcf_flux_ready_condition_observed_generation{resource_namespace="flux-system"}) == on(customresource_group,customresource_version,customresource_kind,resource_namespace,name,resource_uid) max by (customresource_group,customresource_version,customresource_kind,resource_namespace,name,resource_uid) (pgcf_flux_resource_generation{resource_namespace="flux-system"}))
        and on(customresource_group,customresource_version,customresource_kind,resource_namespace,name,resource_uid) (max by (customresource_group,customresource_version,customresource_kind,resource_namespace,name,resource_uid) (pgcf_flux_observed_generation{resource_namespace="flux-system"}) == on(customresource_group,customresource_version,customresource_kind,resource_namespace,name,resource_uid) max by (customresource_group,customresource_version,customresource_kind,resource_namespace,name,resource_uid) (pgcf_flux_resource_generation{resource_namespace="flux-system"}))
        unless on(customresource_group,customresource_version,customresource_kind,resource_namespace,name,resource_uid) (max by (customresource_group,customresource_version,customresource_kind,resource_namespace,name,resource_uid) (pgcf_flux_reconciling{resource_namespace="flux-system"}) == 1)
        unless on(customresource_group,customresource_version,customresource_kind,resource_namespace,name,resource_uid) (max by (customresource_group,customresource_version,customresource_kind,resource_namespace,name,resource_uid) (pgcf_flux_stalled{resource_namespace="flux-system"}) == 1)
        and on(customresource_group,customresource_version,customresource_kind,resource_namespace,name,resource_uid) pgcf:flux_active
    - alert: PGCFFluxReconcileFailed
      expr: pgcf:flux_active unless on(customresource_group,customresource_version,customresource_kind,resource_namespace,name,resource_uid)
        pgcf:flux_current_ready
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: An active Flux resource lacks current Ready status; suspended and
          deleting resources are excluded.
    - alert: PGCFFluxStateMetricsMissing
      expr: |-
        absent(pgcf_flux_resource_generation{resource_namespace="flux-system",customresource_group="helm.toolkit.fluxcd.io",customresource_kind="HelmRelease",customresource_version="v2"})
        or absent(pgcf_flux_resource_generation{resource_namespace="flux-system",customresource_group="source.toolkit.fluxcd.io",customresource_kind="GitRepository",customresource_version="v1"})
        or absent(pgcf_flux_resource_generation{resource_namespace="flux-system",customresource_group="kustomize.toolkit.fluxcd.io",customresource_kind="Kustomization",customresource_version="v1"})
        or absent(pgcf_flux_resource_generation{resource_namespace="flux-system",customresource_group="source.toolkit.fluxcd.io",customresource_kind="OCIRepository",customresource_version="v1"})
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: One expected Flux resource kind has no state metric; export, RBAC,
          discovery or resource visibility needs inspection.
