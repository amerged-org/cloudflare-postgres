# Prepared only. Keep suspended until the documented qualification gates pass.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pgcf-telemetry
  namespace: flux-system
  labels:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  suspend: true
  interval: 30m
  timeout: 8m
  releaseName: pgcf-telemetry
  targetNamespace: pgcf-monitoring
  storageNamespace: pgcf-monitoring
  dependsOn:
    - name: cilium
      namespace: flux-system
    - name: openebs
      namespace: flux-system
    - name: cert-manager
      namespace: flux-system
  chartRef:
    kind: OCIRepository
    name: pgcf-kube-prometheus-stack
    namespace: flux-system
  install:
    crds: Create
    remediation:
      retries: 0
    serverSideApply: true
    disableTakeOwnership: true
  upgrade:
    crds: Skip
    remediation:
      retries: 0
    serverSideApply: enabled
    disableTakeOwnership: true
  driftDetection:
    mode: enabled
  valuesFrom:
    - kind: ConfigMap
      name: pgcf-telemetry-values
      valuesKey: values.yaml
