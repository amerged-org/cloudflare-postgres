apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespaces.yaml
  - namespace-quota.yaml
  - source.yaml
  - release.yaml
configMapGenerator:
  - name: pgcf-telemetry-values
    namespace: flux-system
    files:
      - values.yaml=values.yaml
generatorOptions:
  disableNameSuffixHash: true
  labels:
    reconcile.fluxcd.io/watch: Enabled
