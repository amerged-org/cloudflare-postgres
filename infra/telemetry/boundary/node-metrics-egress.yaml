apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: pgcf-node-metrics-egress-boundary
  labels:
    app.kubernetes.io/part-of: cloudflare-postgres
    app.kubernetes.io/managed-by: Flux
    kustomize.toolkit.fluxcd.io/prune: disabled
specs:
  - description: Deny node metrics egress from managed Pods outside the operator
      monitoring namespace without changing other traffic.
    endpointSelector:
      matchExpressions:
        - key: k8s:io.kubernetes.pod.namespace
          operator: Exists
        - key: k8s:io.kubernetes.pod.namespace
          operator: NotIn
          values:
            - pgcf-monitoring
    enableDefaultDeny:
      ingress: false
      egress: false
    egressDeny:
      - &a1
        toEntities:
          - host
          - remote-node
        toPorts:
          - ports:
              - port: "9100"
                protocol: TCP
  - description: Within monitoring, only the dedicated Prometheus service-account
      identity is exempt from the node metrics deny.
    endpointSelector:
      matchLabels:
        k8s:io.kubernetes.pod.namespace: pgcf-monitoring
      matchExpressions:
        - key: k8s:io.cilium.k8s.policy.serviceaccount
          operator: NotIn
          values:
            - pgcf-telemetry-kube-promet-prometheus
    enableDefaultDeny:
      ingress: false
      egress: false
    egressDeny:
      - *a1
