# Opt-in platform targets. Keep held until source, ownership and admission pass.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: pgcf-telemetry-targets
  namespace: flux-system
spec:
  suspend: true
  interval: 30m
  timeout: 2m
  path: ./infra/telemetry/targets
  # Only two stateless PodMonitors and two Rules belong to this inventory.
  prune: true
  deletionPolicy: Orphan
  sourceRef:
    kind: GitRepository
    name: pgcf-telemetry
  dependsOn:
    - name: pgcf-telemetry
      namespace: flux-system
    - name: pgcf-telemetry-rules
      namespace: flux-system
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: pgcf-telemetry-kube-promet-operator
      namespace: pgcf-monitoring
    - apiVersion: apps/v1
      kind: StatefulSet
      name: prometheus-pgcf-telemetry-kube-promet-prometheus
      namespace: pgcf-monitoring
