# Target-only correction source. Replace URL/pin for a reviewed adopter fork.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: pgcf-telemetry-targets-source
  namespace: flux-system
spec:
  interval: 30m
  timeout: 60s
  url: https://github.com/amerged-org/cloudflare-postgres
  ref:
    commit: c2d3ccb91d512f317ef7e74b3c0b12cedcb3c46c
---
# Held installation example. Existing writers require a guarded reference
# handoff; never replace their UID/inventory or blindly apply this over one.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: pgcf-telemetry-targets
  namespace: flux-system
spec:
  suspend: true
  interval: 30m
  timeout: 2m
  path: ./infra/telemetry/targets
  prune: true
  deletionPolicy: Orphan
  sourceRef:
    kind: GitRepository
    name: pgcf-telemetry-targets-source
  dependsOn:
    - name: pgcf-telemetry
      namespace: flux-system
    - name: pgcf-telemetry-rules
      namespace: flux-system
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: pgcf-telemetry-kube-promet-operator
      namespace: pgcf-monitoring
    - apiVersion: apps/v1
      kind: StatefulSet
      name: prometheus-pgcf-telemetry-kube-promet-prometheus
      namespace: pgcf-monitoring
