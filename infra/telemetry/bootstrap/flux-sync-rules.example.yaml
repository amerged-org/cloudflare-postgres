# Keep held until the core source/release/readiness and Rule ownership pass.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: pgcf-telemetry-rules
  namespace: flux-system
spec:
  suspend: true
  interval: 30m
  timeout: 2m
  path: ./infra/telemetry/rules
  # Only this stateless Rule inventory may be pruned; no namespaces/PVCs are here.
  prune: true
  deletionPolicy: Orphan
  sourceRef:
    kind: GitRepository
    name: pgcf-telemetry
  dependsOn:
    - name: pgcf-telemetry
      namespace: flux-system
