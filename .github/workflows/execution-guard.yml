name: Execution guard

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/execution-guard/**"
      - ".github/workflows/execution-guard.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # v6.1.0
        with:
          go-version: "1.27.1"
          cache-dependency-path: apps/execution-guard/go.sum
      - name: Check bounded execution guard cases
        working-directory: apps/execution-guard
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test ./... -count=1 -timeout=90s
