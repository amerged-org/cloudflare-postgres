name: Node runtime observer

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/node-runtime-observer/**"
      - ".github/workflows/node-runtime-observer.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # v6.1.0
        with:
          go-version: "1.27.1"
          cache-dependency-path: apps/node-runtime-observer/go.sum
      - name: Check the bounded observer package
        working-directory: apps/node-runtime-observer
        run: |
          test -z "$(gofmt -l observer cmd)"
          go vet ./observer ./cmd/node-runtime-observer
          go test ./observer ./cmd/node-runtime-observer -count=1 -timeout=90s
