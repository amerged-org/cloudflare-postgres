name: Regional controller image

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: regional-controller-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the selected revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select the immutable image tag
        id: image
        run: |
          pgcf_repository=$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          printf 'uri=ghcr.io/%s/regional-controller:%s\n' "$pgcf_repository" "$GITHUB_SHA" >> "$GITHUB_OUTPUT"
      - name: Authenticate the ephemeral package publisher
        env:
          PGCF_PACKAGE_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$PGCF_PACKAGE_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Build Linux amd64 from public inputs
        env:
          PGCF_IMAGE: ${{ steps.image.outputs.uri }}
        run: |
          docker build --platform linux/amd64 \
            --file apps/regional-controller/Dockerfile \
            --tag "$PGCF_IMAGE" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.licenses=Apache-2.0" .
      - name: Publish the reviewed revision
        env:
          PGCF_IMAGE: ${{ steps.image.outputs.uri }}
        run: |
          docker push "$PGCF_IMAGE"
          printf 'Image: `%s`\n' "$PGCF_IMAGE" >> "$GITHUB_STEP_SUMMARY"
