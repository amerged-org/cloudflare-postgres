# SPDX-License-Identifier: Apache-2.0
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      external_probe:
        description: Run only the supplemental Dev TCP probe
        type: boolean
        default: false
      node_network_probe:
        description: Run the full Dev native IPv4 node network proof in the external probe lane
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ (inputs.external_probe || inputs.node_network_probe) && 'external-probe' || 'build' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    if: github.event_name != 'workflow_dispatch' || (!inputs.external_probe && !inputs.node_network_probe)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    outputs:
      regional_image: ${{ steps.image_inputs.outputs.regional }}
      node_bootstrap_image: ${{ steps.image_inputs.outputs.node_bootstrap }}
      postgres_image: ${{ steps.image_inputs.outputs.postgres }}
      storage_image: ${{ steps.image_inputs.outputs.storage }}
      rust_gateway_image: ${{ steps.image_inputs.outputs.rust_gateway }}
      native_controller_image: ${{ steps.image_inputs.outputs.native_controller }}
      rust_bootstrap_relay_image: ${{ steps.image_inputs.outputs.rust_bootstrap_relay }}
      native_reclaimer_image: ${{ steps.image_inputs.outputs.native_reclaimer }}
      sandbox_controller_image: ${{ steps.image_inputs.outputs.sandbox_controller }}
    steps:
      - name: Check out the revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up pnpm at the version in package.json
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Read CI toolchain pins
        id: toolchain
        run: node scripts/ci/toolchain.mjs github-output >> "$GITHUB_OUTPUT"
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ steps.toolchain.outputs.node }}
          cache: pnpm
      - name: Validate the native CI toolchain
        run: node scripts/ci/toolchain.mjs check
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Set up the pinned Rust and Worker build tools
        run: |
          PGCF_RUST_VERSION=$(node -p 'require("./infra/platform/versions.lock.json").nativeRuntime.rustVersion')
          PGCF_RUST_TARGETS=$(node -p 'require("./infra/platform/versions.lock.json").ciToolchain.rustTargets.join(",")')
          PGCF_WORKER_BUILD_VERSION=$(node -p 'require("./infra/platform/versions.lock.json").rustEdge.workerBuildVersion')
          rustup toolchain install "$PGCF_RUST_VERSION" --profile minimal \
            --component rustfmt --component clippy --target "$PGCF_RUST_TARGETS"
          node scripts/ci/toolchain.mjs check-rust
          cargo install worker-build --version "$PGCF_WORKER_BUILD_VERSION" --locked
      - name: Verify the pinned Worker build binaries
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import { execFileSync } from 'node:child_process';
          import { appendFileSync, mkdirSync, readFileSync, writeFileSync } from 'node:fs';
          import { join } from 'node:path';
          const { archives } = JSON.parse(readFileSync('infra/platform/versions.lock.json', 'utf8')).rustEdge;
          assert.deepEqual(archives.map(x => x.environmentVariable).sort(), ['ESBUILD_BIN', 'WASM_BINDGEN_BIN', 'WASM_OPT_BIN']);
          const directory = join(process.env.RUNNER_TEMP, 'pgcf-worker-build-tools');
          mkdirSync(directory, { recursive: true });
          const sha256 = bytes => createHash('sha256').update(bytes).digest('hex');
          for (const tool of archives) {
            assert.equal(tool.os, 'linux'); assert.equal(tool.architecture, 'amd64');
            assert.match(tool.name, /^[a-z-]+$/); assert.match(tool.member, /^[A-Za-z0-9._/-]+$/); assert.ok(!tool.member.split('/').includes('..'));
            const response = await fetch(tool.url, { signal: AbortSignal.timeout(180_000) });
            assert.equal(response.ok, true); assert.equal(new URL(response.url).protocol, 'https:');
            const archive = Buffer.from(await response.arrayBuffer());
            assert.ok(archive.length < 128 * 1024 * 1024); assert.equal(sha256(archive), tool.sha256);
            const file = join(directory, tool.name + '.tgz'); writeFileSync(file, archive);
            const binary = execFileSync('tar', ['-xOf', file, tool.member], { timeout: 30_000, maxBuffer: 192 * 1024 * 1024 });
            assert.equal(sha256(binary), tool.binarySha256);
            const executable = join(directory, tool.name); writeFileSync(executable, binary, { mode: 0o755 });
            appendFileSync(process.env.GITHUB_ENV, `${tool.environmentVariable}=${executable}\n`);
          }
          JS
      - name: Install the pinned Protobuf compiler for host Rust checks
        run: |
          PGCF_PROTOC_DIR="$RUNNER_TEMP/pgcf-protoc"
          PGCF_PROTOC_URL=$(node -p 'require("./infra/platform/versions.lock.json").nativeRuntime.protoc.archives.find(v => v.os === "linux" && v.architecture === "amd64").url')
          PGCF_PROTOC_SHA=$(node -p 'require("./infra/platform/versions.lock.json").nativeRuntime.protoc.archives.find(v => v.os === "linux" && v.architecture === "amd64").sha256')
          PGCF_PROTOC_BINARY_SHA=$(node -p 'require("./infra/platform/versions.lock.json").nativeRuntime.protoc.archives.find(v => v.os === "linux" && v.architecture === "amd64").binarySha256')
          PGCF_PROTOC_VERSION=$(node -p 'require("./infra/platform/versions.lock.json").nativeRuntime.protoc.version')
          mkdir -m 700 "$PGCF_PROTOC_DIR"
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
            --connect-timeout 15 --max-time 120 --output "$PGCF_PROTOC_DIR/compiler.zip" "$PGCF_PROTOC_URL"
          printf '%s  %s\n' "$PGCF_PROTOC_SHA" "$PGCF_PROTOC_DIR/compiler.zip" | sha256sum --check --status
          unzip -q "$PGCF_PROTOC_DIR/compiler.zip" -d "$PGCF_PROTOC_DIR"
          printf '%s  %s\n' "$PGCF_PROTOC_BINARY_SHA" "$PGCF_PROTOC_DIR/bin/protoc" | sha256sum --check --status
          test "$("$PGCF_PROTOC_DIR/bin/protoc" --version)" = "libprotoc $PGCF_PROTOC_VERSION"
          printf 'PROTOC=%s\nPROTOC_INCLUDE=%s\n' "$PGCF_PROTOC_DIR/bin/protoc" "$PGCF_PROTOC_DIR/include" >> "$GITHUB_ENV"
      - name: Select affected image inputs
        id: image_inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/image-inputs.ts >> "$GITHUB_OUTPUT"
      - name: Check public plan privacy
        run: node scripts/ci/plan-privacy.ts
      - name: Verify the native Talos test client
        run: |
          PGCF_TEST_TALOSCTL="$RUNNER_TEMP/pgcf-test-talosctl"
          PGCF_TEST_TALOSCTL_URL=$(node -p 'require("./infra/platform/versions.lock.json").bootstrapClients.talos.archives.find(v => v.os === "linux" && v.architecture === "amd64").url')
          PGCF_TEST_TALOSCTL_SHA=$(node -p 'require("./infra/platform/versions.lock.json").bootstrapClients.talos.archives.find(v => v.os === "linux" && v.architecture === "amd64").sha256')
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
            --connect-timeout 15 --max-time 120 \
            --output "$PGCF_TEST_TALOSCTL" \
            "$PGCF_TEST_TALOSCTL_URL"
          printf '%s  %s\n' "$PGCF_TEST_TALOSCTL_SHA" \
            "$PGCF_TEST_TALOSCTL" | sha256sum --check --status
          chmod 755 "$PGCF_TEST_TALOSCTL"
          printf 'PGCF_TEST_TALOSCTL=%s\n' "$PGCF_TEST_TALOSCTL" >> "$GITHUB_ENV"
      - name: Verify the locked Kubernetes manifest test client
        run: |
          PGCF_TEST_KUBECTL="$RUNNER_TEMP/pgcf-test-kubectl"
          PGCF_TEST_KUBECTL_URL=$(node -p 'require("./infra/platform/versions.lock.json").bootstrapClients.kubectl.archives.find(v => v.os === "linux" && v.architecture === "amd64").url')
          PGCF_TEST_KUBECTL_SHA=$(node -p 'require("./infra/platform/versions.lock.json").bootstrapClients.kubectl.archives.find(v => v.os === "linux" && v.architecture === "amd64").sha256')
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
            --connect-timeout 15 --max-time 120 --output "$PGCF_TEST_KUBECTL" "$PGCF_TEST_KUBECTL_URL"
          printf '%s  %s\n' "$PGCF_TEST_KUBECTL_SHA" "$PGCF_TEST_KUBECTL" | sha256sum --check --status
          chmod 755 "$PGCF_TEST_KUBECTL"
          printf 'PGCF_TEST_KUBECTL=%s\n' "$PGCF_TEST_KUBECTL" >> "$GITHUB_ENV"
      - name: Lint
        run: |
          pnpm lint
          pnpm exec eslint --no-ignore infra/talos/sandbox/*.ts
      - name: Check formatting
        run: pnpm format:check
      - name: Typecheck
        run: |
          pnpm typecheck
          pnpm exec tsc -p scripts/ci/tsconfig.json
          pnpm exec tsc -p infra/talos/sandbox/tsconfig.json
      - name: Check the native runtime and Worker contracts
        run: |
          node packages/contracts/native/generate.ts --check
          node packages/contracts/native/generate-controller.ts --check
          node packages/contracts/native/generate-power.ts --check
          node packages/contracts/native/generate-measurements.ts --check
          node packages/contracts/native/generate-bootstrap.ts --check
          node packages/contracts/native/generate-reclaim.ts --check
          cargo fmt --all -- --check
          cargo test --workspace --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo clippy -p pgcf-edge-rust --target wasm32-unknown-unknown --locked -- -D warnings
      - name: Build the Worker once for actual Workerd tests
        run: pnpm -r --if-present build
      - name: Test
        run: |
          pnpm test
          node --test infra/talos/publish-storage-capacity.test.ts
          node --test infra/platform/release-candidate.test.ts
          node --test infra/talos/sandbox/*.test.ts
          node --test scripts/ci/*.test.ts
          node packages/contracts/native/generate-compute-pool.ts --check
      - name: Check the native prepared runtime against the actual Linux kernel
        run: |
          PGCF_RUST_BUILDER=$(node -p 'require("./infra/platform/versions.lock.json").nativeRuntime.testBuilderImage')
          PGCF_RUST_VERSION=$(node -p 'require("./infra/platform/versions.lock.json").nativeRuntime.rustVersion')
          PGCF_SLOT_TEST_IMAGE="pgcf-node-runtime-test:${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          PGCF_SLOT_TEST_CONTAINER="pgcf-slot-kernel-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          trap 'docker rm --force "$PGCF_SLOT_TEST_CONTAINER" >/dev/null 2>&1 || true' EXIT
          docker build --platform linux/amd64 --file apps/node-runtime/Dockerfile \
            --build-arg RUST_BUILDER="$PGCF_RUST_BUILDER" --build-arg RUST_VERSION="$PGCF_RUST_VERSION" \
            --tag "$PGCF_SLOT_TEST_IMAGE" .
          timeout 90 docker run --rm --name "$PGCF_SLOT_TEST_CONTAINER" --network none \
            --cpus 2 --memory 1g --pids-limit 64 --read-only \
            --tmpfs /tmp:rw,nosuid,nodev,size=16m,mode=1777 \
            --cap-drop ALL --cap-add SYS_ADMIN --cap-add SETPCAP --cap-add SYS_PTRACE \
            --security-opt seccomp=unconfined --security-opt no-new-privileges \
            "$PGCF_SLOT_TEST_IMAGE"
      - name: Check the shared sandbox against ordinary containerd and isolated CRI namespaces
        run: node infra/talos/sandbox/run-proof.ts
      - name: Render the Kubernetes manifests
        run: |
          test -x "$PGCF_TEST_KUBECTL"
          for dir in infra/platform infra/platform/regional infra/platform/regional-gateway-native infra/platform/regional-native infra/platform/bootstrap-relay infra/platform/bootstrap-relay-native; do
            if [ -f "$dir/kustomization.yaml" ]; then
              echo "kubectl kustomize $dir"
              "$PGCF_TEST_KUBECTL" kustomize "$dir" > /dev/null
            else
              echo "skipping $dir: no kustomization.yaml"
            fi
          done

  image:
    needs: check
    if: needs.check.outputs.regional_image == 'true' && github.ref == 'refs/heads/main' && !inputs.external_probe && !inputs.node_network_probe && (github.event_name == 'workflow_dispatch' || github.event_name == 'push')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/amerged-org/pgcf-regional
    steps:
      - name: Check out the revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check regional entry points
        id: entries
        run: |
          if [ -f apps/regional/src/agent/main.ts ] && [ -f apps/regional/src/gateway/main.ts ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Set up pnpm at the version in package.json
        if: steps.entries.outputs.present == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Read CI toolchain pins
        id: toolchain
        run: node scripts/ci/toolchain.mjs github-output >> "$GITHUB_OUTPUT"
      - name: Set up Node
        if: steps.entries.outputs.present == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ steps.toolchain.outputs.node }}
          cache: pnpm
      - name: Validate the native CI toolchain
        if: steps.entries.outputs.present == 'true'
        run: node scripts/ci/toolchain.mjs check
      - name: Install qualification dependencies
        if: steps.entries.outputs.present == 'true'
        run: CI=true pnpm install --frozen-lockfile --ignore-scripts
      - name: Build the linux/amd64 image
        if: steps.entries.outputs.present == 'true'
        run: |
          mkdir -m 700 "$RUNNER_TEMP/pgcf-image-gate"
          docker buildx build --platform linux/amd64 --load \
            --provenance=false --sbom=false \
            --iidfile "$RUNNER_TEMP/pgcf-image-gate/image.id" \
            --file apps/regional/Dockerfile \
            --tag "$IMAGE:sha-${GITHUB_SHA::12}" \
            --tag "$IMAGE:latest" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.licenses=Apache-2.0" \
            .
      - name: Fail if the image contains .env or .pem files
        if: steps.entries.outputs.present == 'true'
        run: |
          found=$(docker run --rm --platform linux/amd64 --cpus 2 --memory 2g --network none --user 0 --entrypoint find "$IMAGE:latest" \
            / -xdev -type f \( -name '.env*' -o -name '.dev.vars*' -o -name '*.pem' -o -name '*.key' -o -name kubeconfig -o -name talosconfig \) -print)
          if [ -n "$found" ]; then
            echo "Forbidden files in the image:"
            echo "$found"
            exit 1
          fi
      - name: Load agent, gateway and relay runtime modules
        if: steps.entries.outputs.present == 'true'
        run: |
          node scripts/ci/image-qualification.ts --profile regional runtime "$(cat "$RUNNER_TEMP/pgcf-image-gate/image.id")"
      - name: Qualify every shipped image layer before publishing
        if: steps.entries.outputs.present == 'true'
        run: |
          node scripts/ci/image-qualification.ts --profile regional qualify "$IMAGE:latest" \
            "$(cat "$RUNNER_TEMP/pgcf-image-gate/image.id")" "$GITHUB_SHA" \
            "https://github.com/$GITHUB_REPOSITORY" "$RUNNER_TEMP/pgcf-image-gate/qualification.json"
          {
            echo 'Image qualification (PGCF-built files and image metadata; upstream digest provenance checked separately):'
            echo '```json'
            cat "$RUNNER_TEMP/pgcf-image-gate/qualification.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Log in to GHCR
        if: steps.entries.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Push the image and record its digest
        if: steps.entries.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          image_id=$(cat "$RUNNER_TEMP/pgcf-image-gate/image.id")
          node scripts/ci/image-qualification.ts --profile regional verify "$IMAGE:sha-${GITHUB_SHA::12}" \
            "$image_id" "$GITHUB_SHA" "https://github.com/$GITHUB_REPOSITORY" \
            "$RUNNER_TEMP/pgcf-image-gate/qualification.json"
          docker push "$IMAGE:sha-${GITHUB_SHA::12}"
          node scripts/ci/image-qualification.ts --profile regional registry "$IMAGE:sha-${GITHUB_SHA::12}" \
            "$image_id" "$GITHUB_SHA" "https://github.com/$GITHUB_REPOSITORY" \
            "$RUNNER_TEMP/pgcf-image-gate/qualification.json" "$RUNNER_TEMP/pgcf-image-gate/registry-sha.json"
          digest=$(node --input-type=module -e 'import {readFileSync} from "node:fs"; console.log(JSON.parse(readFileSync(process.argv[1], "utf8")).digest)' "$RUNNER_TEMP/pgcf-image-gate/registry-sha.json")
          node scripts/ci/image-qualification.ts --profile regional promote "$IMAGE" \
            "$image_id" "$GITHUB_SHA" "https://github.com/$GITHUB_REPOSITORY" \
            "$RUNNER_TEMP/pgcf-image-gate/qualification.json" "$RUNNER_TEMP/pgcf-image-gate/registry-sha.json"
          node scripts/ci/image-qualification.ts --profile regional registry "$IMAGE:latest" \
            "$image_id" "$GITHUB_SHA" "https://github.com/$GITHUB_REPOSITORY" \
            "$RUNNER_TEMP/pgcf-image-gate/qualification.json" "$RUNNER_TEMP/pgcf-image-gate/registry-latest.json"
          {
            echo "Image digest: \`$IMAGE@$digest\`"
            echo "Tags: \`sha-${GITHUB_SHA::12}\`, \`latest\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Remove image qualification files
        if: always() && steps.entries.outputs.present == 'true'
        run: rm -rf "$RUNNER_TEMP/pgcf-image-gate"

  node_bootstrap_image:
    needs: check
    if: needs.check.outputs.node_bootstrap_image == 'true' && github.ref == 'refs/heads/main' && !inputs.external_probe && !inputs.node_network_probe && (github.event_name == 'workflow_dispatch' || github.event_name == 'push')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/amerged-org/pgcf-node-bootstrap
    steps:
      - name: Check out the revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check bootstrap entry points
        run: |
          test -f apps/node-bootstrap/src/server.ts
          test -f apps/node-bootstrap/src/proxy-command.ts
      - name: Set up pnpm at the version in package.json
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Read CI toolchain pins
        id: toolchain
        run: node scripts/ci/toolchain.mjs github-output >> "$GITHUB_OUTPUT"
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ steps.toolchain.outputs.node }}
          cache: pnpm
      - name: Validate the native CI toolchain
        run: node scripts/ci/toolchain.mjs check
      - name: Install qualification dependencies
        run: CI=true pnpm install --frozen-lockfile --ignore-scripts
      - name: Build the linux/amd64 image
        run: |
          mkdir -m 700 "$RUNNER_TEMP/pgcf-bootstrap-image-gate"
          docker buildx build --platform linux/amd64 --load \
            --provenance=false --sbom=false \
            --iidfile "$RUNNER_TEMP/pgcf-bootstrap-image-gate/image.id" \
            --file apps/node-bootstrap/Dockerfile \
            --tag "$IMAGE:sha-${GITHUB_SHA::12}" \
            --tag "$IMAGE:latest" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.licenses=Apache-2.0" \
            .
      - name: Fail if the image contains .env or .pem files
        run: |
          found=$(docker run --rm --platform linux/amd64 --cpus 2 --memory 2g --network none --user 0 --entrypoint find "$IMAGE:latest" \
            / -xdev -type f \( -name '.env*' -o -name '.dev.vars*' -o -name '*.pem' -o -name '*.key' -o -name kubeconfig -o -name talosconfig \) -print)
          if [ -n "$found" ]; then
            echo "Forbidden files in the image:"
            echo "$found"
            exit 1
          fi
      - name: Load bootstrap modules and verify native clients
        run: |
          node scripts/ci/image-qualification.ts --profile node-bootstrap runtime "$(cat "$RUNNER_TEMP/pgcf-bootstrap-image-gate/image.id")"
      - name: Qualify every shipped image layer before publishing
        run: |
          node scripts/ci/image-qualification.ts --profile node-bootstrap qualify "$IMAGE:latest" \
            "$(cat "$RUNNER_TEMP/pgcf-bootstrap-image-gate/image.id")" "$GITHUB_SHA" \
            "https://github.com/$GITHUB_REPOSITORY" "$RUNNER_TEMP/pgcf-bootstrap-image-gate/qualification.json"
          {
            echo 'Image qualification (PGCF-built files and image metadata; upstream digest provenance checked separately):'
            echo '```json'
            cat "$RUNNER_TEMP/pgcf-bootstrap-image-gate/qualification.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Log in to GHCR
        env:
          GH_TOKEN: ${{ github.token }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Push the image and record its digest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          image_id=$(cat "$RUNNER_TEMP/pgcf-bootstrap-image-gate/image.id")
          node scripts/ci/image-qualification.ts --profile node-bootstrap verify "$IMAGE:sha-${GITHUB_SHA::12}" \
            "$image_id" "$GITHUB_SHA" "https://github.com/$GITHUB_REPOSITORY" \
            "$RUNNER_TEMP/pgcf-bootstrap-image-gate/qualification.json"
          docker push "$IMAGE:sha-${GITHUB_SHA::12}"
          node scripts/ci/image-qualification.ts --profile node-bootstrap registry "$IMAGE:sha-${GITHUB_SHA::12}" \
            "$image_id" "$GITHUB_SHA" "https://github.com/$GITHUB_REPOSITORY" \
            "$RUNNER_TEMP/pgcf-bootstrap-image-gate/qualification.json" "$RUNNER_TEMP/pgcf-bootstrap-image-gate/registry-sha.json"
          digest=$(node --input-type=module -e 'import {readFileSync} from "node:fs"; console.log(JSON.parse(readFileSync(process.argv[1], "utf8")).digest)' "$RUNNER_TEMP/pgcf-bootstrap-image-gate/registry-sha.json")
          node scripts/ci/image-qualification.ts --profile node-bootstrap promote "$IMAGE" \
            "$image_id" "$GITHUB_SHA" "https://github.com/$GITHUB_REPOSITORY" \
            "$RUNNER_TEMP/pgcf-bootstrap-image-gate/qualification.json" "$RUNNER_TEMP/pgcf-bootstrap-image-gate/registry-sha.json"
          node scripts/ci/image-qualification.ts --profile node-bootstrap registry "$IMAGE:latest" \
            "$image_id" "$GITHUB_SHA" "https://github.com/$GITHUB_REPOSITORY" \
            "$RUNNER_TEMP/pgcf-bootstrap-image-gate/qualification.json" "$RUNNER_TEMP/pgcf-bootstrap-image-gate/registry-latest.json"
          {
            echo "Image digest: \`$IMAGE@$digest\`"
            echo "Tags: \`sha-${GITHUB_SHA::12}\`, \`latest\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Remove image qualification files
        if: always()
        run: rm -rf "$RUNNER_TEMP/pgcf-bootstrap-image-gate"

  postgres_image:
    needs: check
    if: needs.check.outputs.postgres_image == 'true' && github.ref == 'refs/heads/main' && !inputs.external_probe && !inputs.node_network_probe && (github.event_name == 'workflow_dispatch' || github.event_name == 'push')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/amerged-org/pgcf-postgres
    steps:
      - name: Check out the revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm at the version in package.json
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Read CI toolchain pins
        id: toolchain
        run: node scripts/ci/toolchain.mjs github-output >> "$GITHUB_OUTPUT"
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ steps.toolchain.outputs.node }}
          cache: pnpm
      - name: Validate the native CI toolchain
        run: node scripts/ci/toolchain.mjs check
      - name: Install qualification dependencies
        run: CI=true pnpm install --frozen-lockfile --ignore-scripts
      - name: Build the linux/amd64 image
        run: |
          mkdir -m 700 "$RUNNER_TEMP/pgcf-postgres-image-gate"
          docker buildx build --platform linux/amd64 --load \
            --provenance=false --sbom=false \
            --iidfile "$RUNNER_TEMP/pgcf-postgres-image-gate/image.id" \
            --file infra/postgres/Dockerfile \
            --tag "$IMAGE:sha-${GITHUB_SHA::12}" \
            --tag "$IMAGE:latest" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.licenses=Apache-2.0 AND PostgreSQL" \
            infra/postgres
      - name: Fail if the image contains .env or .pem files
        run: |
          found=$(docker run --rm --platform linux/amd64 --cpus 2 --memory 2g --network none --user 0 --entrypoint find "$IMAGE:latest" \
            / -xdev -type f \( -name '.env*' -o -name '.dev.vars*' -o -name '*.pem' -o -name '*.key' -o -name kubeconfig -o -name talosconfig \) -print)
          if [ -n "$found" ]; then
            echo "Forbidden files in the image:"
            echo "$found"
            exit 1
          fi
      - name: Verify PostgreSQL and patched pgvector with actual SQL
        run: |
          PGCF_TEST_POSTGRES_IMAGE="$IMAGE:sha-${GITHUB_SHA::12}" node --test infra/postgres/image.test.mjs
          node scripts/ci/image-qualification.ts --profile postgres runtime "$(cat "$RUNNER_TEMP/pgcf-postgres-image-gate/image.id")"
      - name: Qualify every shipped image layer before publishing
        run: |
          node scripts/ci/image-qualification.ts --profile postgres qualify "$IMAGE:latest" \
            "$(cat "$RUNNER_TEMP/pgcf-postgres-image-gate/image.id")" "$GITHUB_SHA" \
            "https://github.com/$GITHUB_REPOSITORY" "$RUNNER_TEMP/pgcf-postgres-image-gate/qualification.json"
          {
            echo 'Image qualification (PGCF-built files and image metadata; upstream digest provenance checked separately):'
            echo '```json'
            cat "$RUNNER_TEMP/pgcf-postgres-image-gate/qualification.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Log in to GHCR
        env:
          GH_TOKEN: ${{ github.token }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Push the image and record its digest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          image_id=$(cat "$RUNNER_TEMP/pgcf-postgres-image-gate/image.id")
          node scripts/ci/image-qualification.ts --profile postgres verify "$IMAGE:sha-${GITHUB_SHA::12}" \
            "$image_id" "$GITHUB_SHA" "https://github.com/$GITHUB_REPOSITORY" \
            "$RUNNER_TEMP/pgcf-postgres-image-gate/qualification.json"
          docker push "$IMAGE:sha-${GITHUB_SHA::12}"
          node scripts/ci/image-qualification.ts --profile postgres registry "$IMAGE:sha-${GITHUB_SHA::12}" \
            "$image_id" "$GITHUB_SHA" "https://github.com/$GITHUB_REPOSITORY" \
            "$RUNNER_TEMP/pgcf-postgres-image-gate/qualification.json" "$RUNNER_TEMP/pgcf-postgres-image-gate/registry-sha.json"
          digest=$(node --input-type=module -e 'import {readFileSync} from "node:fs"; console.log(JSON.parse(readFileSync(process.argv[1], "utf8")).digest)' "$RUNNER_TEMP/pgcf-postgres-image-gate/registry-sha.json")
          node scripts/ci/image-qualification.ts --profile postgres promote "$IMAGE" \
            "$image_id" "$GITHUB_SHA" "https://github.com/$GITHUB_REPOSITORY" \
            "$RUNNER_TEMP/pgcf-postgres-image-gate/qualification.json" "$RUNNER_TEMP/pgcf-postgres-image-gate/registry-sha.json"
          node scripts/ci/image-qualification.ts --profile postgres registry "$IMAGE:latest" \
            "$image_id" "$GITHUB_SHA" "https://github.com/$GITHUB_REPOSITORY" \
            "$RUNNER_TEMP/pgcf-postgres-image-gate/qualification.json" "$RUNNER_TEMP/pgcf-postgres-image-gate/registry-latest.json"
          {
            echo "Image digest: \`$IMAGE@$digest\`"
            echo "Tags: \`sha-${GITHUB_SHA::12}\`, \`latest\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Copy the qualified PostgreSQL manifest to public runtime storage
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          image_id=$(cat "$RUNNER_TEMP/pgcf-postgres-image-gate/image.id")
          digest=$(node --input-type=module -e 'import {readFileSync} from "node:fs"; console.log(JSON.parse(readFileSync(process.argv[1], "utf8")).digest)' "$RUNNER_TEMP/pgcf-postgres-image-gate/registry-sha.json")
          postgres_version=$(node --input-type=module -e 'import {readFileSync} from "node:fs"; process.stdout.write(JSON.parse(readFileSync("infra/postgres/sources.lock.json", "utf8")).postgresql.version)')
          public_image="ghcr.io/amerged-org/pgcf-regional:${postgres_version}-pgcf-sha-${GITHUB_SHA::12}"
          docker buildx imagetools create --prefer-index=false --tag "$public_image" "$IMAGE@$digest"
          node scripts/ci/image-qualification.ts --profile postgres registry "$public_image" \
            "$image_id" "$GITHUB_SHA" "https://github.com/$GITHUB_REPOSITORY" \
            "$RUNNER_TEMP/pgcf-postgres-image-gate/qualification.json" "$RUNNER_TEMP/pgcf-postgres-image-gate/public-postgres-sha.json"
          node --input-type=module -e 'import {readFileSync} from "node:fs"; import {assertEquivalentRegistryReadbacks} from "./scripts/ci/registry.ts"; const read=p=>JSON.parse(readFileSync(p,"utf8")); assertEquivalentRegistryReadbacks(read(process.argv[1]),read(process.argv[2]));' \
            "$RUNNER_TEMP/pgcf-postgres-image-gate/registry-sha.json" "$RUNNER_TEMP/pgcf-postgres-image-gate/public-postgres-sha.json"
          echo "Public PostgreSQL digest: $public_image@$digest" >> "$GITHUB_STEP_SUMMARY"
      - name: Remove image qualification files
        if: always()
        run: rm -rf "$RUNNER_TEMP/pgcf-postgres-image-gate"

  external_probe:
    if: github.event_name == 'workflow_dispatch' && (inputs.external_probe || inputs.node_network_probe) && github.ref == 'refs/heads/main' && github.event.repository.private == false
    runs-on: macos-15
    timeout-minutes: 12
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Check out the approved main revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Read CI toolchain pins
        id: toolchain
        run: node scripts/ci/toolchain.mjs github-output >> "$GITHUB_OUTPUT"
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ steps.toolchain.outputs.node }}
      - name: Set up pnpm for the full node proof
        if: inputs.node_network_probe
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Install acceptance dependencies
        if: inputs.node_network_probe
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Probe the approved Dev targets without publishing their addresses
        if: "!inputs.node_network_probe"
        env:
          GH_TOKEN: ${{ github.token }}
          PGCF_E2E_EXTERNAL_PROBE_CONFIG: ${{ secrets.PGCF_E2E_EXTERNAL_PROBE_CONFIG }}
          NODE_DEBUG: ""
          NODE_OPTIONS: ""
        run: node scripts/e2e/src/external-probe.ts
      - name: Scan every IPv4 TCP port from the actual hosted native source
        if: inputs.node_network_probe
        env:
          GH_TOKEN: ${{ github.token }}
          PGCF_NETWORK_HOSTED_CONFIG: ${{ secrets.PGCF_NETWORK_HOSTED_CONFIG }}
          NODE_DEBUG: ""
          NODE_OPTIONS: ""
        run: node scripts/e2e/src/node-network-hosted.ts
      - name: Attest the sanitized report
        if: "!inputs.node_network_probe"
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-path: ${{ runner.temp }}/pgcf-e6-native.json
          show-summary: false
      - name: Upload only the sanitized report
        if: "!inputs.node_network_probe"
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: pgcf-e6-native
          path: ${{ runner.temp }}/pgcf-e6-native.json
          if-no-files-found: error
          retention-days: 1
          overwrite: false
      - name: Attest the encrypted complete node proof
        if: inputs.node_network_probe
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-path: ${{ runner.temp }}/pgcf-node-network.enc.json
          show-summary: false
      - name: Upload only encrypted node network evidence
        if: inputs.node_network_probe
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: pgcf-node-network
          path: ${{ runner.temp }}/pgcf-node-network.enc.json
          if-no-files-found: error
          retention-days: 1
          overwrite: false
      - name: Remove private acceptance files
        if: always()
        run: rm -f "$RUNNER_TEMP/pgcf-node-network.enc.json" "$RUNNER_TEMP/pgcf-e6-native.json"

  storage_image:
    needs: check
    if: needs.check.outputs.storage_image == 'true' && github.ref == 'refs/heads/main' && !inputs.external_probe && !inputs.node_network_probe && (github.event_name == 'workflow_dispatch' || github.event_name == 'push')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/amerged-org/pgcf-regional
    steps:
      - name: Check out the revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Read CI toolchain pins
        id: toolchain
        run: node scripts/ci/toolchain.mjs github-output >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ steps.toolchain.outputs.node }}
          cache: pnpm
      - name: Validate the native CI toolchain
        run: node scripts/ci/toolchain.mjs check
      - name: Install qualification dependencies
        run: CI=true pnpm install --frozen-lockfile --ignore-scripts
      - name: Build and check the pinned storage image
        run: |
          mkdir -m 700 "$RUNNER_TEMP/pgcf-storage-image-gate"
          docker buildx build --platform linux/amd64 --load --provenance=false --sbom=false \
            --network none --file infra/storage/Dockerfile \
            --iidfile "$RUNNER_TEMP/pgcf-storage-image-gate/image.id" \
            --tag "$IMAGE:lvm-thin-sha-${GITHUB_SHA::12}" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label 'org.opencontainers.image.licenses=Apache-2.0 AND GPL-3.0-only' \
            infra/storage
          PGCF_TEST_STORAGE_IMAGE="$IMAGE:lvm-thin-sha-${GITHUB_SHA::12}" node --test infra/storage/image.test.mjs
          node scripts/ci/image-qualification.ts --profile storage runtime "$(cat "$RUNNER_TEMP/pgcf-storage-image-gate/image.id")"
          node scripts/ci/image-qualification.ts --profile storage qualify "$IMAGE:lvm-thin-sha-${GITHUB_SHA::12}" \
            "$(cat "$RUNNER_TEMP/pgcf-storage-image-gate/image.id")" "$GITHUB_SHA" \
