        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          PGCF_STORAGE_ID=$(cat "$RUNNER_TEMP/pgcf-storage-image-gate/image.id")
          node scripts/ci/image-qualification.ts --profile storage verify "$IMAGE:lvm-thin-sha-${GITHUB_SHA::12}" \
            "$PGCF_STORAGE_ID" "$GITHUB_SHA" "https://github.com/$GITHUB_REPOSITORY" "$RUNNER_TEMP/pgcf-storage-image-gate/qualification.json"
          docker push "$IMAGE:lvm-thin-sha-${GITHUB_SHA::12}"
          node scripts/ci/image-qualification.ts --profile storage registry "$IMAGE:lvm-thin-sha-${GITHUB_SHA::12}" \
            "$PGCF_STORAGE_ID" "$GITHUB_SHA" "https://github.com/$GITHUB_REPOSITORY" \
            "$RUNNER_TEMP/pgcf-storage-image-gate/qualification.json" "$RUNNER_TEMP/pgcf-storage-image-gate/registry.json"
          cat "$RUNNER_TEMP/pgcf-storage-image-gate/qualification.json" >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/pgcf-storage-image-gate/registry.json" >> "$GITHUB_STEP_SUMMARY"
      - name: Remove storage qualification files
        if: always()
        run: rm -rf "$RUNNER_TEMP/pgcf-storage-image-gate"

  native_runtime_images:
    needs: check
    if: (needs.check.outputs.rust_gateway_image == 'true' || needs.check.outputs.native_controller_image == 'true' || needs.check.outputs.rust_bootstrap_relay_image == 'true' || needs.check.outputs.native_reclaimer_image == 'true' || needs.check.outputs.sandbox_controller_image == 'true') && github.ref == 'refs/heads/main' && !inputs.external_probe && !inputs.node_network_probe && (github.event_name == 'workflow_dispatch' || github.event_name == 'push')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    outputs:
      extension_ref: ${{ steps.native_artifacts.outputs.extension_ref }}
      recipe_ref: ${{ steps.native_artifacts.outputs.recipe_ref }}
    env:
      IMAGE: ghcr.io/amerged-org/pgcf-regional
      PGCF_BUILD_GATEWAY: ${{ needs.check.outputs.rust_gateway_image }}
      PGCF_BUILD_CONTROLLER: ${{ needs.check.outputs.native_controller_image }}
      PGCF_BUILD_RELAY: ${{ needs.check.outputs.rust_bootstrap_relay_image }}
      PGCF_BUILD_RECLAIMER: ${{ needs.check.outputs.native_reclaimer_image }}
      PGCF_BUILD_SANDBOX: ${{ needs.check.outputs.sandbox_controller_image }}
    steps:
      - name: Check out the revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Read CI toolchain pins
        id: toolchain
        run: node scripts/ci/toolchain.mjs github-output >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ steps.toolchain.outputs.node }}
          cache: pnpm
      - name: Validate the native CI toolchain
        run: node scripts/ci/toolchain.mjs check
      - name: Install qualification dependencies
        run: CI=true pnpm install --frozen-lockfile --ignore-scripts
      - name: Build, qualify and publish only selected native artifacts
        id: native_artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PGCF_RUST_BUILDER=$(node -p 'require("./infra/platform/versions.lock.json").nativeRuntime.testBuilderImage')
          PGCF_RUST_VERSION=$(node -p 'require("./infra/platform/versions.lock.json").nativeRuntime.rustVersion')
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          mkdir -m 700 "$RUNNER_TEMP/pgcf-native-image-gate"
          for PGCF_PROFILE in rust-gateway native-controller rust-bootstrap-relay native-reclaimer sandbox-controller; do
            case "$PGCF_PROFILE" in
              rust-gateway) [ "$PGCF_BUILD_GATEWAY" = true ] || continue; PGCF_DOCKERFILE=apps/native-gateway/Dockerfile ;;
              native-controller) [ "$PGCF_BUILD_CONTROLLER" = true ] || continue; PGCF_DOCKERFILE=apps/native-controller/Dockerfile ;;
              rust-bootstrap-relay) [ "$PGCF_BUILD_RELAY" = true ] || continue; PGCF_DOCKERFILE=apps/native-bootstrap-relay/Dockerfile ;;
              native-reclaimer) [ "$PGCF_BUILD_RECLAIMER" = true ] || continue; PGCF_DOCKERFILE=apps/native-reclaimer/Dockerfile ;;
              sandbox-controller) [ "$PGCF_BUILD_SANDBOX" = true ] || continue; PGCF_DOCKERFILE=apps/sandbox-controller/Dockerfile ;;
            esac
            PGCF_GATE="$RUNNER_TEMP/pgcf-native-image-gate/$PGCF_PROFILE"
            mkdir -m 700 "$PGCF_GATE"
            PGCF_NATIVE_TAG="$IMAGE:$PGCF_PROFILE-sha-${GITHUB_SHA::12}"
            docker buildx build --platform linux/amd64 --load --provenance=false --sbom=false \
              --file "$PGCF_DOCKERFILE" --iidfile "$PGCF_GATE/image.id" \
              --build-arg RUST_BUILDER="$PGCF_RUST_BUILDER" --build-arg RUST_VERSION="$PGCF_RUST_VERSION" \
              --build-arg SOURCE_COMMIT="$GITHUB_SHA" --tag "$PGCF_NATIVE_TAG" \
              --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
              --label "org.opencontainers.image.revision=$GITHUB_SHA" \
              --label 'org.opencontainers.image.licenses=Apache-2.0' .
            PGCF_NATIVE_ID=$(cat "$PGCF_GATE/image.id")
            node scripts/ci/image-qualification.ts --profile "$PGCF_PROFILE" runtime "$PGCF_NATIVE_ID"
            node scripts/ci/image-qualification.ts --profile "$PGCF_PROFILE" qualify "$PGCF_NATIVE_TAG" \
              "$PGCF_NATIVE_ID" "$GITHUB_SHA" "https://github.com/$GITHUB_REPOSITORY" "$PGCF_GATE/qualification.json"
            node scripts/ci/image-qualification.ts --profile "$PGCF_PROFILE" verify "$PGCF_NATIVE_TAG" \
              "$PGCF_NATIVE_ID" "$GITHUB_SHA" "https://github.com/$GITHUB_REPOSITORY" "$PGCF_GATE/qualification.json"
            docker push "$PGCF_NATIVE_TAG"
            node scripts/ci/image-qualification.ts --profile "$PGCF_PROFILE" registry "$PGCF_NATIVE_TAG" \
              "$PGCF_NATIVE_ID" "$GITHUB_SHA" "https://github.com/$GITHUB_REPOSITORY" \
              "$PGCF_GATE/qualification.json" "$PGCF_GATE/registry.json"
            cat "$PGCF_GATE/qualification.json" >> "$GITHUB_STEP_SUMMARY"
            cat "$PGCF_GATE/registry.json" >> "$GITHUB_STEP_SUMMARY"
          done
          if [ "$PGCF_BUILD_SANDBOX" = true ]; then
            bash infra/talos/sandbox/ci-artifacts.sh "$RUNNER_TEMP/pgcf-native-image-gate/sandbox-controller/qualification.json"
          fi
      - name: Retain exact native qualification and publication receipts
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: pgcf-native-qualification-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/pgcf-native-image-gate/*/qualification.json
            ${{ runner.temp }}/pgcf-native-image-gate/*/registry.json
            ${{ runner.temp }}/pgcf-talos-boot-${{ github.sha }}/extension-gate/qualification.json
            ${{ runner.temp }}/pgcf-talos-boot-${{ github.sha }}/extension-gate/registry.json
            ${{ runner.temp }}/pgcf-talos-boot-${{ github.sha }}/recipe-gate/qualification.json
            ${{ runner.temp }}/pgcf-talos-boot-${{ github.sha }}/recipe-gate/registry.json
          if-no-files-found: warn
          retention-days: 90
          overwrite: false
      - name: Remove native qualification files
        if: always()
        run: rm -rf "$RUNNER_TEMP/pgcf-native-image-gate"
