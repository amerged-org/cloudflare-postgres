# SPDX-License-Identifier: Apache-2.0
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      external_probe:
        description: Run only the supplemental Dev TCP probe
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ inputs.external_probe && 'external-probe' || 'build' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    if: github.event_name != 'workflow_dispatch' || !inputs.external_probe
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm at the version in package.json
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Check formatting
        run: pnpm format:check
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Render the Kubernetes manifests
        run: |
          command -v kubectl >/dev/null || { echo "kubectl not available on this runner"; exit 1; }
          for dir in infra/platform infra/platform/regional; do
            if [ -f "$dir/kustomization.yaml" ]; then
              echo "kubectl kustomize $dir"
              kubectl kustomize "$dir" > /dev/null
            else
              echo "skipping $dir: no kustomization.yaml"
            fi
          done

  image:
    needs: check
    if: github.ref == 'refs/heads/main' && !inputs.external_probe && (github.event_name == 'workflow_dispatch' || github.event_name == 'push')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/amerged-org/pgcf-regional
    steps:
      - name: Check out the revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check regional entry points
        id: entries
        run: |
          if [ -f apps/regional/src/agent/main.ts ] && [ -f apps/regional/src/gateway/main.ts ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build the linux/amd64 image
        if: steps.entries.outputs.present == 'true'
        run: |
          docker buildx build --platform linux/amd64 --load \
            --provenance=false --sbom=false \
            --file apps/regional/Dockerfile \
            --tag "$IMAGE:sha-${GITHUB_SHA::12}" \
            --tag "$IMAGE:latest" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.licenses=Apache-2.0" \
            .
      - name: Fail if the image contains .env or .pem files
        if: steps.entries.outputs.present == 'true'
        run: |
          found=$(docker run --rm --platform linux/amd64 --user 0 --entrypoint find "$IMAGE:latest" \
            / -xdev -type f \( -name '.env*' -o -name '.dev.vars*' -o -name '*.pem' -o -name '*.key' -o -name kubeconfig -o -name talosconfig \) -print)
          if [ -n "$found" ]; then
            echo "Forbidden files in the image:"
            echo "$found"
            exit 1
          fi
      - name: Log in to GHCR
        if: steps.entries.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Push the image and record its digest
        if: steps.entries.outputs.present == 'true'
        run: |
          docker push "$IMAGE:sha-${GITHUB_SHA::12}"
          docker push "$IMAGE:latest"
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:latest")
          {
            echo "Image digest: \`$digest\`"
            echo "Tags: \`sha-${GITHUB_SHA::12}\`, \`latest\`"
          } >> "$GITHUB_STEP_SUMMARY"

  external_probe:
    if: github.event_name == 'workflow_dispatch' && inputs.external_probe && github.ref == 'refs/heads/main' && github.event.repository.private == false
    runs-on: macos-15
    timeout-minutes: 8
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Check out the approved main revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.6.0
      - name: Probe the approved Dev targets without publishing their addresses
        env:
          PGCF_E2E_EXTERNAL_PROBE_CONFIG: ${{ secrets.PGCF_E2E_EXTERNAL_PROBE_CONFIG }}
          NODE_DEBUG: ""
          NODE_OPTIONS: ""
        run: node scripts/e2e/src/external-probe.ts
      - name: Attest the sanitized report
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-path: ${{ runner.temp }}/pgcf-e6-native.json
          show-summary: false
      - name: Upload only the sanitized report
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: pgcf-e6-native
          path: ${{ runner.temp }}/pgcf-e6-native.json
          if-no-files-found: error
          retention-days: 1
          overwrite: false
