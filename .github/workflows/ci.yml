# SPDX-License-Identifier: Apache-2.0
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      external_probe:
        description: Run only the supplemental Dev TCP probe
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ inputs.external_probe && 'external-probe' || 'build' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    if: github.event_name != 'workflow_dispatch' || !inputs.external_probe
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out the revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm at the version in package.json
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Read CI toolchain pins
        id: toolchain
        run: node scripts/ci/toolchain.mjs github-output >> "$GITHUB_OUTPUT"
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ steps.toolchain.outputs.node }}
          cache: pnpm
      - name: Validate the native CI toolchain
        run: node scripts/ci/toolchain.mjs check
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Read the pinned Mermaider revision
        id: mermaider_pin
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync, readFileSync } from 'node:fs';
          const revision = readFileSync('.mermaider/tool-revision', 'utf8').trim();
          if (!/^[a-f0-9]{40}$/.test(revision)) throw new Error('Mermaider must be pinned to an immutable commit');
          appendFileSync(process.env.GITHUB_OUTPUT, `revision=${revision}\n`);
          JS
      - name: Check out pinned Mermaider tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: sebmer-com/mermaider
          ref: ${{ steps.mermaider_pin.outputs.revision }}
          path: .local/tools/mermaider
          persist-credentials: false
      - name: Check source-backed architecture and process diagrams
        run: |
          npm --prefix .local/tools/mermaider ci --ignore-scripts
          npm --prefix .local/tools/mermaider run build
          node .local/tools/mermaider/dist/cli.js check --repo .
      - name: Set up the pinned Rust and Worker build tools
        run: |
          PGCF_RUST_VERSION=$(node -p 'require("./infra/platform/versions.lock.json").nativeRuntime.rustVersion')
          PGCF_RUST_TARGETS=$(node -p 'require("./infra/platform/versions.lock.json").ciToolchain.rustTargets.join(",")')
          PGCF_WORKER_BUILD_VERSION=$(node -p 'require("./infra/platform/versions.lock.json").rustEdge.workerBuildVersion')
          rustup toolchain install "$PGCF_RUST_VERSION" --profile minimal \
            --component rustfmt --component clippy --target "$PGCF_RUST_TARGETS"
          node scripts/ci/toolchain.mjs check-rust
          cargo install worker-build --version "$PGCF_WORKER_BUILD_VERSION" --locked
      - name: Verify the pinned Worker build binaries
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import { execFileSync } from 'node:child_process';
          import { appendFileSync, mkdirSync, readFileSync, writeFileSync } from 'node:fs';
          import { join } from 'node:path';
          const { archives } = JSON.parse(readFileSync('infra/platform/versions.lock.json', 'utf8')).rustEdge;
          assert.deepEqual(archives.map(x => x.environmentVariable).sort(), ['ESBUILD_BIN', 'WASM_BINDGEN_BIN', 'WASM_OPT_BIN']);
          const directory = join(process.env.RUNNER_TEMP, 'pgcf-worker-build-tools');
          mkdirSync(directory, { recursive: true });
          const sha256 = bytes => createHash('sha256').update(bytes).digest('hex');
          for (const tool of archives) {
            assert.equal(tool.os, 'linux'); assert.equal(tool.architecture, 'amd64');
            assert.match(tool.name, /^[a-z-]+$/); assert.match(tool.member, /^[A-Za-z0-9._/-]+$/); assert.ok(!tool.member.split('/').includes('..'));
            const response = await fetch(tool.url, { signal: AbortSignal.timeout(180_000) });
            assert.equal(response.ok, true); assert.equal(new URL(response.url).protocol, 'https:');
            const archive = Buffer.from(await response.arrayBuffer());
            assert.ok(archive.length < 128 * 1024 * 1024); assert.equal(sha256(archive), tool.sha256);
            const file = join(directory, tool.name + '.tgz'); writeFileSync(file, archive);
            const binary = execFileSync('tar', ['-xOf', file, tool.member], { timeout: 30_000, maxBuffer: 192 * 1024 * 1024 });
            assert.equal(sha256(binary), tool.binarySha256);
            const executable = join(directory, tool.name); writeFileSync(executable, binary, { mode: 0o755 });
            appendFileSync(process.env.GITHUB_ENV, `${tool.environmentVariable}=${executable}\n`);
          }
          JS
      - name: Check public plan privacy
        run: node scripts/ci/plan-privacy.ts
      - name: Lint
        run: pnpm lint
      - name: Check formatting
        run: pnpm format:check
      - name: Typecheck
        run: |
          pnpm typecheck
          pnpm exec tsc -p scripts/ci/tsconfig.json
      - name: Check the native runtime and Worker contracts
        run: |
          node packages/contracts/native/generate.ts --check
          node packages/contracts/native/generate-controller.ts --check
          node packages/contracts/native/generate-power.ts --check
          node packages/contracts/native/generate-measurements.ts --check
          cargo fmt --all -- --check
          cargo test --workspace --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo clippy -p pgcf-edge-rust --target wasm32-unknown-unknown --locked -- -D warnings
      - name: Build the Worker once for actual Workerd tests
        run: pnpm -r --if-present build
      - name: Test
        run: |
          pnpm test
          node --test scripts/ci/*.test.ts
      - name: Bind the already-tested Rust Edge artifact
        run: |
          node --input-type=module <<'JS'
          import { createHash } from 'node:crypto';
          import { readFileSync, readdirSync, statSync, writeFileSync } from 'node:fs';
          import { join } from 'node:path';
          const root = 'apps/edge-rust/build';
          for (const name of ['index.js', 'index_bg.wasm', 'worker/shim.mjs']) {
            if (!statSync(join(root, name)).isFile()) throw new Error('Missing tested Rust Edge artifact');
          }
          const files = directory => readdirSync(directory).sort().flatMap(name => {
            const file = join(directory, name);
            return statSync(file).isDirectory() ? files(file) : [file];
          });
          const sha256 = file => createHash('sha256').update(readFileSync(file)).digest('hex');
          const inputs = ['infra/platform/versions.lock.json', 'Cargo.lock'];
          writeFileSync(join(root, 'artifact.json'), JSON.stringify({
            source_commit: process.env.GITHUB_SHA,
            run_id: process.env.GITHUB_RUN_ID,
            run_attempt: process.env.GITHUB_RUN_ATTEMPT,
            inputs: inputs.map(path => ({ path, sha256: sha256(path) })),
            files: files(root).map(path => ({ path: path.slice(root.length + 1), sha256: sha256(path) })),
          }, null, 2) + '\n');
          writeFileSync(join(root, 'checksums.sha256'), files(root).map(path =>
            `${sha256(path)}  ${path.slice(root.length + 1)}\n`).join(''));
          JS
      - name: Retain the already-tested Rust Edge bytes
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: pgcf-rust-edge-${{ github.sha }}-${{ github.run_attempt }}
          path: apps/edge-rust/build/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
          overwrite: false
      - name: Check the node agent against the actual Linux kernel
        run: |
          PGCF_RUST_BUILDER=$(node -p 'require("./infra/platform/versions.lock.json").nativeRuntime.testBuilderImage')
          PGCF_RUST_VERSION=$(node -p 'require("./infra/platform/versions.lock.json").nativeRuntime.rustVersion')
          PGCF_AGENT_TEST_IMAGE="pgcf-node-agent-kernel-test:${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          PGCF_AGENT_TEST_CONTAINER="pgcf-node-agent-kernel-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          trap 'docker rm --force "$PGCF_AGENT_TEST_CONTAINER" >/dev/null 2>&1 || true' EXIT
          docker build --platform linux/amd64 --file apps/node-agent/kernel-test.Dockerfile \
            --build-arg RUST_BUILDER="$PGCF_RUST_BUILDER" --build-arg RUST_VERSION="$PGCF_RUST_VERSION" \
            --tag "$PGCF_AGENT_TEST_IMAGE" .
          timeout 90 docker run --rm --name "$PGCF_AGENT_TEST_CONTAINER" --network none \
            --cpus 2 --memory 1g --pids-limit 64 --read-only \
            --tmpfs /tmp:rw,nosuid,nodev,size=16m,mode=1777 \
            --cap-drop ALL --cap-add SYS_ADMIN \
            --security-opt seccomp=unconfined --security-opt apparmor=unconfined \
            "$PGCF_AGENT_TEST_IMAGE"

  external_probe:
    if: github.event_name == 'workflow_dispatch' && inputs.external_probe && github.ref == 'refs/heads/main' && github.event.repository.private == false
    runs-on: macos-15
    timeout-minutes: 12
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Check out the approved main revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Read CI toolchain pins
        id: toolchain
        run: node scripts/ci/toolchain.mjs github-output >> "$GITHUB_OUTPUT"
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ steps.toolchain.outputs.node }}
      - name: Probe the approved Dev targets without publishing their addresses
        env:
          GH_TOKEN: ${{ github.token }}
          PGCF_E2E_EXTERNAL_PROBE_CONFIG: ${{ secrets.PGCF_E2E_EXTERNAL_PROBE_CONFIG }}
          NODE_DEBUG: ""
          NODE_OPTIONS: ""
        run: node scripts/e2e/src/external-probe.ts
      - name: Attest the sanitized report
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-path: ${{ runner.temp }}/pgcf-e6-native.json
          show-summary: false
      - name: Upload only the sanitized report
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: pgcf-e6-native
          path: ${{ runner.temp }}/pgcf-e6-native.json
          if-no-files-found: error
          retention-days: 1
          overwrite: false
      - name: Remove private acceptance files
        if: always()
        run: rm -f "$RUNNER_TEMP/pgcf-e6-native.json"

  node-image:
    if: github.event_name != 'workflow_dispatch' || !inputs.external_probe
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      PGCF_QEMU_VERSION: 1:8.2.2+ds-0ubuntu1.18
    steps:
      - name: Check out the revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Choose the image work directory
        run: printf 'PGCF_NODE_IMAGE_WORK=%s\n' "$RUNNER_TEMP/pgcf-node-image" >> "$GITHUB_ENV"
      - name: Set up pnpm at the version in package.json
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Read CI toolchain pins
        id: toolchain
        run: node scripts/ci/toolchain.mjs github-output >> "$GITHUB_OUTPUT"
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ steps.toolchain.outputs.node }}
          cache: pnpm
      - name: Validate the native CI toolchain
        run: node scripts/ci/toolchain.mjs check
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check and test the image tooling and the installer
        run: |
          pnpm exec tsc -p infra/node-image/tsconfig.json
          bash -n infra/node-image/builder/build.sh infra/node-image/installer/install.sh infra/node-image/boot-test/guest.sh
          node --test infra/node-image/*.test.ts infra/node-image/installer/*.test.ts
      - name: Build the node binaries with the pinned Rust toolchain
        run: |
          PGCF_RUST_VERSION=$(node -p 'require("./infra/platform/versions.lock.json").nativeRuntime.rustVersion')
          rustup toolchain install "$PGCF_RUST_VERSION" --profile minimal
          cargo build --release --locked \
            --bin pgcf-agent --bin pgcf-native-gateway --bin pgcf-archive --bin pgcf-wal-fetch
          mkdir -p "$PGCF_NODE_IMAGE_WORK/binaries"
          for binary in pgcf-agent pgcf-native-gateway pgcf-archive pgcf-wal-fetch; do
            install -m 0755 "target/release/$binary" "$PGCF_NODE_IMAGE_WORK/binaries/"
          done
      - name: Download the locked packages and build the image
        run: |
          node infra/node-image/node-image.ts build --work "$PGCF_NODE_IMAGE_WORK" \
            --binaries "$PGCF_NODE_IMAGE_WORK/binaries" --release "sha-${GITHUB_SHA::12}"
      - name: Boot the image in QEMU and assert the boot test
        run: |
          sudo apt-get update --quiet
          sudo apt-get install --yes --no-install-recommends "qemu-system-x86=$PGCF_QEMU_VERSION"
          sudo chmod 0666 /dev/kvm
          node infra/node-image/boot-test.ts --image "$PGCF_NODE_IMAGE_WORK/out/pgcf-node.raw" --accel kvm
      - name: Show the image release
        run: cat "$PGCF_NODE_IMAGE_WORK/out/pgcf-node.json" "$PGCF_NODE_IMAGE_WORK/out/SHA256SUMS"
      - name: Keep the boot logs of a failed run
        if: failure()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: pgcf-node-image-boot-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/pgcf-node-image/out/boot-test/console.log
            ${{ runner.temp }}/pgcf-node-image/out/boot-test/results.log
          if-no-files-found: ignore
          retention-days: 14
      - name: Remove the image work files
        if: always()
        run: sudo rm -rf "$PGCF_NODE_IMAGE_WORK"
