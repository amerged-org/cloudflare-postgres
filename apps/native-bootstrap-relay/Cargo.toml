# SPDX-License-Identifier: Apache-2.0
[package]
name = "pgcf-native-bootstrap-relay"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
publish = false

[dependencies]
pgcf-native-protocol = { path = "../../packages/native-protocol" }
pgcf-native-gateway = { path = "../native-gateway" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tokio = { version = "=1.53.2", features = ["rt-multi-thread", "net", "io-util", "macros", "sync", "time", "signal"] }
futures-util = { version = "=0.3.34", features = ["sink"] }
tokio-tungstenite = "=0.30.0"
ring = "=0.17.14"
base64 = "=0.23.1"
regex = "=1.13.1"

[dev-dependencies]
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring", "tls12"] }
rcgen = { version = "=0.14.10", default-features = false, features = ["ring", "pem"] }
