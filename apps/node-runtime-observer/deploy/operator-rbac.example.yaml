# SPDX-License-Identifier: Apache-2.0
# Apply only to a trusted operator identity. Exec here confers node-admin
# authority through the observer socket; never bind this to customers.
# Render actual names. This creates no default controller permission change.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pgcf-node-observer-reader
rules:
  - apiGroups: [""]
    resources: [nodes]
    resourceNames: [REPLACE_NODE_NAME]
    verbs: [get]
  - apiGroups: [""]
    resources: [namespaces]
    resourceNames: [pgcf-runtime-observation]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pgcf-node-observer-executor
  namespace: pgcf-runtime-observation
rules:
  - apiGroups: [""]
    resources: [pods]
    resourceNames: [REPLACE_PINNED_OBSERVER_POD_NAME]
    verbs: [get]
  - apiGroups: [""]
    resources: [pods/exec]
    resourceNames: [REPLACE_PINNED_OBSERVER_POD_NAME]
    verbs: [get, create]
  - apiGroups: [apps]
    resources: [daemonsets]
    resourceNames: [node-runtime-observer]
    verbs: [get]
