# SPDX-License-Identifier: Apache-2.0
# Explicit trusted platform boundary: socket access can administer its node.
# Render placeholders into private installation configuration before dry-run.
apiVersion: v1
kind: Namespace
metadata:
  name: pgcf-runtime-observation
  labels:
    app.kubernetes.io/managed-by: cloudflare-postgres
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-network
  namespace: pgcf-runtime-observation
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress: []
  egress: []
---
apiVersion: v1
kind: Pod
metadata:
  name: node-runtime-qualification
  namespace: pgcf-runtime-observation
  labels:
    app.kubernetes.io/managed-by: cloudflare-postgres
spec:
  # This is an explicit one-shot qualification, not a tenant DaemonSet.
  nodeName: REPLACE_NODE_NAME
  automountServiceAccountToken: false
  restartPolicy: Never
  activeDeadlineSeconds: 60
  terminationGracePeriodSeconds: 5
  dnsPolicy: None
  dnsConfig:
    nameservers: [127.0.0.1]
  securityContext:
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: observer
      image: REPLACE_DIGEST_PINNED_IMAGE
      imagePullPolicy: Never
      args:
        - --endpoint=unix:///run/cri.sock
        - --installation-id=REPLACE_INSTALLATION_ID
        - --region-id=REPLACE_REGION_ID
        - --node-name=REPLACE_NODE_NAME
        - --node-uid=REPLACE_NODE_UID
        - --expected-boot-id=REPLACE_BOOT_ID
        - --timeout=10s
        - --max-entries=4096
      securityContext:
        # The Talos socket is root-owned; authority is explicitly trusted.
        runAsUser: 0
        runAsGroup: 0
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
      resources:
        requests:
          cpu: 100m
          memory: 64Mi
        limits:
          cpu: 500m
          memory: 128Mi
      volumeMounts:
        - name: cri-socket
          mountPath: /run/cri.sock
          readOnly: true
  volumes:
    - name: cri-socket
      hostPath:
        path: /run/containerd/containerd.sock
        type: Socket
