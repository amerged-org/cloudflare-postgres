# SPDX-License-Identifier: Apache-2.0
# Separate trusted node-administration profile. Do not apply until image,
# actual namespace/owner/node/Pod identities and broker authorization are pinned.
apiVersion: v1
kind: Namespace
metadata:
  name: pgcf-runtime-delivery
  labels:
    app.kubernetes.io/managed-by: cloudflare-postgres
    pgcf.io/component: node-execution-delivery
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-network
  namespace: pgcf-runtime-delivery
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress: []
  egress: []
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-execution-delivery
  namespace: pgcf-runtime-delivery
  labels:
    app.kubernetes.io/managed-by: cloudflare-postgres
    pgcf.io/component: node-execution-delivery
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: pgcf-node-execution-delivery
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pgcf-node-execution-delivery
        app.kubernetes.io/managed-by: cloudflare-postgres
        pgcf.io/component: node-execution-delivery
    spec:
      automountServiceAccountToken: false
      hostNetwork: false
      hostPID: false
      hostIPC: false
      terminationGracePeriodSeconds: 5
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: delivery
          image: REPLACE_DIGEST_PINNED_DELIVERY_IMAGE
          imagePullPolicy: Never
          command: [/node-execution-delivery]
          args: [agent]
          env:
            - name: PGCF_DELIVERY_POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: PGCF_DELIVERY_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: PGCF_DELIVERY_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: PGCF_DELIVERY_INSTALLATION_ID
              value: REPLACE_INSTALLATION_ID
            - name: PGCF_DELIVERY_REGION_ID
              value: REPLACE_REGION_ID
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            privileged: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
              add: [CHOWN, DAC_OVERRIDE]
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
          volumeMounts:
            - name: cri-socket
              mountPath: /run/cri.sock
              readOnly: true
            - name: kubelet
              mountPath: /var/lib/kubelet
              readOnly: false
              mountPropagation: None
      volumes:
        - name: cri-socket
          hostPath:
            path: /run/containerd/containerd.sock
            type: Socket
        - name: kubelet
          hostPath:
            path: /var/lib/kubelet
            type: Directory
