# SPDX-License-Identifier: Apache-2.0
[package]
name = "pgcf-sandbox-controller"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
publish = false

[dependencies]
pgcf-native-protocol = { path = "../../packages/native-protocol" }
pgcf-node-runtime = { path = "../node-runtime" }
libc = "=0.2.190"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tokio = { version = "=1.53.2", features = ["rt-multi-thread", "net", "io-util", "macros", "sync", "time", "signal", "fs", "process"] }
tonic = { version = "=0.14.6", features = ["transport"] }
tonic-prost = "=0.14.6"
prost = "=0.14.4"
prost-types = "=0.14.4"
tokio-stream = { version = "=0.1.19", features = ["net"] }
tower = { version = "=0.5.3", features = ["util"] }
hyper-util = { version = "=0.1.21", features = ["tokio"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls-no-provider", "json"] }
rustls = { version = "=0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
time = { version = "=0.3.55", features = ["formatting", "parsing"] }
sha2 = "=0.11.0"
jsonschema = { version = "=0.58.6", default-features = false }
webpki-roots = "=1.0.9"

[build-dependencies]
tonic-prost-build = "=0.14.6"

[dev-dependencies]
ring = "=0.17.14"
base64 = "=0.23.1"
