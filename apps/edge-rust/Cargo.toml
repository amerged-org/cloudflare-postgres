# SPDX-License-Identifier: Apache-2.0
[package]
name = "pgcf-edge-rust"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
pgcf-native-protocol = { path = "../../packages/native-protocol" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
base64 = "=0.23.1"
hmac = "=0.13.0"
sha2 = "=0.11.0"
url = "=2.5.8"

[target.'cfg(target_arch = "wasm32")'.dependencies]
worker = "=0.8.7"
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "=0.4.79"
js-sys = "=0.3.106"
serde-wasm-bindgen = "=0.6.5"
futures-channel = "=0.3.34"
futures-util = "=0.3.34"
web-sys = { version = "=0.3.106", features = ["AbortController", "AbortSignal", "BinaryType", "Crypto", "Event", "EventTarget", "Headers", "MessageEvent", "ReadableStream", "Request", "RequestInit", "RequestRedirect", "Response", "WebSocket", "WorkerGlobalScope"] }
