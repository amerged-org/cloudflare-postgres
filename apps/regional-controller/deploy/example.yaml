# SPDX-License-Identifier: Apache-2.0
# Replace origin, region, meter source/epoch, image, and operator selector.
# Bootstrap the dedicated meter source through the installation API first.
# Supply pgcf-region-access and pgcf-meter-access Secrets separately; never commit them.
apiVersion: v1
kind: Namespace
metadata:
  name: pgcf-system
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: regional-controller
  namespace: pgcf-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pgcf-regional-controller
rules:
  - apiGroups: [""]
    resources: [namespaces, resourcequotas, limitranges]
    verbs: [get, create]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
  # Optional private native access observes CNPG routing and protected clients.
  # It never creates a Service or grants customers Kubernetes credentials.
  - apiGroups: [""]
    resources: [services, serviceaccounts]
    verbs: [get]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [list]
  # Optional nodeTracking profiles preserve immutable pre-execution provenance.
  # This is read-only Node identity access, not observer/exec or physical proof.
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, create]
  # Optional metering inventory: read resource identity/requests/capacity only.
  # Secret listing or additional Secret reads are not needed by the collector.
  - apiGroups: [""]
    resources: [namespaces, persistentvolumeclaims, persistentvolumes]
    verbs: [list]
  # Role revisions and the derived CNPG server-CA Secret have dynamic names.
  # This trusted installation identity therefore has Secret read authority;
  # never expose its kubeconfig/SA to customers. Admission constrains writes,
  # not reads: production authorization must retain this operator-only boundary.
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get]
  # Kubernetes RBAC cannot constrain create by resourceNames. A validating
  # admission policy must enforce the controller's owned namespace/name prefix
  # before granting this identity to an untrusted production environment.
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [get, create]
  - apiGroups: [cilium.io]
    resources: [ciliumnetworkpolicies]
    verbs: [get, create]
  - apiGroups: [postgresql.cnpg.io]
    resources: [clusters]
    verbs: [get, create, list]
  # Optional pooling lifecycle and complete metering ownership inventory.
  - apiGroups: [postgresql.cnpg.io]
    resources: [poolers]
    verbs: [get, create, list]
  - apiGroups: [apps]
    resources: [deployments, replicasets]
    verbs: [get, list]
  - apiGroups: [postgresql.cnpg.io]
    resources: [databaseroles]
    verbs: [get, create, patch]
  # SQL absence/ownership is verified separately; no patch/delete capability.
  - apiGroups: [postgresql.cnpg.io]
    resources: [databases]
    verbs: [get, list, create]
  # Optional manual physical backup lane; no archive or Backup deletion rights.
  - apiGroups: [postgresql.cnpg.io]
    resources: [backups]
    verbs: [get, create]
  - apiGroups: [barmancloud.cnpg.io]
    resources: [objectstores]
    verbs: [get, create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pgcf-regional-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: pgcf-regional-controller
subjects:
  - kind: ServiceAccount
    name: regional-controller
    namespace: pgcf-system
---
# A separate Role grants access only to the explicitly configured source Secret.
# Its namespace must already exist and remain accessible only to operators.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pgcf-read-backup-credentials
  namespace: platform-secrets
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [private-backup-credentials]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pgcf-read-backup-credentials
  namespace: platform-secrets
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pgcf-read-backup-credentials
subjects:
  - kind: ServiceAccount
    name: regional-controller
    namespace: pgcf-system
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: regional-controller
  namespace: pgcf-system
data:
  control-origin: https://control.example.invalid
  region-id: REPLACE_WITH_REGISTERED_REGION_ID
  usage-source-id: REPLACE_WITH_ISSUED_USAGE_SOURCE_ID
  usage-source-epoch: REPLACE_WITH_ISSUED_USAGE_SOURCE_EPOCH
  config.json: |
    {
      "operatorNamespace": "cnpg-system",
      "nodeTrackingJournalPath": "/var/lib/pgcf/node-birth.sqlite",
      "operatorPodLabels": { "app.kubernetes.io/name": "cloudnative-pg" },
      "roleVerifier": {
        "verifierNamespace": "pgcf-system",
        "verifierPodLabels": { "app.kubernetes.io/name": "pgcf-regional-controller" }
      },
      "allowedBackupSecrets": [{
        "namespace": "platform-secrets",
        "name": "private-backup-credentials",
        "accessKeyIdKey": "ACCESS_KEY_ID",
        "secretAccessKeyKey": "SECRET_ACCESS_KEY"
      }]
    }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: regional-usage-journal
  namespace: pgcf-system
spec:
  accessModes: [ReadWriteOnce]
  volumeMode: Filesystem
  storageClassName: pgcf-lvm
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: regional-controller
  namespace: pgcf-system
spec:
  replicas: 1
  # One process owns this identity-sealed journal; rolling overlap is unsafe.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: pgcf-regional-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pgcf-regional-controller
    spec:
      serviceAccountName: regional-controller
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        # Preserve the journal's private 0700/0600 children on repeat mounts.
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: controller
          image: registry.example.invalid/cloudflare-postgres/regional-controller:REPLACE_WITH_RELEASE
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          env:
            - name: PGCF_CONTROL_ORIGIN
              valueFrom:
                configMapKeyRef:
                  name: regional-controller
                  key: control-origin
            - name: PGCF_REGION_ID
              valueFrom:
                configMapKeyRef:
                  name: regional-controller
                  key: region-id
            - name: PGCF_REGIONAL_CONFIG_FILE
              value: /etc/pgcf/config.json
            # The trusted installer must first prepare this owned 0700 sibling
            # on the persistent journal volume; never chmod/reuse usage custody.
            - name: PGCF_PROVISIONING_JOURNAL_DIRECTORY
              value: /var/lib/pgcf/provisioning
            # Opt in only after installation archive qualification:
            # - name: PGCF_MANUAL_BACKUPS_ENABLED
            #   value: "true"
            - name: PGCF_REGION_TOKEN_FILE
              value: /var/run/pgcf-region/token
            - name: PGCF_USAGE_JOURNAL_PATH
              value: /var/lib/pgcf/usage/journal.sqlite
            - name: PGCF_USAGE_SOURCE_ID
              valueFrom:
                configMapKeyRef:
                  name: regional-controller
                  key: usage-source-id
            - name: PGCF_USAGE_SOURCE_EPOCH
              valueFrom:
                configMapKeyRef:
                  name: regional-controller
                  key: usage-source-epoch
            - name: PGCF_METER_TOKEN_FILE
              value: /var/run/pgcf-meter/token
          volumeMounts:
            - name: configuration
              mountPath: /etc/pgcf
              readOnly: true
            - name: region-access
              mountPath: /var/run/pgcf-region
              readOnly: true
            - name: meter-access
              mountPath: /var/run/pgcf-meter
              readOnly: true
            - name: usage-journal
              mountPath: /var/lib/pgcf
      volumes:
        - name: configuration
          configMap:
            name: regional-controller
            items:
              - key: config.json
                path: config.json
        - name: region-access
          secret:
            secretName: pgcf-region-access
            defaultMode: 288 # 0440; decimal also preserves the mode in YAML 1.2 readers.
            items:
              - key: token
                path: token
        - name: meter-access
          secret:
            secretName: pgcf-meter-access
            defaultMode: 288 # 0440; decimal also preserves the mode in YAML 1.2 readers.
            items:
              - key: token
                path: token
        - name: usage-journal
          persistentVolumeClaim:
            claimName: regional-usage-journal
