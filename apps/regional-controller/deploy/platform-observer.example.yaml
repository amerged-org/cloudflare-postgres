# Optional dedicated read-only identity. Review namespace and resourceNames
# for your installation before applying; this file is not installed by Flux.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pgcf-platform-observer
  namespace: flux-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pgcf-platform-observer-nodes
rules:
  - apiGroups: [""]
    resources: [nodes]
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pgcf-platform-observer-nodes
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: pgcf-platform-observer-nodes
subjects:
  - kind: ServiceAccount
    name: pgcf-platform-observer
    namespace: flux-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pgcf-platform-observer
  namespace: flux-system
rules:
  - apiGroups: [helm.toolkit.fluxcd.io]
    resources: [helmreleases]
    verbs: [list]
  - apiGroups: [source.toolkit.fluxcd.io]
    resources: [ocirepositories, helmrepositories]
    verbs: [list]
  - apiGroups: [source.toolkit.fluxcd.io]
    resources: [gitrepositories]
    resourceNames: [pgcf-platform]
    verbs: [get]
  - apiGroups: [kustomize.toolkit.fluxcd.io]
    resources: [kustomizations]
    resourceNames: [pgcf-platform]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pgcf-platform-observer
  namespace: flux-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pgcf-platform-observer
subjects:
  - kind: ServiceAccount
    name: pgcf-platform-observer
    namespace: flux-system
