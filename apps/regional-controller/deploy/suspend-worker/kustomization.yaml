# SPDX-License-Identifier: Apache-2.0
# Optional, separately installed worker; no default platform inclusion.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: pgcf-system
resources:
  - service-account.yaml
  - rbac.yaml
  - persistent-volume-claim.yaml
  - deployment.yaml
configMapGenerator:
  - name: pgcf-suspend-worker-bootstrap
    files:
      - prepare.mjs
      - suspend-config.json=suspend-config.example.json
  - name: pgcf-suspend-worker-identity
    literals:
      - control-origin=https://control.example.invalid
      - region-id=REPLACE_WITH_REGISTERED_REGION_UUID
