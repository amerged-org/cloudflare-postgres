# SPDX-License-Identifier: Apache-2.0
[package]
name = "pgcf-native-reclaimer"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
publish = false

[dependencies]
pgcf-native-protocol = { path = "../../packages/native-protocol" }
pgcf-native-controller = { path = "../native-controller" }
libc = "=0.2.190"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tokio = { version = "=1.53.2", features = ["rt", "macros", "sync", "time", "signal", "fs"] }
ring = "=0.17.14"
base64 = "=0.23.1"
sha2 = "=0.11.0"
jsonschema = { version = "=0.58.6", default-features = false }
