# SPDX-License-Identifier: Apache-2.0
[package]
name = "pgcf-native-gateway"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
publish = false

[dependencies]
httparse = "=1.10.1"
time = { version = "=0.3.55", features = ["formatting", "parsing"] }
pgcf-native-protocol = { path = "../../packages/native-protocol" }
futures-util = { version = "=0.3.34", features = ["sink"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tokio = { version = "=1.53.2", features = ["rt-multi-thread", "net", "io-util", "macros", "sync", "time", "signal"] }
tokio-tungstenite = "=0.30.0"
ring = "=0.17.14"
sha2 = "=0.11.0"
hmac = "=0.13.0"
zeroize = "=1.9.1"
base64 = "=0.23.1"

[dev-dependencies]
pgcf-test-postgres = { path = "../../packages/test-postgres" }
