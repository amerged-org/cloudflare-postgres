# SPDX-License-Identifier: Apache-2.0
[package]
name = "pgcf-native-gateway"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
publish = false

[dependencies]
httparse = "=1.10.1"
time = { version = "=0.3.55", features = ["formatting", "parsing"] }
pgcf-native-protocol = { path = "../../packages/native-protocol" }
futures-util = { version = "=0.3.34", features = ["sink"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tokio = { version = "=1.53.2", features = ["rt-multi-thread", "net", "io-util", "macros", "sync", "time", "signal", "fs"] }
tokio-tungstenite = "=0.30.0"
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "=0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = { version = "=1.15.1", default-features = false, features = ["std"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls-no-provider", "json", "stream"] }

ring = "=0.17.14"
sha2 = "=0.11.0"
base64 = "=0.23.1"

[dev-dependencies]
hmac = "=0.13.0"
rcgen = { version = "=0.14.10", default-features = false, features = ["ring", "pem"] }
