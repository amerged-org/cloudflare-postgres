      - $ref: "#/components/parameters/RegionId"
    post:
      operationId: claimSuspendOperation
      summary: Lease one owned suspend intention
      description: >-
        Tracked environments carry the exact immutable nodeCohort UID/hash from ready provisioning.
        Lease authority is invalidated if that observed pointer changes. No server list is reconstructed.
      security:
        - regionToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - leaseSeconds
              properties:
                leaseSeconds:
                  type: integer
                  minimum: 30
                  maximum: 300
      responses:
        "200":
          description: Scoped suspend execution result
          content:
            application/json:
              schema:
                type: object
                required:
                  - claim
                properties:
                  claim:
                    type:
                      - object
                      - "null"
                    description:
                      Bounded immutable suspend task identity and fenced
                      lease; no password. See environment-suspend-v1 contract.
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Stale or foreign execution/runtime/spec authority
  /v1/regions/{regionId}/suspend-operations/{operationId}/renew:
    parameters:
      - $ref: "#/components/parameters/RegionId"
      - $ref: "#/components/parameters/OperationId"
    post:
      operationId: renewSuspendOperation
      summary: Renew only current suspend execution authority
      security:
        - regionToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - leaseToken
                - leaseEpoch
                - leaseSeconds
              properties:
                leaseToken:
                  type: string
                  pattern: ^cplease_[A-Za-z0-9_-]{43}$
                leaseEpoch:
                  type: integer
                  minimum: 1
                leaseSeconds:
                  type: integer
                  minimum: 30
                  maximum: 300
      responses:
        "200":
          description: Scoped suspend execution result
          content:
            application/json:
              schema:
                type: object
                required:
                  - leaseExpiresAt
                properties:
                  leaseExpiresAt:
                    type: string
                    format: date-time
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Stale or foreign execution/runtime/spec authority
  /v1/regions/{regionId}/suspend-operations/{operationId}/result:
    parameters:
      - $ref: "#/components/parameters/RegionId"
      - $ref: "#/components/parameters/OperationId"
    post:
      operationId: reportSuspendOperation
      summary: Publish observed retained-data compute suspension
      security:
        - regionToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - leaseToken
                - leaseEpoch
                - status
                - resultCode
                - observation
              properties:
                leaseToken:
                  type: string
                  pattern: ^cplease_[A-Za-z0-9_-]{43}$
                leaseEpoch:
                  type: integer
                  minimum: 1
                status:
                  type: string
                  const: suspended
                resultCode:
                  type: string
                  const: compute_suspended
                observation:
                  $ref: "#/components/schemas/SuspendObservation"
      responses:
        "200":
          description: Scoped suspend execution result
          content:
            application/json:
              schema:
                type: object
                required:
                  - operation
                properties:
                  operation:
                    $ref: "#/components/schemas/RecoveryOperation"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Stale or foreign execution/runtime/spec authority
components:
  securitySchemes:
    usageMeterToken:
      type: http
      scheme: bearer
      description: Installer-issued cpmtr regional meter credential with usage:write only.
    budgetGrantorToken:
      type: http
      scheme: bearer
      description: >-
        Installer-issued cpbgt organization grantor with budgets:read, budgets:write and usage:read;
        projects:write never grants budgets.
    installationToken:
      type: http
      scheme: bearer
      description: Worker Secret configured by the installation operator.
    organizationToken:
      type: http
      scheme: bearer
      description: >-
        Token issued once at organization bootstrap with projects:read,
        projects:write, and operations:read scopes.
    regionToken:
      type: http
      scheme: bearer
      description: Region-scoped executor token with operations:claim and operations:report.
  parameters:
    LifecycleIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        Stable key for one logical request at this exact path. Keep the same body
        and key after an uncertain HTTP outcome; another body with the same key conflicts.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: "^[A-Za-z0-9._~-]+$"
    DatabaseRoleId:
      name: roleId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/AccountingUuid"
    OwnedDatabaseId:
      name: databaseId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/AccountingUuid"
    RecoveryLimit:
      name: limit
      in: query
      description: Page limit; binds the continuation cursor.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    RecoveryCursor:
      name: cursor
      in: query
      description: HMAC-protected cursor bound to this collection, parent and limit.
      schema:
        type: string
        maxLength: 2048
    AccountingEnvironmentId:
      name: environmentId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/AccountingUuid"
    AllowanceReservationId:
      name: reservationId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/AccountingUuid"
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OperationId:
      name: operationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RegionId:
      name: regionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OrganizationId:
      name: organizationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  headers:
    LifecycleNoStore:
      description: Returned by lifecycle JSON responses, including credential disclosure.
      required: true
      schema:
        type: string
        const: no-store
  responses:
    AdmissionPermitResponse:
      description: Immutable commissioning binding and observed permit state
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [permit]
            properties:
              permit:
                $ref: "#/components/schemas/AdmissionPermit"
    RoleLifecycleConflict:
      description: >-
        role_name_conflict, role_conflict, environment_not_ready,
        credential_revision_conflict, credential_not_applied or idempotency_conflict.
        Rotation also conflicts while database creation holds its owner lock.
        Read current metadata/operation before deciding on a bounded retry.
      headers:
        Cache-Control:
          $ref: "#/components/headers/LifecycleNoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    DatabaseLifecycleConflict:
      description: >-
        environment_suspended, owner_not_applied, database_name_conflict,
        database_conflict, database_not_applied, credential_not_applied or
        idempotency_conflict. Disclosure cannot bypass pending owner rotation.
      headers:
        Cache-Control:
          $ref: "#/components/headers/LifecycleNoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RoleLifecycleUnavailable:
      description: Role state or processing unavailable (role_unavailable); no private error body.
      headers:
        Cache-Control:
          $ref: "#/components/headers/LifecycleNoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    DatabaseLifecycleUnavailable:
      description: Database state or processing unavailable (database_unavailable); no private error body.
      headers:
        Cache-Control:
          $ref: "#/components/headers/LifecycleNoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RoleCredentialKeyUnavailable:
      description: >-
        The dedicated role keyring or required historical key is unavailable
        (role_credential_key_unavailable). No provider or allowance key fallback is used.
      headers:
        Cache-Control:
          $ref: "#/components/headers/LifecycleNoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BudgetAuthorityResponse:
      description: Current budget authority; runtimeEnforced is false.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/BudgetAuthorityEnvelope"
    AccountingConflict:
      description: >-
        Conditional revision/accounting conflict, invalid period/dimensions, budget pause/exhaustion,
        unreconciled gaps/holds, or invalid reservation/usage/settlement evidence. Read current state
        before a bounded retry.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    AccountingUnavailable:
      description: >-
        Accounting state, provider, configuration, or crypto unavailable. No private evidence or
        credentials are returned.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    AllowanceFenceUnavailable:
      description: >-
        Dedicated fence keyring missing/invalid or retained key version unavailable
        (fence_key_unavailable). No provider/bootstrap key fallback.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    AdmissionResponse:
      description: Current admission, closed by default
      content:
        application/json:
          schema:
            type: object
            required: [admission]
            properties:
              admission:
                $ref: "#/components/schemas/Admission"
    LeaseConflict:
      description: Missing, expired, reassigned, or conflicting execution lease (lease_conflict)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InvalidRequest:
      description: Invalid request body, query parameter, or idempotency key
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Missing or invalid bearer token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Token lacks the required scope
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource absent or inaccessible to caller
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    ProviderInstance:
      type: object
      additionalProperties: false
      required:
        [
          instanceId,
          region,
          dataCenter,
          status,
          cpuCores,
          ramMb,
          diskMb,
          ipv4,
          ipv6,
        ]
      properties:
        instanceId:
          type: string
          pattern: "^[1-9][0-9]{0,18}$"
        region:
          type: string
          minLength: 1
          maxLength: 128
        dataCenter:
          type: string
          minLength: 1
          maxLength: 256
        status:
          type: string
          minLength: 1
          maxLength: 64
        cpuCores:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        ramMb:
          type: string
          pattern: "^(0|[1-9][0-9]{0,18})$"
        diskMb:
          type: string
          pattern: "^(0|[1-9][0-9]{0,18})$"
        ipv4:
          type: [string, "null"]
          format: ipv4
        ipv6:
          type: [string, "null"]
          format: ipv6
    ProviderInventory:
      type: object
      additionalProperties: false
      required:
        [
          provider,
          instances,
          observation,
          actionsEnabled,
          machineIdentityVerified,
        ]
      properties:
        provider:
          type: string
          const: contabo
        instances:
          type: array
          maxItems: 1000
          items:
            $ref: "#/components/schemas/ProviderInstance"
        observation:
          type: object
          additionalProperties: false
          required:
            [
              startedAt,
              observedAt,
              consistency,
              enumerationComplete,
              evidenceHash,
            ]
          properties:
            startedAt:
              type: string
              format: date-time
            observedAt:
              type: string
              format: date-time
            consistency:
              type: string
              const: observed-scan
            enumerationComplete:
              type: boolean
              const: true
            evidenceHash:
              type: string
              pattern: "^[a-f0-9]{64}$"
        actionsEnabled:
          type: boolean
          const: false
        machineIdentityVerified:
          type: boolean
          const: false
    NodeTrackingPolicy:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        version:
          type: integer
          const: 1
      description: >-
        Opt-in pre-execution node membership recording for a new fenced environment.
        Requires executionFencing. Records provenance, not physical termination or enforcement.
    NodeCohortReference:
      type: object
      additionalProperties: false
      required: [uid, hash]
      properties:
        uid:
          type: string
          format: uuid
        hash:
          type: string
          pattern: ^[a-f0-9]{64}$
      description: >-
        Immutable regional ConfigMap UID and canonical cohort SHA-256, sealed before compute.
        Full server membership stays regional; this pointer alone proves no stopped processes.
    ExecutionFencingPolicy:
      type: object
      additionalProperties: false
      required:
        - version
      properties:
        version:
          type: integer
          const: 1
      description:
        Opt-in new-environment execution fencing. The server assigns initial
        epoch1; callers cannot choose it.
    SuspendObservation:
      type: object
      additionalProperties: false
      required:
        - namespaceUid
        - clusterUid
        - quotaUid
        - volumesHash
        - pooler
        - computeAbsent
        - quotaPodsZero
        - clusterHibernated
        - poolerStopped
      properties:
        namespaceUid:
          type: string
          format: uuid
        clusterUid:
          type: string
          format: uuid
        quotaUid:
          type: string
          format: uuid
        volumesHash:
          type: string
          pattern: ^[a-f0-9]{64}$
        pooler:
          oneOf:
            - type: "null"
            - type: object
              additionalProperties: false
              required:
                - uid
                - deploymentUid
              properties:
                uid:
                  type: string
                  format: uuid
                deploymentUid:
                  type: string
                  format: uuid
        computeAbsent:
          type: boolean
          const: true
        quotaPodsZero:
          type: boolean
          const: true
        clusterHibernated:
          type: boolean
          const: true
        poolerStopped:
          type: boolean
          const: true
        runEpoch:
          type: string
          pattern: ^[1-9][0-9]{0,18}$
          description:
            Initial immutable execution identity, separate from lease/spec/budget
            epochs. Present only for opted-in fencing.
        nodeCohort:
          $ref: "#/components/schemas/NodeCohortReference"
    EnvironmentCompute:
      type: object
      additionalProperties: false
      required:
        [
          environmentId,
          revision,
          requestedSizeId,
          effectiveSizeId,
          phase,
          operationId,
          updatedAt,
          observedAt,
        ]
      properties:
        environmentId:
          type: string
          format: uuid
        revision:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        requestedSizeId:
          type: string
        effectiveSizeId:
          type: string
        phase:
          type: string
          enum: [requested, applying, effective, failed]
        operationId:
          type: [string, "null"]
          format: uuid
        updatedAt:
          type: [string, "null"]
          format: date-time
        observedAt:
          type: [string, "null"]
          format: date-time
    ResizeIntentResponse:
      type: object
      additionalProperties: false
      required: [compute, operation]
      properties:
        compute:
          $ref: "#/components/schemas/EnvironmentCompute"
        operation:
          $ref: "#/components/schemas/RecoveryOperation"
    EnvironmentRuntime:
      type: object
      required:
        - revision
        - desiredState
        - phase
      properties:
        revision:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        desiredState:
          type: string
          enum:
            - running
            - suspended
        phase:
          type: string
          enum:
            - running
            - unknown
            - suspending
            - suspended
        operationId:
          type:
            - string
            - "null"
          format: uuid
        observedAt:
          type:
            - string
            - "null"
          format: date-time
        observation:
          type:
            - object
            - "null"
          description:
            Accepted nonsecret regional stop evidence; never settlement or
            SQL reachability.
    BackupPublicArtifact:
      type: object
      additionalProperties: false
      description: Operator base artifact only; times normalized to UTC milliseconds, begin/end times and LSN ordered.
      required:
        [
          backupId,
          backupName,
          majorVersion,
          startedAt,
          stoppedAt,
          beginWal,
          endWal,
          beginLSN,
          endLSN,
          online,
        ]
      properties:
        backupId:
          type: string
          minLength: 1
          maxLength: 255
        backupName:
          type: string
          minLength: 1
          maxLength: 255
        majorVersion:
          type: integer
          minimum: 10
          maximum: 99
        startedAt:
          type: string
          format: date-time
        stoppedAt:
          type: string
          format: date-time
        beginWal:
          type: string
          pattern: ^[0-9A-F]{24}$
        endWal:
          type: string
          pattern: ^[0-9A-F]{24}$
        beginLSN:
          type: string
          pattern: ^[0-9A-F]{1,8}/[0-9A-F]{1,8}$
        endLSN:
          type: string
          pattern: ^[0-9A-F]{1,8}/[0-9A-F]{1,8}$
        online:
          type: boolean
          const: true
    BackupPluginMetadata:
      type: object
      additionalProperties: false
      description: Exact pinned Barman six-field metadata; clusterUID must match accepted source, no archive URLs or Secret references.
      required: [timeline, version, name, displayName, clusterUID, pluginName]
      properties:
        timeline:
          type: string
          pattern: ^[1-9][0-9]{0,9}$
        version:
          type: string
          const: 0.15.0
        name:
          type: string
          const: barman-cloud.cloudnative-pg.io
        displayName:
          type: string
          const: BarmanCloudInstance
        clusterUID:
          type: string
          format: uuid
        pluginName:
          type: string
          const: barman-cloud.cloudnative-pg.io
    BackupExecutorArtifact:
      type: object
      additionalProperties: false
      required:
        [
          backupId,
          backupName,
          majorVersion,
          startedAt,
          stoppedAt,
          beginWal,
          endWal,
          beginLSN,
          endLSN,
          online,
          pluginMetadata,
        ]
      properties:
        backupId:
          type: string
          minLength: 1
          maxLength: 255
        backupName:
          type: string
          minLength: 1
          maxLength: 255
        majorVersion:
          type: integer
          minimum: 10
          maximum: 99
        startedAt:
          type: string
          format: date-time
        stoppedAt:
          type: string
          format: date-time
        beginWal:
          type: string
          pattern: ^[0-9A-F]{24}$
        endWal:
          type: string
          pattern: ^[0-9A-F]{24}$
        beginLSN:
          type: string
          pattern: ^[0-9A-F]{1,8}/[0-9A-F]{1,8}$
        endLSN:
          type: string
          pattern: ^[0-9A-F]{1,8}/[0-9A-F]{1,8}$
        online:
          type: boolean
          const: true
        pluginMetadata:
          $ref: "#/components/schemas/BackupPluginMetadata"
    ManualBackup:
      type: object
      additionalProperties: false
      description: Historical operator artifact observation; not remote-object preservation, restore or PITR qualification.
      required:
        [
          id,
          organizationId,
          projectId,
          environmentId,
          regionId,
          status,
          createdAt,
          observedAt,
          artifact,
          remoteObjectsVerified,
          restoreVerified,
          PITRVerified,
        ]
      properties:
        id:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        environmentId:
          type: string
          format: uuid
        regionId:
          type: string
          format: uuid
        status:
          type: string
          enum: [pending, completed, failed]
        createdAt:
          type: string
          format: date-time
        observedAt:
          type: [string, "null"]
          format: date-time
        artifact:
          anyOf:
            - $ref: "#/components/schemas/BackupPublicArtifact"
            - type: "null"
        remoteObjectsVerified:
          type: boolean
          const: false
        restoreVerified:
          type: boolean
          const: false
        PITRVerified:
          type: boolean
          const: false
    ManualBackupOperation:
      type: object
      additionalProperties: false
      description: Backup response operation metadata; ordinary organization recovery uses RecoveryOperation with ownership context.
      required: [id, backupId, kind, status, createdAt, observedAt, resultCode]
      properties:
        id:
          type: string
          format: uuid
        backupId:
          type: string
          format: uuid
        kind:
          type: string
          const: environment.backup
        status:
          type: string
          enum: [queued, running, completed, failed]
        createdAt:
          type: string
          format: date-time
        observedAt:
          type: [string, "null"]
          format: date-time
        resultCode:
          type: [string, "null"]
          enum: [null, base_backup_completed, backup_failed]
    ManualBackupResponse:
      type: object
      additionalProperties: false
      required: [backup, operation]
      properties:
        backup:
          $ref: "#/components/schemas/ManualBackup"
        operation:
          $ref: "#/components/schemas/ManualBackupOperation"
    BackupDispatchBinding:
      type: object
      additionalProperties: false
      description: Full actual ObjectStore spec and fixed Backup spec use recursive ASCII key-sorted JSON SHA-256; source specification is immutable.
      required:
        [
          namespaceUid,
          clusterUid,
          specHash,
          objectStoreUid,
          objectStoreGeneration,
          objectStoreSpecHash,
          backupName,
          backupSpecHash,
        ]
      properties:
        namespaceUid:
          type: string
          format: uuid
        clusterUid:
          type: string
          format: uuid
        specHash:
          type: string
          pattern: ^[a-f0-9]{64}$
        objectStoreUid:
          type: string
          format: uuid
        objectStoreGeneration:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        objectStoreSpecHash:
          type: string
          pattern: ^[a-f0-9]{64}$
        backupName:
          type: string
          pattern: ^backup-[0-9a-f]{32}$
        backupSpecHash:
          type: string
          pattern: ^[a-f0-9]{64}$
    BackupDispatch:
      type: object
      additionalProperties: false
      required: [version, nonce, leaseEpoch, binding]
      properties:
        version:
          type: integer
          const: 1
        nonce:
          type: string
          format: uuid
        leaseEpoch:
          $ref: "#/components/schemas/LeaseEpoch"
        binding:
          $ref: "#/components/schemas/BackupDispatchBinding"
    BackupLeaseRequest:
      type: object
      additionalProperties: false
      required: [leaseSeconds]
      properties:
        leaseSeconds:
          $ref: "#/components/schemas/LeaseSeconds"
    BackupRenewRequest:
      type: object
      additionalProperties: false
      required: [leaseToken, leaseEpoch, leaseSeconds]
      properties:
        leaseToken:
          $ref: "#/components/schemas/LeaseToken"
        leaseEpoch:
          $ref: "#/components/schemas/LeaseEpoch"
        leaseSeconds:
          $ref: "#/components/schemas/LeaseSeconds"
    BackupRenewResponse:
      type: object
      additionalProperties: false
      required: [leaseExpiresAt]
      properties:
        leaseExpiresAt:
          type: string
          format: date-time
    BackupDispatchRequest:
      type: object
      additionalProperties: false
      required: [leaseToken, leaseEpoch, nonce, binding]
      properties:
        leaseToken:
          $ref: "#/components/schemas/LeaseToken"
        leaseEpoch:
          $ref: "#/components/schemas/LeaseEpoch"
        nonce:
          type: string
          format: uuid
        binding:
          $ref: "#/components/schemas/BackupDispatchBinding"
    BackupDispatchResponse:
      type: object
      additionalProperties: false
      required: [dispatch, created]
      properties:
        dispatch:
          $ref: "#/components/schemas/BackupDispatch"
        created:
          type: boolean
          description: True only for the newly persisted same-process checkpoint; exact replay false forbids create.
    BackupTerminalObservation:
      type: object
      additionalProperties: false
      description: Bound immutable dispatch fields; completed requires artifact, failed requires null; no raw errors or credential data.
      required:
        [
          namespaceUid,
          clusterUid,
          objectStoreUid,
          objectStoreGeneration,
          objectStoreSpecHash,
          backupResourceUid,
          backupResourceVersion,
          backupSpecHash,
          phase,
          artifact,
          remoteObjectsVerified,
          restoreVerified,
        ]
      properties:
        namespaceUid:
          type: string
          format: uuid
        clusterUid:
          type: string
          format: uuid
        objectStoreUid:
          type: string
          format: uuid
        objectStoreGeneration:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        objectStoreSpecHash:
          type: string
          pattern: ^[a-f0-9]{64}$
        backupResourceUid:
          type: string
          format: uuid
        backupResourceVersion:
          type: string
          pattern: ^[A-Za-z0-9._:-]{1,128}$
        backupSpecHash:
          type: string
          pattern: ^[a-f0-9]{64}$
        phase:
          type: string
          enum: [completed, failed]
        artifact:
          anyOf:
            - $ref: "#/components/schemas/BackupExecutorArtifact"
            - type: "null"
        remoteObjectsVerified:
          type: boolean
          const: false
        restoreVerified:
          type: boolean
          const: false
    BackupResultRequest:
      type: object
      additionalProperties: false
      required: [leaseToken, leaseEpoch, status, resultCode, observation]
      properties:
        leaseToken:
          $ref: "#/components/schemas/LeaseToken"
        leaseEpoch:
          $ref: "#/components/schemas/LeaseEpoch"
        status:
          type: string
          enum: [completed, failed]
        resultCode:
          type: string
          enum: [base_backup_completed, backup_failed]
        observation:
          $ref: "#/components/schemas/BackupTerminalObservation"
    BackupExecutionClaim:
      type: object
      additionalProperties: false
      description: Private trusted executor input; specification includes credential references, never credential values. Existing dispatch prohibits create in a reclaimed process.
      required:
        [
          schemaVersion,
          kind,
          operationId,
          backupId,
          organizationId,
          projectId,
          environmentId,
          regionId,
          specRevision,
          specHash,
          clusterUid,
          runtimeRevision,
          spec,
          dispatch,
          leaseToken,
          leaseEpoch,
          leaseExpiresAt,
        ]
      properties:
        schemaVersion:
          type: integer
          const: 1
        kind:
          type: string
          const: environment.backup
        operationId:
          type: string
          format: uuid
        backupId:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        environmentId:
          type: string
          format: uuid
        regionId:
          type: string
          format: uuid
        specRevision:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        specHash:
          type: string
          pattern: ^[a-f0-9]{64}$
        clusterUid:
          type: string
          format: uuid
        runtimeRevision:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        runEpoch:
          type: string
          pattern: ^[1-9][0-9]{0,18}$
        spec:
          $ref: "#/components/schemas/ExecutionSpec"
        dispatch:
          anyOf:
            - $ref: "#/components/schemas/BackupDispatch"
            - type: "null"
        leaseToken:
          $ref: "#/components/schemas/LeaseToken"
        leaseEpoch:
          $ref: "#/components/schemas/LeaseEpoch"
        leaseExpiresAt:
          type: string
          format: date-time
    BackupClaimResponse:
      type: object
      additionalProperties: false
      required: [claim]
      properties:
        claim:
          anyOf:
            - $ref: "#/components/schemas/BackupExecutionClaim"
            - type: "null"
    NativeAccessPolicy:
      type: object
      additionalProperties: false
      required: [version, clientProfileId]
      description: >-
        Installation-owned immutable opt-in. The region independently maps the
        opaque ID to an exact approved client Namespace and ServiceAccount;
        customers cannot submit network identities or selectors.
      properties:
        version:
          type: integer
          const: 1
        clientProfileId:
          type: string
          pattern: ^[a-z][a-z0-9_-]{0,63}$
    NativeConnectionObservation:
      type: object
      additionalProperties: false
      required:
        - version
        - visibility
        - mode
        - clientProfileId
        - namespaceUid
        - clusterUid
        - clusterGeneration
        - specHash
        - serviceUid
        - serviceResourceVersion
        - primaryPodUid
        - endpointSliceUid
        - policyUid
        - host
        - port
        - caCertificate
        - caCertificateSha256
        - serverCertificateSha256
        - caValidFrom
        - caValidUntil
        - serverValidUntil
        - observedAt
      description: >-
        Authenticated regional provisioning evidence, fenced by the existing
        environment-result lease. The Worker validates exact shape, resource
        identities, derived host, frozen spec, public CA hash and reported time
        intervals; the executor verifies X509 signatures, CA/server constraints,
        server purpose and host. This is not a live SQL, TLS or Cilium-realization
        observation. Server certificate identity/expiry are historical values.
      properties:
        version:
          type: integer
          const: 1
        visibility:
          type: string
          const: private
        mode:
          type: string
          const: direct
        clientProfileId:
          $ref: "#/components/schemas/NativeAccessPolicy/properties/clientProfileId"
        namespaceUid:
          type: string
          format: uuid
        clusterUid:
          type: string
          format: uuid
        clusterGeneration:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        specHash:
          type: string
          pattern: ^[a-f0-9]{64}$
        serviceUid:
          type: string
          format: uuid
        serviceResourceVersion:
          type: string
          pattern: ^[A-Za-z0-9._:-]{1,128}$
        primaryPodUid:
          type: string
          format: uuid
        endpointSliceUid:
          type: string
          format: uuid
        policyUid:
          type: string
          format: uuid
        host:
          type: string
          pattern: ^database-rw\.pgcf-[a-f0-9]{32}\.svc$
        port:
          type: integer
          const: 5432
        caCertificate:
          type: string
          maxLength: 8192
          description: One bounded public PEM certificate, never a private key or bundle.
        caCertificateSha256:
          type: string
          pattern: ^[a-f0-9]{64}$
          description: SHA-256 of the exact UTF-8 public PEM text.
        serverCertificateSha256:
          type: string
          pattern: ^[a-f0-9]{64}$
          description: SHA-256 of the provisioning leaf DER, not a live leaf pin.
        caValidFrom:
          type: string
          format: date-time
        caValidUntil:
          type: string
          format: date-time
        serverValidUntil:
          type: string
          format: date-time
          description: Historical leaf validity at observedAt; normal renewal is allowed.
        observedAt:
          type: string
          format: date-time
    NativeConnection:
      type: object
      additionalProperties: false
      required:
        - version
        - visibility
        - mode
        - clientProfileId
        - namespaceUid
        - clusterUid
        - clusterGeneration
        - specHash
        - serviceUid
        - serviceResourceVersion
        - primaryPodUid
        - endpointSliceUid
        - policyUid
        - host
        - port
        - caCertificate
        - caCertificateSha256
        - serverCertificateSha256
        - caValidFrom
        - caValidUntil
        - serverValidUntil
        - observedAt
        - environmentId
        - specRevision
        - sslmode
        - observationScope
      properties:
        version:
          $ref: "#/components/schemas/NativeConnectionObservation/properties/version"
        visibility:
          $ref: "#/components/schemas/NativeConnectionObservation/properties/visibility"
        mode:
          $ref: "#/components/schemas/NativeConnectionObservation/properties/mode"
        clientProfileId:
          $ref: "#/components/schemas/NativeConnectionObservation/properties/clientProfileId"
        namespaceUid:
          $ref: "#/components/schemas/NativeConnectionObservation/properties/namespaceUid"
        clusterUid:
          $ref: "#/components/schemas/NativeConnectionObservation/properties/clusterUid"
        clusterGeneration:
          $ref: "#/components/schemas/NativeConnectionObservation/properties/clusterGeneration"
        specHash:
          $ref: "#/components/schemas/NativeConnectionObservation/properties/specHash"
        serviceUid:
          $ref: "#/components/schemas/NativeConnectionObservation/properties/serviceUid"
        serviceResourceVersion:
          $ref: "#/components/schemas/NativeConnectionObservation/properties/serviceResourceVersion"
        primaryPodUid:
          $ref: "#/components/schemas/NativeConnectionObservation/properties/primaryPodUid"
        endpointSliceUid:
          $ref: "#/components/schemas/NativeConnectionObservation/properties/endpointSliceUid"
        policyUid:
          $ref: "#/components/schemas/NativeConnectionObservation/properties/policyUid"
        host:
          $ref: "#/components/schemas/NativeConnectionObservation/properties/host"
        port:
          $ref: "#/components/schemas/NativeConnectionObservation/properties/port"
        caCertificate:
          $ref: "#/components/schemas/NativeConnectionObservation/properties/caCertificate"
        caCertificateSha256:
          $ref: "#/components/schemas/NativeConnectionObservation/properties/caCertificateSha256"
        serverCertificateSha256:
          $ref: "#/components/schemas/NativeConnectionObservation/properties/serverCertificateSha256"
        caValidFrom:
          $ref: "#/components/schemas/NativeConnectionObservation/properties/caValidFrom"
        caValidUntil:
          $ref: "#/components/schemas/NativeConnectionObservation/properties/caValidUntil"
        serverValidUntil:
          $ref: "#/components/schemas/NativeConnectionObservation/properties/serverValidUntil"
        observedAt:
          $ref: "#/components/schemas/NativeConnectionObservation/properties/observedAt"
        environmentId:
          type: string
          format: uuid
        specRevision:
          type: integer
          const: 1
        sslmode:
          type: string
          const: verify-full
        observationScope:
          type: string
          const: provisioning
    PoolingPolicy:
