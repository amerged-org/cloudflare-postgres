  /v1/organizations/{organizationId}/projects/{projectId}/environments/{environmentId}/resize:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/AccountingEnvironmentId"
    post:
      operationId: requestManualEnvironmentResize
      summary: Retain one approved manual resize intention
      description: >-
        Requires projects:write and Idempotency-Key. Accepts only an approved
        immutable-profile size ID and the expected compute revision. An atomic
        D1 check binds active ownership, ready running runtime, base spec,
        Cluster/run identity, requested budget state and absence of conflicting
        work. The response is queued with resultCode awaiting_authority. No
        target funding, fleet reservation, regional lease, Kubernetes patch,
        or claim that the requested size is effective is provided yet.
      security:
        - organizationToken: []
      parameters:
        - $ref: "#/components/parameters/LifecycleIdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [sizeId, expectedRevision]
              properties:
                sizeId:
                  type: string
                  pattern: ^[a-z][a-z0-9_-]{0,63}$
                expectedRevision:
                  type: integer
                  minimum: 0
                  maximum: 9007199254740990
      responses:
        "202":
          description: Durable queued intent and recoverable operation; no physical resize.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResizeIntentResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
