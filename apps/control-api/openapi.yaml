openapi: 3.1.0
info:
  title: Cloudflare Postgres Control API
  version: 0.1.0
  description: >-
    Projects are global logical containers created immediately. Database
    environments select an explicit admitted region and immutable profile
    version. Regional executors lease environment.create operations and report
    observed readiness. Ready does not imply an exposed connection endpoint,
    customer credentials, or successful backup/recovery qualification. Usage and
    budget APIs record exact control authority. Budget and allowance resources
    report runtimeEnforced false and pending_runtime until M6 runtime collection,
    durable journals, supervision and expiry guards are qualified.
paths:
  /v1/regions:
    get:
      operationId: listRegions
      summary: Page through registered regions for installation recovery
      description: >-
        Installation-token-only list, newest first by creation time and ID.
        Follow nextCursor until null. Region names are unique with exact,
        case-sensitive matching. Tokens are never returned by this route.
      security:
        - installationToken: []
      parameters:
        - name: limit
          in: query
          description: Page size; defaults to 1000.
          schema:
            type: integer
            minimum: 1
            maximum: 1000
        - name: cursor
          in: query
          description: Opaque nextCursor from the preceding page.
          schema:
            type: string
      responses:
        "200":
          description: One region page
          content:
            application/json:
              schema:
                type: object
                required: [regions, nextCursor]
                properties:
                  regions:
                    type: array
                    items:
                      $ref: "#/components/schemas/Region"
                  nextCursor:
                    type: [string, "null"]
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          description: Installation bootstrap secret is unconfigured
    post:
      operationId: registerRegion
      summary: Register a region and reveal its executor token once
      description: >-
        Registration records identity only. New environment admission is closed
        until an installation operator explicitly publishes a catalog and opens
        admission. A region name is unique under exact, case-sensitive matching.
      security:
        - installationToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NameInput"
      responses:
        "201":
          description: Region registered; save the returned token securely
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegionTokenResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Region name already registered (region_name_conflict)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Installation bootstrap secret is unconfigured
  /v1/regions/{regionId}:
    parameters:
      - $ref: "#/components/parameters/RegionId"
    get:
      operationId: getRegion
      summary: Read region registration without its token
      security:
        - installationToken: []
      responses:
        "200":
          description: Registered region
          content:
            application/json:
              schema:
                type: object
                required: [region]
                properties:
                  region:
                    $ref: "#/components/schemas/Region"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          description: Installation bootstrap secret is unconfigured
  /v1/regions/{regionId}/tokens/reissue:
    parameters:
      - $ref: "#/components/parameters/RegionId"
    post:
      operationId: reissueRegionToken
      summary: Reissue a lost region executor token
      description: >-
        Installation-token-only recovery operation. Revokes every previously
        active token for this region and reveals the replacement once.
      security:
        - installationToken: []
      responses:
        "201":
          description: Previous token revoked; replacement token issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegionTokenResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          description: Installation bootstrap secret is unconfigured
  /v1/organizations:
    get:
      operationId: listOrganizations
      summary: Page through organizations for installation recovery
      description: >-
        Installation-token-only list, newest first by creation time and ID.
        Follow nextCursor until it is null to reach older organizations after a
        lost bootstrap response. The cursor advances by creation time and ID;
        concurrent creations or deletions can change later pages.
      security:
        - installationToken: []
      parameters:
        - name: limit
          in: query
          description: Page size; defaults to 1000.
          schema:
            type: integer
            minimum: 1
            maximum: 1000
        - name: cursor
          in: query
          description: Opaque nextCursor value returned by the preceding page.
          schema:
            type: string
      responses:
        "200":
          description: One organization page
          content:
            application/json:
              schema:
                type: object
                required: [organizations, nextCursor]
                properties:
                  organizations:
                    type: array
                    items:
                      $ref: "#/components/schemas/Organization"
                  nextCursor:
                    type: [string, "null"]
                    description: Pass this as cursor to fetch the next page, if present.
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          description: Installation bootstrap secret is unconfigured
    post:
      operationId: bootstrapOrganization
      summary: Create an organization and reveal its scoped API token once
      security:
        - installationToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NameInput"
      responses:
        "201":
          description: Organization created; save the returned token now
          content:
            application/json:
              schema:
                type: object
                required: [organization, apiToken, scopes]
                properties:
                  organization:
                    $ref: "#/components/schemas/Organization"
                  apiToken:
                    type: string
                    pattern: "^cporg_[A-Za-z0-9_-]+$"
                  scopes:
                    type: array
                    items:
                      type: string
                      enum: [projects:read, projects:write, operations:read]
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          description: Installation bootstrap secret is unconfigured
  /v1/organizations/{organizationId}/tokens/reissue:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    post:
      operationId: reissueOrganizationToken
      summary: Reissue a lost organization token
      description: >-
        Installation-token-only recovery operation. Revokes every previously active
        token for this organization and reveals the replacement token once.
      security:
        - installationToken: []
      responses:
        "201":
          description: Previous tokens revoked; replacement token issued
          content:
            application/json:
              schema:
                type: object
                required: [organization, apiToken, scopes]
                properties:
                  organization:
                    $ref: "#/components/schemas/Organization"
                  apiToken:
                    type: string
                    pattern: "^cporg_[A-Za-z0-9_-]+$"
                  scopes:
                    type: array
                    items:
                      type: string
                      enum: [projects:read, projects:write, operations:read]
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          description: Installation bootstrap secret is unconfigured
  /v1/organizations/{organizationId}/projects:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    post:
      operationId: createProject
      summary: Create a logical project and completed audit operation
      description:
        Creates a global logical container in D1. No region, PostgreSQL cluster,
        database, credential, or connection endpoint is provisioned.
      security:
        - organizationToken: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
            pattern: ^[A-Za-z0-9._~-]+$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NameInput"
      responses:
        "201":
          description:
            Logical project created; the same key and request preserve both
            IDs
          content:
            application/json:
              schema:
                type: object
                required:
                  - project
                  - operation
                properties:
                  project:
                    $ref: "#/components/schemas/Project"
                  operation:
                    $ref: "#/components/schemas/Operation"
        "202":
          description:
            An unmatched legacy project remains pending with a queued operation.
            Its IDs are preserved and operator review is required.
          content:
            application/json:
              schema:
                type: object
                required:
                  - project
                  - operation
                properties:
                  project:
                    $ref: "#/components/schemas/Project"
                  operation:
                    $ref: "#/components/schemas/Operation"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Idempotency key already used with another request
    get:
      operationId: listProjects
      summary: Recover projects in the authorized parent
      description:
        Requires projects:read. Returns observed metadata and a current operation
        identifier, never credentials or execution authority. Pages are not a frozen
        snapshot. Missing or foreign parents return 404; owned empty parents return
        200. Only one limit and cursor are accepted.
      security:
        - organizationToken: []
      parameters:
        - $ref: "#/components/parameters/RecoveryLimit"
        - $ref: "#/components/parameters/RecoveryCursor"
      responses:
        "200":
          description: Bounded observed resource page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoveryProjectsPage"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          description:
            Ambiguous persisted operation linkage or unavailable recovery
            read
        "503":
          description: Cursor signing key unavailable
  /v1/organizations/{organizationId}/projects/{projectId}:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getProject
      summary: Read a project in the authorized organization
      security:
        - organizationToken: []
      responses:
        "200":
          description: Project state
          content:
            application/json:
              schema:
                type: object
                required: [project]
                properties:
                  project:
                    $ref: "#/components/schemas/Project"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/organizations/{organizationId}/operations/{operationId}:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - name: operationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getOperation
      summary: Recover a project, environment, role or database operation
      security:
        - organizationToken: []
      responses:
        "200":
          description: Operation state
          content:
            application/json:
              schema:
                type: object
                required:
                  - operation
                properties:
                  operation:
                    $ref: "#/components/schemas/RecoveryOperation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "500":
          description:
            Ambiguous visible operation identifier or unavailable recovery
            read
      description:
        Requires operations:read. Historical metadata stays readable; query
        parameters are rejected. Ambiguous visible identifiers return 500 state_inconsistent.
  /v1/regions/{regionId}/catalogs:
    parameters:
      - $ref: "#/components/parameters/RegionId"
    post:
      operationId: publishRegionCatalog
      summary: Publish an immutable regional profile version
      description: >-
        Installation-only trusted configuration. The body is bounded to 16384
        UTF-8 bytes and 16 unique profiles. Versions cannot be replaced or
        deleted. Publishing does not open admission or prove qualification.
        The response omits internal storage mapping and backup locations/refs.
      security:
        - installationToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [version, profiles]
              properties:
                version:
                  $ref: "#/components/schemas/CatalogVersion"
                profiles:
                  type: array
                  minItems: 1
                  maxItems: 16
                  items:
                    $ref: "#/components/schemas/OperatorProfile"
      responses:
        "201":
          description: Immutable catalog published
          content:
            application/json:
              schema:
                type: object
                required: [catalog]
                properties:
                  catalog:
                    $ref: "#/components/schemas/PublicCatalog"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The version already exists (catalog_version_conflict)
  /v1/regions/{regionId}/admission:
    parameters:
      - $ref: "#/components/parameters/RegionId"
    get:
      operationId: getRegionAdmission
      summary: Read the separately mutable admission policy
      security:
        - installationToken: []
      responses:
        "200":
          $ref: "#/components/responses/AdmissionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: setRegionAdmission
      summary: Explicitly open or close admission for a published version
      description: >-
        Opening is an operator action after qualification; this API does not
        verify backup evidence. Closing prevents new creation but does not revoke
        already accepted environment operations or alter their frozen specs.
      security:
        - installationToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [catalogVersion, acceptingNewEnvironments]
              properties:
                catalogVersion:
                  $ref: "#/components/schemas/CatalogVersion"
                acceptingNewEnvironments:
                  type: boolean
      responses:
        "200":
          $ref: "#/components/responses/AdmissionResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: A disabled region cannot be opened
  /v1/organizations/{organizationId}/regions/{regionId}/catalogs/{catalogVersion}:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - $ref: "#/components/parameters/RegionId"
      - name: catalogVersion
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/CatalogVersion"
    get:
      operationId: getPublicRegionCatalog
      summary: Discover supported profiles without internal configuration
      security:
        - organizationToken: []
      responses:
        "200":
          description: Public catalog and current admission
          content:
            application/json:
              schema:
                type: object
                required: [catalog, admission]
                properties:
                  catalog:
                    $ref: "#/components/schemas/PublicCatalog"
                  admission:
                    $ref: "#/components/schemas/Admission"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/organizations/{organizationId}/projects/{projectId}/environments:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - $ref: "#/components/parameters/ProjectId"
    post:
      operationId: createEnvironment
      summary: Accept a frozen environment specification for regional execution
      description:
        Requires projects:write, an active logical project, and admission
        for the exact requested catalog version. There are no provider/customer defaults.
        Environment, queued operation, and idempotency identity are inserted atomically
        with a fresh admission check. Identical retries preserve IDs and return current
        observed state even after admission closes; changed content under the same organization-wide
        environment key returns 409. No endpoint or credential is issued.
      security:
        - organizationToken: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            pattern: ^[A-Za-z0-9._~-]{1,128}$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnvironmentInput"
      responses:
        "202":
          description: Accepted environment and current operation state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvironmentOperationResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Admission closed, project not active, or idempotency conflict
    get:
      operationId: listEnvironments
      summary: Recover environments in the authorized parent
      description:
        Requires projects:read. Returns observed metadata and a current operation
        identifier, never credentials or execution authority. Pages are not a frozen
        snapshot. Missing or foreign parents return 404; owned empty parents return
        200. Only one limit and cursor are accepted.
      security:
        - organizationToken: []
      parameters:
        - $ref: "#/components/parameters/RecoveryLimit"
        - $ref: "#/components/parameters/RecoveryCursor"
      responses:
        "200":
          description: Bounded observed resource page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoveryEnvironmentsPage"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          description:
            Ambiguous persisted operation linkage or unavailable recovery
            read
        "503":
          description: Cursor signing key unavailable
  /v1/organizations/{organizationId}/projects/{projectId}/environments/{environmentId}:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - $ref: "#/components/parameters/ProjectId"
      - name: environmentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getEnvironment
      summary: Observe an environment in its authorized project
      security:
        - organizationToken: []
      responses:
        "200":
          description: Public environment state without internal routing or secrets
          content:
            application/json:
              schema:
                type: object
                required: [environment]
                properties:
                  environment:
                    $ref: "#/components/schemas/Environment"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/regions/{regionId}/operations/claim:
    parameters:
      - $ref: "#/components/parameters/RegionId"
    post:
      operationId: claimRegionalOperation
      summary: Atomically lease one queued or expired environment operation
      description: >-
        Requires this region's operations:claim token. The private response
        includes the complete frozen operator spec; do not expose it to tenants.
        A claim increments its epoch and returns a random token stored only as a
        hash. Competing claims cannot receive the same active operation.
      security:
        - regionToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [leaseSeconds]
              properties:
                leaseSeconds:
                  $ref: "#/components/schemas/LeaseSeconds"
      responses:
        "200":
          description: One private execution claim, or null when no work is available
          content:
            application/json:
              schema:
                type: object
                required: [claim]
                properties:
                  claim:
                    anyOf:
                      - $ref: "#/components/schemas/ExecutionClaim"
                      - type: "null"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/regions/{regionId}/operations/{operationId}/renew:
    parameters:
      - $ref: "#/components/parameters/RegionId"
      - $ref: "#/components/parameters/OperationId"
    post:
      operationId: renewRegionalLease
      summary: Extend a still-current unexpired execution lease
      security:
        - regionToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [leaseToken, leaseEpoch, leaseSeconds]
              properties:
                leaseToken:
                  $ref: "#/components/schemas/LeaseToken"
                leaseEpoch:
                  $ref: "#/components/schemas/LeaseEpoch"
                leaseSeconds:
                  $ref: "#/components/schemas/LeaseSeconds"
      responses:
        "200":
          description: Lease renewed
          content:
            application/json:
              schema:
                type: object
                required: [leaseExpiresAt]
                properties:
                  leaseExpiresAt:
                    type: string
                    format: date-time
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/LeaseConflict"
  /v1/regions/{regionId}/operations/{operationId}/result:
    parameters:
      - $ref: "#/components/parameters/RegionId"
      - $ref: "#/components/parameters/OperationId"
    post:
      operationId: reportRegionalResult
      summary: Atomically publish fenced observed environment status
      description: >-
        Requires operations:report. A ready result requires at least the profile's
        instance count and a cluster UID/generation; the executor is responsible
        for reading actual CNPG and Pod readiness. D1 does not query Kubernetes.
        An expired/reassigned lease or another region cannot publish a result.
        Repeating the exact terminal result with the same lease remains safe
        after an uncertain response; changed terminal content is rejected.
      security:
        - regionToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExecutionResultInput"
      responses:
        "200":
          description: Observed status recorded or identical terminal result replayed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvironmentOperationResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/LeaseConflict"
  /v1/regions/{regionId}/usage-tokens/reissue:
    parameters:
      - $ref: "#/components/parameters/RegionId"
    post:
      operationId: reissueUsageMeterToken
      summary: Issue separate regional meter authority
      description: >-
        Installation-only. Revokes old cpmtr credential and returns usage:write once; source ID/epoch
        survive rotation.
      security:
        - installationToken: []
      responses:
        "201":
          description: Meter credential issued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsageMeterTokenResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/AccountingConflict"
        "500":
          $ref: "#/components/responses/AccountingUnavailable"
        "503":
          $ref: "#/components/responses/AccountingUnavailable"
  /v1/regions/{regionId}/usage-facts:
    parameters:
      - $ref: "#/components/parameters/RegionId"
    post:
      operationId: appendUsageRevision
      summary: Append or replay an immutable usage revision
      description: >-
        Only cpmtr usage:write. Identity stays immutable; revisions are conditional. Accepted
        settled-fact corrections update bound accounts atomically. Body limit: 8192 UTF-8 bytes.
      security:
        - usageMeterToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UsageFactInput"
      responses:
        "200":
          description: Identical revision replayed without duplicate accounting.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsageFactResponse"
        "201":
          description: New revision accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsageFactResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/AccountingConflict"
        "500":
          $ref: "#/components/responses/AccountingUnavailable"
        "503":
          $ref: "#/components/responses/AccountingUnavailable"
  /v1/organizations/{organizationId}/usage:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    get:
      operationId: queryUsageSnapshot
      summary: Read one tenant-bound fixed-snapshot usage page
      description: >-
        Unknown/repeated parameters are rejected. Page-local totals and unknown coverage do not assert
        a complete window. Cursors preserve the acceptance snapshot across later corrections;
        installation-secret rotation invalidates cursors.
      security:
        - organizationToken: []
        - budgetGrantorToken: []
      parameters:
        - name: from
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/UsageMinuteBoundary"
          description: Inclusive minute boundary; positive window at most 31 days.
        - name: to
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/UsageMinuteBoundary"
          description: Exclusive minute boundary; facts wholly within window only.
        - name: projectId
          in: query
          schema:
            $ref: "#/components/schemas/AccountingUuid"
        - name: environmentId
          in: query
          schema:
            $ref: "#/components/schemas/AccountingUuid"
          description: Tenant-owned, matching projectId when supplied.
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: cursor
          in: query
          schema:
            type: string
            maxLength: 2048
          description: Opaque cursor bound to tenant/window/filters and fixed watermark; page size may change.
      responses:
        "200":
          description: Fixed-watermark page; not a complete-window total.
          content:
            application/json:
              schema:
