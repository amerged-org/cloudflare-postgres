      description: >-
        Unknown/repeated parameters are rejected. Page-local totals and unknown coverage do not assert
        a complete window. Cursors preserve the acceptance snapshot across later corrections;
        installation-secret rotation invalidates cursors. One bare UsageFact per line, followed by
