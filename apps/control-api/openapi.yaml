openapi: 3.1.0
info:
  title: Cloudflare Postgres Control API
  version: 0.1.0
  description: >-
    First management slice. Projects are global logical containers created
    immediately; an active project does not contain a database or connection
    endpoint. Region registration issues a scoped executor token, but no
    regional operation claims or PostgreSQL provisioning are implemented.
paths:
  /v1/regions:
    get:
      operationId: listRegions
      summary: Page through registered regions for installation recovery
      description: >-
        Installation-token-only list, newest first by creation time and ID.
        Follow nextCursor until null. Region names are unique with exact,
        case-sensitive matching. Tokens are never returned by this route.
      security:
        - installationToken: []
      parameters:
        - name: limit
          in: query
          description: Page size; defaults to 1000.
          schema:
            type: integer
            minimum: 1
            maximum: 1000
        - name: cursor
          in: query
          description: Opaque nextCursor from the preceding page.
          schema:
            type: string
      responses:
        "200":
          description: One region page
          content:
            application/json:
              schema:
                type: object
                required: [regions, nextCursor]
                properties:
                  regions:
                    type: array
                    items:
                      $ref: "#/components/schemas/Region"
                  nextCursor:
                    type: [string, "null"]
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          description: Installation bootstrap secret is unconfigured
    post:
      operationId: registerRegion
      summary: Register a region and reveal its executor token once
      description: >-
        Registration records identity only. The region remains registered and
        cannot yet claim operations or serve PostgreSQL connections. A region
        name must be unique under exact, case-sensitive matching.
      security:
        - installationToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NameInput"
      responses:
        "201":
          description: Region registered; save the returned token securely
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegionTokenResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Region name already registered (region_name_conflict)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Installation bootstrap secret is unconfigured
  /v1/regions/{regionId}:
    parameters:
      - $ref: "#/components/parameters/RegionId"
    get:
      operationId: getRegion
      summary: Read region registration without its token
      security:
        - installationToken: []
      responses:
        "200":
          description: Registered region
          content:
            application/json:
              schema:
                type: object
                required: [region]
                properties:
                  region:
                    $ref: "#/components/schemas/Region"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          description: Installation bootstrap secret is unconfigured
  /v1/regions/{regionId}/tokens/reissue:
    parameters:
      - $ref: "#/components/parameters/RegionId"
    post:
      operationId: reissueRegionToken
      summary: Reissue a lost region executor token
      description: >-
        Installation-token-only recovery operation. Revokes every previously
        active token for this region and reveals the replacement once.
      security:
        - installationToken: []
      responses:
        "201":
          description: Previous token revoked; replacement token issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegionTokenResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          description: Installation bootstrap secret is unconfigured
  /v1/organizations:
    get:
      operationId: listOrganizations
      summary: Page through organizations for installation recovery
      description: >-
        Installation-token-only list, newest first by creation time and ID.
        Follow nextCursor until it is null to reach older organizations after a
        lost bootstrap response. The cursor advances by creation time and ID;
        concurrent creations or deletions can change later pages.
      security:
        - installationToken: []
      parameters:
        - name: limit
          in: query
          description: Page size; defaults to 1000.
          schema:
            type: integer
            minimum: 1
            maximum: 1000
        - name: cursor
          in: query
          description: Opaque nextCursor value returned by the preceding page.
          schema:
            type: string
      responses:
        "200":
          description: One organization page
          content:
            application/json:
              schema:
                type: object
                required: [organizations, nextCursor]
                properties:
                  organizations:
                    type: array
                    items:
                      $ref: "#/components/schemas/Organization"
                  nextCursor:
                    type: [string, "null"]
                    description: Pass this as cursor to fetch the next page, if present.
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          description: Installation bootstrap secret is unconfigured
    post:
      operationId: bootstrapOrganization
      summary: Create an organization and reveal its scoped API token once
      security:
        - installationToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NameInput"
      responses:
        "201":
          description: Organization created; save the returned token now
          content:
            application/json:
              schema:
                type: object
                required: [organization, apiToken, scopes]
                properties:
                  organization:
                    $ref: "#/components/schemas/Organization"
                  apiToken:
                    type: string
                    pattern: "^cporg_[A-Za-z0-9_-]+$"
                  scopes:
                    type: array
                    items:
                      type: string
                      enum: [projects:read, projects:write, operations:read]
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          description: Installation bootstrap secret is unconfigured
  /v1/organizations/{organizationId}/tokens/reissue:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    post:
      operationId: reissueOrganizationToken
      summary: Reissue a lost organization token
      description: >-
        Installation-token-only recovery operation. Revokes every previously active
        token for this organization and reveals the replacement token once.
      security:
        - installationToken: []
      responses:
        "201":
          description: Previous tokens revoked; replacement token issued
          content:
            application/json:
              schema:
                type: object
                required: [organization, apiToken, scopes]
                properties:
                  organization:
                    $ref: "#/components/schemas/Organization"
                  apiToken:
                    type: string
                    pattern: "^cporg_[A-Za-z0-9_-]+$"
                  scopes:
                    type: array
                    items:
                      type: string
                      enum: [projects:read, projects:write, operations:read]
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          description: Installation bootstrap secret is unconfigured
  /v1/organizations/{organizationId}/projects:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    post:
      operationId: createProject
      summary: Create a logical project and completed audit operation
      description: >-
        Creates a global logical container in D1. No region, PostgreSQL
        cluster, database, credential, or connection endpoint is provisioned.
      security:
        - organizationToken: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
            pattern: "^[A-Za-z0-9._~-]+$"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NameInput"
      responses:
        "201":
          description: Logical project created; the same key and request preserve both IDs
          content:
            application/json:
              schema:
                type: object
                required: [project, operation]
                properties:
                  project:
                    $ref: "#/components/schemas/Project"
                  operation:
                    $ref: "#/components/schemas/Operation"
        "202":
          description: >-
            An unmatched legacy project remains pending with a queued operation.
            Its IDs are preserved and operator review is required.
          content:
            application/json:
              schema:
                type: object
                required: [project, operation]
                properties:
                  project:
                    $ref: "#/components/schemas/Project"
                  operation:
                    $ref: "#/components/schemas/Operation"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Idempotency key already used with another request
  /v1/organizations/{organizationId}/projects/{projectId}:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getProject
      summary: Read a project in the authorized organization
      security:
        - organizationToken: []
      responses:
        "200":
          description: Project state
          content:
            application/json:
              schema:
                type: object
                required: [project]
                properties:
                  project:
                    $ref: "#/components/schemas/Project"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/organizations/{organizationId}/operations/{operationId}:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - name: operationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getOperation
      summary: Read an audit operation in the authorized organization
      security:
        - organizationToken: []
      responses:
        "200":
          description: Operation state
          content:
            application/json:
              schema:
                type: object
                required: [operation]
                properties:
                  operation:
                    $ref: "#/components/schemas/Operation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  securitySchemes:
    installationToken:
      type: http
      scheme: bearer
      description: Worker Secret configured by the installation operator.
    organizationToken:
      type: http
      scheme: bearer
      description: >-
        Token issued once at organization bootstrap with projects:read,
        projects:write, and operations:read scopes.
  parameters:
    RegionId:
      name: regionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OrganizationId:
      name: organizationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    InvalidRequest:
      description: Invalid request body, query parameter, or idempotency key
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Missing or invalid bearer token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Token lacks the required scope
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource absent or inaccessible to caller
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Region:
      type: object
      required: [id, name, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        status:
          type: string
          enum: [registered, active, disabled]
          description: Only registered is produced by the current API slice.
        createdAt:
          type: string
          format: date-time
    RegionTokenResponse:
      type: object
      required: [region, apiToken, scopes]
      properties:
        region:
          $ref: "#/components/schemas/Region"
        apiToken:
          type: string
          pattern: "^cprgn_[A-Za-z0-9_-]+$"
        scopes:
          type: array
          items:
            type: string
            enum: [operations:claim, operations:report]
          minItems: 2
          maxItems: 2
    NameInput:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
          description: Trimmed name without control characters.
    Organization:
      type: object
      required: [id, name, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        createdAt:
          type: string
          format: date-time
    Project:
      type: object
      required: [id, organizationId, name, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
        name:
          type: string
        status:
          type: string
          enum: [active, pending]
          description: >-
            Active means the logical container exists, not that a database is
            provisioned. Pending is reserved for unmatched legacy records.
        createdAt:
          type: string
          format: date-time
    Operation:
      type: object
      required:
        [
          id,
          organizationId,
          projectId,
          kind,
          status,
          createdAt,
          observedAt,
          resultCode,
        ]
      properties:
        id:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        kind:
          type: string
          enum: [project.create]
        status:
          type: string
          enum: [succeeded, queued]
          description: New project.create operations succeed in the D1 create batch.
        createdAt:
          type: string
          format: date-time
        observedAt:
          type: [string, "null"]
          format: date-time
          description: Time the logical project creation was observed as complete.
        resultCode:
          type: [string, "null"]
          enum: [logical_container_created, null]
          description: Null only for unmatched legacy operations.
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code]
          properties:
            code:
              type: string
