    post:
      operationId: suspendEnvironment
      summary: Accept an owned manual compute-stop intention
      description:
        Requires projects:write, Idempotency-Key and expected runtime revision.
        Active database work conflicts; no resume or settlement is promised.
      security:
        - organizationToken: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            pattern: ^[A-Za-z0-9._~-]{1,128}$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - expectedRevision
              properties:
                expectedRevision:
                  type: integer
                  minimum: 0
                  maximum: 9007199254740990
      responses:
        "202":
          description: Persisted runtime intention and recoverable task
          content:
            application/json:
              schema:
                type: object
                required:
                  - runtime
                  - operation
                properties:
                  runtime:
                    $ref: "#/components/schemas/EnvironmentRuntime"
                  operation:
                    $ref: "#/components/schemas/RecoveryOperation"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
