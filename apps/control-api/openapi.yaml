            Ambiguous persisted operation linkage or unavailable recovery
            read
        "503":
          description: Cursor signing key unavailable
components:
  securitySchemes:
    usageMeterToken:
      type: http
      scheme: bearer
      description: Installer-issued cpmtr regional meter credential with usage:write only.
    budgetGrantorToken:
      type: http
      scheme: bearer
      description: >-
        Installer-issued cpbgt organization grantor with budgets:read, budgets:write and usage:read;
        projects:write never grants budgets.
    installationToken:
      type: http
      scheme: bearer
      description: Worker Secret configured by the installation operator.
    organizationToken:
      type: http
      scheme: bearer
      description: >-
        Token issued once at organization bootstrap with projects:read,
        projects:write, and operations:read scopes.
    regionToken:
      type: http
      scheme: bearer
      description: Region-scoped executor token with operations:claim and operations:report.
  parameters:
    RecoveryLimit:
      name: limit
      in: query
      description: Page limit; binds the continuation cursor.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    RecoveryCursor:
      name: cursor
      in: query
      description: HMAC-protected cursor bound to this collection, parent and limit.
      schema:
        type: string
        maxLength: 2048
    AccountingEnvironmentId:
      name: environmentId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/AccountingUuid"
    AllowanceReservationId:
      name: reservationId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/AccountingUuid"
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OperationId:
      name: operationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RegionId:
      name: regionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OrganizationId:
      name: organizationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    BudgetAuthorityResponse:
      description: Current budget authority; runtimeEnforced is false.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/BudgetAuthorityEnvelope"
    AccountingConflict:
      description: >-
        Conditional revision/accounting conflict, invalid period/dimensions, budget pause/exhaustion,
        unreconciled gaps/holds, or invalid reservation/usage/settlement evidence. Read current state
        before a bounded retry.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    AccountingUnavailable:
      description: >-
        Accounting state, provider, configuration, or crypto unavailable. No private evidence or
        credentials are returned.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    AllowanceFenceUnavailable:
      description: >-
        Dedicated fence keyring missing/invalid or retained key version unavailable
        (fence_key_unavailable). No provider/bootstrap key fallback.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    AdmissionResponse:
      description: Current admission, closed by default
      content:
        application/json:
          schema:
            type: object
            required: [admission]
            properties:
              admission:
                $ref: "#/components/schemas/Admission"
    LeaseConflict:
      description: Missing, expired, reassigned, or conflicting execution lease (lease_conflict)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InvalidRequest:
      description: Invalid request body, query parameter, or idempotency key
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Missing or invalid bearer token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Token lacks the required scope
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource absent or inaccessible to caller
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    PoolingPolicy:
      type: object
      additionalProperties: false
      required:
        - version
        - image
        - mode
        - compute
        - connections
        - timeouts
      properties:
        version:
          type: integer
          const: 1
        image:
          type: string
          pattern: ^[a-z0-9][a-z0-9._:/-]*@sha256:[0-9a-f]{64}$
        mode:
          type: string
          const: session
        compute:
          type: object
          additionalProperties: false
          required:
            - requests
            - limits
          properties:
            requests:
              $ref: "#/components/schemas/Compute"
            limits:
              $ref: "#/components/schemas/Compute"
          description:
            Limits must be at least requests in every dimension; both bootstrap-init
            and main Pooler container use these values.
        connections:
          type: object
          additionalProperties: false
          required:
            - maxClients
            - poolSize
            - maxDatabaseConnections
            - maxUserConnections
          properties:
            maxClients:
              type: integer
              minimum: 1
              maximum: 10000
            poolSize:
              type: integer
              minimum: 1
              maximum: 1000
            maxDatabaseConnections:
              type: integer
              minimum: 1
              maximum: 1000
            maxUserConnections:
              type: integer
              minimum: 1
              maximum: 1000
          description: Pool size cannot exceed any client or backend cap.
        timeouts:
          type: object
          additionalProperties: false
          required:
            - queryWaitSeconds
            - connectSeconds
            - cancelWaitSeconds
          properties:
            queryWaitSeconds:
              type: integer
              minimum: 1
              maximum: 300
            connectSeconds:
              type: integer
              minimum: 1
              maximum: 300
            cancelWaitSeconds:
              type: integer
              minimum: 1
              maximum: 300
      description:
        Optional immutable operator policy for one RW session Pooler with Recreate.
        Absent preserves unpooled behavior. No arbitrary parameters, backend URLs or TLS
        Secrets.
    PoolerReadyObservation:
      type: object
      additionalProperties: false
      required:
        - uid
        - generation
        - deploymentUid
        - readyInstances
      properties:
        uid:
          type: string
          format: uuid
        generation:
          type: integer
          minimum: 1
        deploymentUid:
          type: string
          format: uuid
        readyInstances:
          type: integer
          const: 1
      description:
        Current owned internal Pooler/Deployment provisioning metadata. Not
