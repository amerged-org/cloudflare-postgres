openapi: 3.1.0
info:
  title: Cloudflare Postgres Control API
  version: 0.1.0
  description: >-
    Projects are global logical containers created immediately. Database
    environments select an explicit admitted region and immutable profile
    version. Regional executors lease environment.create operations and report
    observed readiness. Ready does not imply an exposed connection endpoint,
    customer credentials, or successful backup/recovery qualification.
paths:
  /v1/regions:
    get:
      operationId: listRegions
      summary: Page through registered regions for installation recovery
      description: >-
        Installation-token-only list, newest first by creation time and ID.
        Follow nextCursor until null. Region names are unique with exact,
        case-sensitive matching. Tokens are never returned by this route.
      security:
        - installationToken: []
      parameters:
        - name: limit
          in: query
          description: Page size; defaults to 1000.
          schema:
            type: integer
            minimum: 1
            maximum: 1000
        - name: cursor
          in: query
          description: Opaque nextCursor from the preceding page.
          schema:
            type: string
      responses:
        "200":
          description: One region page
          content:
            application/json:
              schema:
                type: object
                required: [regions, nextCursor]
                properties:
                  regions:
                    type: array
                    items:
                      $ref: "#/components/schemas/Region"
                  nextCursor:
                    type: [string, "null"]
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          description: Installation bootstrap secret is unconfigured
    post:
      operationId: registerRegion
      summary: Register a region and reveal its executor token once
      description: >-
        Registration records identity only. New environment admission is closed
        until an installation operator explicitly publishes a catalog and opens
        admission. A region name is unique under exact, case-sensitive matching.
      security:
        - installationToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NameInput"
      responses:
        "201":
          description: Region registered; save the returned token securely
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegionTokenResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Region name already registered (region_name_conflict)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Installation bootstrap secret is unconfigured
  /v1/regions/{regionId}:
    parameters:
      - $ref: "#/components/parameters/RegionId"
    get:
      operationId: getRegion
      summary: Read region registration without its token
      security:
        - installationToken: []
      responses:
        "200":
          description: Registered region
          content:
            application/json:
              schema:
                type: object
                required: [region]
                properties:
                  region:
                    $ref: "#/components/schemas/Region"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          description: Installation bootstrap secret is unconfigured
  /v1/regions/{regionId}/tokens/reissue:
    parameters:
      - $ref: "#/components/parameters/RegionId"
    post:
      operationId: reissueRegionToken
      summary: Reissue a lost region executor token
      description: >-
        Installation-token-only recovery operation. Revokes every previously
        active token for this region and reveals the replacement once.
      security:
        - installationToken: []
      responses:
        "201":
          description: Previous token revoked; replacement token issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegionTokenResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          description: Installation bootstrap secret is unconfigured
  /v1/organizations:
    get:
      operationId: listOrganizations
      summary: Page through organizations for installation recovery
      description: >-
        Installation-token-only list, newest first by creation time and ID.
        Follow nextCursor until it is null to reach older organizations after a
        lost bootstrap response. The cursor advances by creation time and ID;
        concurrent creations or deletions can change later pages.
      security:
        - installationToken: []
      parameters:
        - name: limit
          in: query
          description: Page size; defaults to 1000.
          schema:
            type: integer
            minimum: 1
            maximum: 1000
        - name: cursor
          in: query
          description: Opaque nextCursor value returned by the preceding page.
          schema:
            type: string
      responses:
        "200":
          description: One organization page
          content:
            application/json:
              schema:
                type: object
                required: [organizations, nextCursor]
                properties:
                  organizations:
                    type: array
                    items:
                      $ref: "#/components/schemas/Organization"
                  nextCursor:
                    type: [string, "null"]
                    description: Pass this as cursor to fetch the next page, if present.
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          description: Installation bootstrap secret is unconfigured
    post:
      operationId: bootstrapOrganization
      summary: Create an organization and reveal its scoped API token once
      security:
        - installationToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NameInput"
      responses:
        "201":
          description: Organization created; save the returned token now
          content:
            application/json:
              schema:
                type: object
                required: [organization, apiToken, scopes]
                properties:
                  organization:
                    $ref: "#/components/schemas/Organization"
                  apiToken:
                    type: string
                    pattern: "^cporg_[A-Za-z0-9_-]+$"
                  scopes:
                    type: array
                    items:
                      type: string
                      enum: [projects:read, projects:write, operations:read]
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          description: Installation bootstrap secret is unconfigured
  /v1/organizations/{organizationId}/tokens/reissue:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    post:
      operationId: reissueOrganizationToken
      summary: Reissue a lost organization token
      description: >-
        Installation-token-only recovery operation. Revokes every previously active
        token for this organization and reveals the replacement token once.
      security:
        - installationToken: []
      responses:
        "201":
          description: Previous tokens revoked; replacement token issued
          content:
            application/json:
              schema:
                type: object
                required: [organization, apiToken, scopes]
                properties:
                  organization:
                    $ref: "#/components/schemas/Organization"
                  apiToken:
                    type: string
                    pattern: "^cporg_[A-Za-z0-9_-]+$"
                  scopes:
                    type: array
                    items:
                      type: string
                      enum: [projects:read, projects:write, operations:read]
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          description: Installation bootstrap secret is unconfigured
  /v1/organizations/{organizationId}/projects:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    post:
      operationId: createProject
      summary: Create a logical project and completed audit operation
      description: >-
        Creates a global logical container in D1. No region, PostgreSQL
        cluster, database, credential, or connection endpoint is provisioned.
      security:
        - organizationToken: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
            pattern: "^[A-Za-z0-9._~-]+$"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NameInput"
      responses:
        "201":
          description: Logical project created; the same key and request preserve both IDs
          content:
            application/json:
              schema:
                type: object
                required: [project, operation]
                properties:
                  project:
                    $ref: "#/components/schemas/Project"
                  operation:
                    $ref: "#/components/schemas/Operation"
        "202":
          description: >-
            An unmatched legacy project remains pending with a queued operation.
            Its IDs are preserved and operator review is required.
          content:
            application/json:
              schema:
                type: object
                required: [project, operation]
                properties:
                  project:
                    $ref: "#/components/schemas/Project"
                  operation:
                    $ref: "#/components/schemas/Operation"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Idempotency key already used with another request
  /v1/organizations/{organizationId}/projects/{projectId}:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getProject
      summary: Read a project in the authorized organization
      security:
        - organizationToken: []
      responses:
        "200":
          description: Project state
          content:
            application/json:
              schema:
                type: object
                required: [project]
                properties:
                  project:
                    $ref: "#/components/schemas/Project"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/organizations/{organizationId}/operations/{operationId}:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - name: operationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getOperation
      summary: Read an audit operation in the authorized organization
      security:
        - organizationToken: []
      responses:
        "200":
          description: Operation state
          content:
            application/json:
              schema:
                type: object
                required: [operation]
                properties:
                  operation:
                    $ref: "#/components/schemas/Operation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/regions/{regionId}/catalogs:
    parameters:
      - $ref: "#/components/parameters/RegionId"
    post:
      operationId: publishRegionCatalog
      summary: Publish an immutable regional profile version
      description: >-
        Installation-only trusted configuration. The body is bounded to 16384
        UTF-8 bytes and 16 unique profiles. Versions cannot be replaced or
        deleted. Publishing does not open admission or prove qualification.
        The response omits internal storage mapping and backup locations/refs.
      security:
        - installationToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [version, profiles]
              properties:
                version:
                  $ref: "#/components/schemas/CatalogVersion"
                profiles:
                  type: array
                  minItems: 1
                  maxItems: 16
                  items:
                    $ref: "#/components/schemas/OperatorProfile"
      responses:
        "201":
          description: Immutable catalog published
          content:
            application/json:
              schema:
                type: object
                required: [catalog]
                properties:
                  catalog:
                    $ref: "#/components/schemas/PublicCatalog"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The version already exists (catalog_version_conflict)
  /v1/regions/{regionId}/admission:
    parameters:
      - $ref: "#/components/parameters/RegionId"
    get:
      operationId: getRegionAdmission
      summary: Read the separately mutable admission policy
      security:
        - installationToken: []
      responses:
        "200":
          $ref: "#/components/responses/AdmissionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: setRegionAdmission
      summary: Explicitly open or close admission for a published version
      description: >-
        Opening is an operator action after qualification; this API does not
        verify backup evidence. Closing prevents new creation but does not revoke
        already accepted environment operations or alter their frozen specs.
      security:
        - installationToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [catalogVersion, acceptingNewEnvironments]
              properties:
                catalogVersion:
                  $ref: "#/components/schemas/CatalogVersion"
                acceptingNewEnvironments:
                  type: boolean
      responses:
        "200":
          $ref: "#/components/responses/AdmissionResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: A disabled region cannot be opened
  /v1/organizations/{organizationId}/regions/{regionId}/catalogs/{catalogVersion}:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - $ref: "#/components/parameters/RegionId"
      - name: catalogVersion
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/CatalogVersion"
    get:
      operationId: getPublicRegionCatalog
      summary: Discover supported profiles without internal configuration
      security:
        - organizationToken: []
      responses:
        "200":
          description: Public catalog and current admission
          content:
            application/json:
              schema:
                type: object
                required: [catalog, admission]
                properties:
                  catalog:
                    $ref: "#/components/schemas/PublicCatalog"
                  admission:
                    $ref: "#/components/schemas/Admission"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/organizations/{organizationId}/projects/{projectId}/environments:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - $ref: "#/components/parameters/ProjectId"
    post:
      operationId: createEnvironment
      summary: Accept a frozen environment specification for regional execution
      description: >-
        Requires projects:write, an active logical project, and admission for
        the exact requested catalog version. There are no provider/customer
        defaults. Environment, queued operation, and idempotency identity are
        inserted atomically with a fresh admission check. Identical retries
        preserve IDs and return current observed state even after admission
        closes; changed content under the same organization-wide environment
        key returns 409. No endpoint or credential is issued.
      security:
        - organizationToken: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            pattern: "^[A-Za-z0-9._~-]{1,128}$"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnvironmentInput"
      responses:
        "202":
          description: Accepted environment and current operation state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvironmentOperationResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Admission closed, project not active, or idempotency conflict
  /v1/organizations/{organizationId}/projects/{projectId}/environments/{environmentId}:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - $ref: "#/components/parameters/ProjectId"
      - name: environmentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getEnvironment
      summary: Observe an environment in its authorized project
      security:
        - organizationToken: []
      responses:
        "200":
          description: Public environment state without internal routing or secrets
          content:
            application/json:
              schema:
                type: object
                required: [environment]
                properties:
                  environment:
                    $ref: "#/components/schemas/Environment"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/regions/{regionId}/operations/claim:
    parameters:
      - $ref: "#/components/parameters/RegionId"
    post:
      operationId: claimRegionalOperation
      summary: Atomically lease one queued or expired environment operation
      description: >-
        Requires this region's operations:claim token. The private response
        includes the complete frozen operator spec; do not expose it to tenants.
        A claim increments its epoch and returns a random token stored only as a
        hash. Competing claims cannot receive the same active operation.
      security:
        - regionToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [leaseSeconds]
              properties:
                leaseSeconds:
                  $ref: "#/components/schemas/LeaseSeconds"
      responses:
        "200":
          description: One private execution claim, or null when no work is available
          content:
            application/json:
              schema:
                type: object
                required: [claim]
                properties:
                  claim:
                    anyOf:
                      - $ref: "#/components/schemas/ExecutionClaim"
                      - type: "null"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/regions/{regionId}/operations/{operationId}/renew:
    parameters:
      - $ref: "#/components/parameters/RegionId"
      - $ref: "#/components/parameters/OperationId"
    post:
      operationId: renewRegionalLease
      summary: Extend a still-current unexpired execution lease
      security:
        - regionToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [leaseToken, leaseEpoch, leaseSeconds]
              properties:
                leaseToken:
                  $ref: "#/components/schemas/LeaseToken"
                leaseEpoch:
                  $ref: "#/components/schemas/LeaseEpoch"
                leaseSeconds:
                  $ref: "#/components/schemas/LeaseSeconds"
      responses:
        "200":
          description: Lease renewed
          content:
            application/json:
              schema:
                type: object
                required: [leaseExpiresAt]
                properties:
                  leaseExpiresAt:
                    type: string
                    format: date-time
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/LeaseConflict"
  /v1/regions/{regionId}/operations/{operationId}/result:
    parameters:
      - $ref: "#/components/parameters/RegionId"
      - $ref: "#/components/parameters/OperationId"
    post:
      operationId: reportRegionalResult
      summary: Atomically publish fenced observed environment status
      description: >-
        Requires operations:report. A ready result requires at least the profile's
        instance count and a cluster UID/generation; the executor is responsible
        for reading actual CNPG and Pod readiness. D1 does not query Kubernetes.
        An expired/reassigned lease or another region cannot publish a result.
        Repeating the exact terminal result with the same lease remains safe
        after an uncertain response; changed terminal content is rejected.
      security:
        - regionToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExecutionResultInput"
      responses:
        "200":
          description: Observed status recorded or identical terminal result replayed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvironmentOperationResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/LeaseConflict"
components:
  securitySchemes:
    installationToken:
      type: http
      scheme: bearer
      description: Worker Secret configured by the installation operator.
    organizationToken:
      type: http
      scheme: bearer
      description: >-
        Token issued once at organization bootstrap with projects:read,
        projects:write, and operations:read scopes.
    regionToken:
      type: http
      scheme: bearer
      description: Region-scoped executor token with operations:claim and operations:report.
  parameters:
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OperationId:
      name: operationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RegionId:
      name: regionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OrganizationId:
      name: organizationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    AdmissionResponse:
      description: Current admission, closed by default
      content:
        application/json:
          schema:
            type: object
            required: [admission]
            properties:
              admission:
                $ref: "#/components/schemas/Admission"
    LeaseConflict:
      description: Missing, expired, reassigned, or conflicting execution lease (lease_conflict)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InvalidRequest:
      description: Invalid request body, query parameter, or idempotency key
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Missing or invalid bearer token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Token lacks the required scope
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource absent or inaccessible to caller
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Region:
      type: object
      required: [id, name, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        status:
          type: string
          enum: [registered, active, disabled]
          description: Only registered is produced by the current API slice.
        createdAt:
          type: string
          format: date-time
    RegionTokenResponse:
      type: object
      required: [region, apiToken, scopes]
      properties:
        region:
          $ref: "#/components/schemas/Region"
        apiToken:
          type: string
          pattern: "^cprgn_[A-Za-z0-9_-]+$"
        scopes:
          type: array
          items:
            type: string
            enum: [operations:claim, operations:report]
          minItems: 2
          maxItems: 2
    NameInput:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
          description: Trimmed name without control characters.
    Organization:
      type: object
      required: [id, name, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        createdAt:
          type: string
          format: date-time
    Project:
      type: object
      required: [id, organizationId, name, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
        name:
          type: string
        status:
          type: string
          enum: [active, pending]
          description: >-
            Active means the logical container exists, not that a database is
            provisioned. Pending is reserved for unmatched legacy records.
        createdAt:
          type: string
          format: date-time
    Operation:
      type: object
      required:
        [
          id,
          organizationId,
          projectId,
          kind,
          status,
          createdAt,
          observedAt,
          resultCode,
        ]
      properties:
        id:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        kind:
          type: string
          enum: [project.create, environment.create]
        status:
          type: string
          enum: [succeeded, queued, running, failed]
          description: Projects succeed in D1; environments require regional execution.
        environmentId:
          type: string
          format: uuid
          description: Present only for environment operations.
        createdAt:
          type: string
          format: date-time
        observedAt:
          type: [string, "null"]
          format: date-time
          description: Time the final result was observed.
        resultCode:
          type: [string, "null"]
          enum:
            [
              logical_container_created,
              cnpg_ready,
              ownership_mismatch,
              spec_conflict,
              reconcile_failed,
              null,
            ]
          description: Null while an operation has no final observed result.
    CatalogVersion:
      type: string
      pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$"
    Compute:
      type: object
      additionalProperties: false
      required: [cpuMilli, memoryMiB]
      properties:
        cpuMilli:
          type: integer
          minimum: 1
          maximum: 1000000
        memoryMiB:
          type: integer
          minimum: 1
          maximum: 1048576
    PublicStorage:
      type: object
      additionalProperties: false
      required: [classId, minGiB, maxGiB, stepGiB]
      properties:
        classId:
          type: string
          pattern: "^[a-z][a-z0-9_-]{0,63}$"
        minGiB:
          type: integer
          minimum: 1
          maximum: 1048576
        maxGiB:
          type: integer
          minimum: 1
          maximum: 1048576
          description: Must be at least minGiB.
        stepGiB:
          type: integer
          minimum: 1
          maximum: 1048576
          description: Allowed sizes are minGiB plus an integer multiple of stepGiB.
    OperatorStorage:
      type: object
      additionalProperties: false
      required: [classId, storageClassName, minGiB, maxGiB, stepGiB]
      properties:
        classId:
          $ref: "#/components/schemas/PublicStorage/properties/classId"
        storageClassName:
          type: string
          description: Internal Kubernetes StorageClass; never chosen or returned to tenants.
          pattern: "^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$"
        minGiB:
          $ref: "#/components/schemas/PublicStorage/properties/minGiB"
        maxGiB:
          $ref: "#/components/schemas/PublicStorage/properties/maxGiB"
        stepGiB:
          $ref: "#/components/schemas/PublicStorage/properties/stepGiB"
    BackupPolicy:
      type: object
      additionalProperties: false
      required: [retentionPolicy]
      properties:
        retentionPolicy:
          type: string
          pattern: "^[1-9][0-9]{0,3}[dwm]$"
    OperatorBackupPolicy:
      type: object
      additionalProperties: false
      required:
        [
          region,
          endpointURL,
          destinationPath,
          retentionPolicy,
          credentialSecret,
        ]
      properties:
        region:
          type: string
          pattern: "^[a-z0-9][a-z0-9-]{0,62}$"
          description: Explicit object-store signing region; R2 uses auto. No executor default.
        endpointURL:
          type: string
          format: uri
          description: HTTPS origin with root pathname, default port, and no credentials, query, or fragment.
        destinationPath:
          type: string
          description: Operator-controlled S3 root; executor appends the immutable environment UUID.
          pattern: "^s3://[a-z0-9][a-z0-9.-]{1,62}(?:/[A-Za-z0-9/._-]*)?$"
        retentionPolicy:
          $ref: "#/components/schemas/BackupPolicy/properties/retentionPolicy"
        credentialSecret:
          type: object
          additionalProperties: false
          required: [namespace, name, accessKeyIdKey, secretAccessKeyKey]
          description: Private references only, never credential values; executor applies its local allowlist.
          properties:
            namespace:
              type: string
              pattern: "^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$"
            name:
              type: string
              pattern: "^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$"
            accessKeyIdKey:
              type: string
              pattern: "^[A-Za-z0-9._-]{1,253}$"
            secretAccessKeyKey:
              type: string
              pattern: "^[A-Za-z0-9._-]{1,253}$"
    PublicProfile:
      type: object
      additionalProperties: false
      required: [id, postgresImage, compute, storage, instances, backup]
      properties:
        id:
          type: string
          pattern: "^[a-z][a-z0-9_-]{0,63}$"
        postgresImage:
          type: string
          pattern: "^[a-z0-9][a-z0-9._:/-]*@sha256:[0-9a-f]{64}$"
        compute:
          $ref: "#/components/schemas/Compute"
        storage:
          $ref: "#/components/schemas/PublicStorage"
        instances:
          type: integer
          minimum: 1
          maximum: 9
        backup:
          $ref: "#/components/schemas/BackupPolicy"
    OperatorProfile:
      type: object
      additionalProperties: false
      required: [id, postgresImage, compute, storage, instances, backup]
      properties:
        id:
          $ref: "#/components/schemas/PublicProfile/properties/id"
        postgresImage:
          $ref: "#/components/schemas/PublicProfile/properties/postgresImage"
        compute:
          $ref: "#/components/schemas/Compute"
        storage:
          $ref: "#/components/schemas/OperatorStorage"
        instances:
          $ref: "#/components/schemas/PublicProfile/properties/instances"
        backup:
          $ref: "#/components/schemas/OperatorBackupPolicy"
    PublicCatalog:
      type: object
      required: [regionId, version, profiles, catalogHash, createdAt]
      properties:
        regionId:
          type: string
          format: uuid
        version:
          $ref: "#/components/schemas/CatalogVersion"
        profiles:
          type: array
          items:
            $ref: "#/components/schemas/PublicProfile"
        catalogHash:
          type: string
          pattern: "^[0-9a-f]{64}$"
          description: Digest of complete operator profiles, not of the redacted public representation.
        createdAt:
          type: string
          format: date-time
    Admission:
      type: object
      required: [catalogVersion, acceptingNewEnvironments, updatedAt]
      properties:
        catalogVersion:
          type: [string, "null"]
          description: Null until the operator selects a published catalog.
        acceptingNewEnvironments:
          type: boolean
        updatedAt:
          type: [string, "null"]
          format: date-time
    EnvironmentInput:
      type: object
      additionalProperties: false
      required: [name, regionId, catalogVersion, profileId, volumeGiB]
      properties:
        name:
          $ref: "#/components/schemas/NameInput/properties/name"
        regionId:
          type: string
          format: uuid
        catalogVersion:
          $ref: "#/components/schemas/CatalogVersion"
        profileId:
          $ref: "#/components/schemas/PublicProfile/properties/id"
        volumeGiB:
          type: integer
          minimum: 1
          maximum: 1048576
          description: Must match the selected profile range and step.
    PublicResolvedSpec:
      type: object
      additionalProperties: false
      required: [name, regionId, catalogVersion, profileId, volumeGiB, profile]
      properties:
        name:
          $ref: "#/components/schemas/NameInput/properties/name"
        regionId:
          type: string
          format: uuid
        catalogVersion:
          $ref: "#/components/schemas/CatalogVersion"
        profileId:
          $ref: "#/components/schemas/PublicProfile/properties/id"
        volumeGiB:
          $ref: "#/components/schemas/EnvironmentInput/properties/volumeGiB"
        profile:
          $ref: "#/components/schemas/PublicProfile"
    ExecutionSpec:
      type: object
      additionalProperties: false
      required: [name, regionId, catalogVersion, profileId, volumeGiB, profile]
      properties:
        name:
          $ref: "#/components/schemas/NameInput/properties/name"
        regionId:
          type: string
          format: uuid
        catalogVersion:
          $ref: "#/components/schemas/CatalogVersion"
        profileId:
          $ref: "#/components/schemas/PublicProfile/properties/id"
        volumeGiB:
          $ref: "#/components/schemas/EnvironmentInput/properties/volumeGiB"
        profile:
          $ref: "#/components/schemas/OperatorProfile"
    ReadyObservation:
      type: object
      additionalProperties: false
      required: [clusterUid, clusterGeneration, readyInstances]
      properties:
        clusterUid:
          type: string
          minLength: 1
          maxLength: 120
        clusterGeneration:
          type: integer
          minimum: 1
        readyInstances:
          type: integer
          minimum: 1
          maximum: 9
    Environment:
      type: object
      required:
        [
          id,
          organizationId,
          projectId,
          regionId,
          name,
          status,
          specRevision,
          specHash,
          resolvedSpec,
          createdAt,
          observedAt,
          observation,
        ]
      properties:
        id:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        regionId:
          type: string
          format: uuid
        name:
          type: string
        status:
          type: string
          enum: [pending, provisioning, ready, failed]
        specRevision:
          type: integer
          const: 1
        specHash:
          type: string
          pattern: "^[0-9a-f]{64}$"
          description: SHA-256 of JSON.stringify of the complete immutable execution spec, not this redacted view.
        resolvedSpec:
          $ref: "#/components/schemas/PublicResolvedSpec"
        createdAt:
          type: string
          format: date-time
        observedAt:
          type: [string, "null"]
          format: date-time
        observation:
          anyOf:
            - $ref: "#/components/schemas/ReadyObservation"
            - type: "null"
    EnvironmentOperationResponse:
      type: object
      required: [environment, operation]
      properties:
        environment:
          $ref: "#/components/schemas/Environment"
        operation:
          $ref: "#/components/schemas/Operation"
    LeaseSeconds:
      type: integer
      minimum: 30
      maximum: 300
    LeaseToken:
      type: string
      pattern: "^cplease_[A-Za-z0-9_-]{43}$"
    LeaseEpoch:
      type: integer
      minimum: 1
    ExecutionClaim:
      type: object
      required:
        [
          operationId,
          environmentId,
          regionId,
          kind,
          leaseToken,
          leaseEpoch,
          leaseExpiresAt,
          specRevision,
          specHash,
          spec,
        ]
      properties:
        operationId:
          type: string
          format: uuid
        environmentId:
          type: string
          format: uuid
        regionId:
          type: string
          format: uuid
        kind:
          type: string
          const: environment.create
        leaseToken:
          $ref: "#/components/schemas/LeaseToken"
        leaseEpoch:
          $ref: "#/components/schemas/LeaseEpoch"
        leaseExpiresAt:
          type: string
          format: date-time
        specRevision:
          type: integer
          const: 1
        specHash:
          type: string
          pattern: "^[0-9a-f]{64}$"
        spec:
          $ref: "#/components/schemas/ExecutionSpec"
    ExecutionResultInput:
      oneOf:
        - type: object
          additionalProperties: false
          required: [leaseToken, leaseEpoch, status, resultCode, observation]
          properties:
            leaseToken:
              $ref: "#/components/schemas/LeaseToken"
            leaseEpoch:
              $ref: "#/components/schemas/LeaseEpoch"
            status:
              type: string
              const: ready
            resultCode:
              type: string
              const: cnpg_ready
            observation:
              $ref: "#/components/schemas/ReadyObservation"
        - type: object
          additionalProperties: false
          required: [leaseToken, leaseEpoch, status, resultCode, observation]
          properties:
            leaseToken:
              $ref: "#/components/schemas/LeaseToken"
            leaseEpoch:
              $ref: "#/components/schemas/LeaseEpoch"
            status:
              type: string
              const: failed
            resultCode:
              type: string
              enum: [ownership_mismatch, spec_conflict, reconcile_failed]
            observation:
              type: "null"
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code]
          properties:
            code:
              type: string
