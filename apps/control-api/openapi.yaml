openapi: 3.1.0
info:
  title: Cloudflare Postgres Control API
  version: 0.1.0
  description: >-
    Projects are global logical containers created immediately. Database
    environments select an explicit admitted region and immutable profile
    version. Regional executors lease environment.create operations and report
    observed readiness. Ready does not imply an exposed connection endpoint,
    customer credentials, or successful backup/recovery qualification. Usage and
    budget APIs record exact control authority. Budget and allowance resources
    report runtimeEnforced false and pending_runtime until M6 runtime collection,
    durable journals, supervision and expiry guards are qualified.
paths:
  /v1/installation/providers/contabo/instances:
    get:
      operationId: observeContaboInstances
      summary: Observe installation-owned Contabo instances
      description: >-
        Installation token only. Bounded read-only provider scan; no query parameters,
        body, backend URL or actions. Observed-scan consistency is not an atomic provider
        snapshot, machine identity, reserved capacity or physical-host isolation proof.
        Raw provider credentials/errors/opaque metadata are never returned.
      security:
        - installationToken: []
      responses:
        "200":
          description: Complete bounded observed scan with selected private operator metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderInventory"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "405":
          description: Only GET is supported; Allow header is GET
        "503":
          description: Provider credentials, authentication, response or observation unavailable
  /v1/regions:
    get:
      operationId: listRegions
      summary: Page through registered regions for installation recovery
      description: >-
        Installation-token-only list, newest first by creation time and ID.
        Follow nextCursor until null. Region names are unique with exact,
        case-sensitive matching. Tokens are never returned by this route.
      security:
        - installationToken: []
      parameters:
        - name: limit
          in: query
          description: Page size; defaults to 1000.
          schema:
            type: integer
            minimum: 1
            maximum: 1000
        - name: cursor
          in: query
          description: Opaque nextCursor from the preceding page.
          schema:
            type: string
      responses:
        "200":
          description: One region page
          content:
            application/json:
              schema:
                type: object
                required: [regions, nextCursor]
                properties:
                  regions:
                    type: array
                    items:
                      $ref: "#/components/schemas/Region"
                  nextCursor:
                    type: [string, "null"]
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          description: Installation bootstrap secret is unconfigured
    post:
      operationId: registerRegion
      summary: Register a region and reveal its executor token once
      description: >-
        Registration records identity only. New environment admission is closed
        until an installation operator explicitly publishes a catalog and opens
        admission. A region name is unique under exact, case-sensitive matching.
      security:
        - installationToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NameInput"
      responses:
        "201":
          description: Region registered; save the returned token securely
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegionTokenResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Region name already registered (region_name_conflict)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Installation bootstrap secret is unconfigured
  /v1/regions/{regionId}:
    parameters:
      - $ref: "#/components/parameters/RegionId"
    get:
      operationId: getRegion
      summary: Read region registration without its token
      security:
        - installationToken: []
      responses:
        "200":
          description: Registered region
          content:
            application/json:
              schema:
                type: object
                required: [region]
                properties:
                  region:
                    $ref: "#/components/schemas/Region"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          description: Installation bootstrap secret is unconfigured
  /v1/regions/{regionId}/tokens/reissue:
    parameters:
      - $ref: "#/components/parameters/RegionId"
    post:
      operationId: reissueRegionToken
      summary: Reissue a lost region executor token
      description: >-
        Installation-token-only recovery operation. Revokes every previously
        active token for this region and reveals the replacement once.
      security:
        - installationToken: []
      responses:
        "201":
          description: Previous token revoked; replacement token issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegionTokenResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          description: Installation bootstrap secret is unconfigured
  /v1/organizations:
    get:
      operationId: listOrganizations
      summary: Page through organizations for installation recovery
      description: >-
        Installation-token-only list, newest first by creation time and ID.
        Follow nextCursor until it is null to reach older organizations after a
        lost bootstrap response. The cursor advances by creation time and ID;
        concurrent creations or deletions can change later pages.
      security:
        - installationToken: []
      parameters:
        - name: limit
          in: query
          description: Page size; defaults to 1000.
          schema:
            type: integer
            minimum: 1
            maximum: 1000
        - name: cursor
          in: query
          description: Opaque nextCursor value returned by the preceding page.
          schema:
            type: string
      responses:
        "200":
          description: One organization page
          content:
            application/json:
              schema:
                type: object
                required: [organizations, nextCursor]
                properties:
                  organizations:
                    type: array
                    items:
                      $ref: "#/components/schemas/Organization"
                  nextCursor:
                    type: [string, "null"]
                    description: Pass this as cursor to fetch the next page, if present.
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          description: Installation bootstrap secret is unconfigured
    post:
      operationId: bootstrapOrganization
      summary: Create an organization and reveal its scoped API token once
      security:
        - installationToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NameInput"
      responses:
        "201":
          description: Organization created; save the returned token now
          content:
            application/json:
              schema:
                type: object
                required: [organization, apiToken, scopes]
                properties:
                  organization:
                    $ref: "#/components/schemas/Organization"
                  apiToken:
                    type: string
                    pattern: "^cporg_[A-Za-z0-9_-]+$"
                  scopes:
                    type: array
                    items:
                      type: string
                      enum: [projects:read, projects:write, operations:read]
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          description: Installation bootstrap secret is unconfigured
  /v1/organizations/{organizationId}/tokens/reissue:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    post:
      operationId: reissueOrganizationToken
      summary: Reissue a lost organization token
      description: >-
        Installation-token-only recovery operation. Revokes every previously active
        token for this organization and reveals the replacement token once.
      security:
        - installationToken: []
      responses:
        "201":
          description: Previous tokens revoked; replacement token issued
          content:
            application/json:
              schema:
                type: object
                required: [organization, apiToken, scopes]
                properties:
                  organization:
                    $ref: "#/components/schemas/Organization"
                  apiToken:
                    type: string
                    pattern: "^cporg_[A-Za-z0-9_-]+$"
                  scopes:
                    type: array
                    items:
                      type: string
                      enum: [projects:read, projects:write, operations:read]
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          description: Installation bootstrap secret is unconfigured
  /v1/organizations/{organizationId}/projects:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    post:
      operationId: createProject
      summary: Create a logical project and completed audit operation
      description:
        Creates a global logical container in D1. No region, PostgreSQL cluster,
        database, credential, or connection endpoint is provisioned.
      security:
        - organizationToken: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
            pattern: ^[A-Za-z0-9._~-]+$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NameInput"
      responses:
        "201":
          description:
            Logical project created; the same key and request preserve both
            IDs
          content:
            application/json:
              schema:
                type: object
                required:
                  - project
                  - operation
                properties:
                  project:
                    $ref: "#/components/schemas/Project"
                  operation:
                    $ref: "#/components/schemas/Operation"
        "202":
          description:
            An unmatched legacy project remains pending with a queued operation.
            Its IDs are preserved and operator review is required.
          content:
            application/json:
              schema:
                type: object
                required:
                  - project
                  - operation
                properties:
                  project:
                    $ref: "#/components/schemas/Project"
                  operation:
                    $ref: "#/components/schemas/Operation"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Idempotency key already used with another request
    get:
      operationId: listProjects
      summary: Recover projects in the authorized parent
      description:
        Requires projects:read. Returns observed metadata and a current operation
        identifier, never credentials or execution authority. Pages are not a frozen
        snapshot. Missing or foreign parents return 404; owned empty parents return
        200. Only one limit and cursor are accepted.
      security:
        - organizationToken: []
      parameters:
        - $ref: "#/components/parameters/RecoveryLimit"
        - $ref: "#/components/parameters/RecoveryCursor"
      responses:
        "200":
          description: Bounded observed resource page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoveryProjectsPage"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          description:
            Ambiguous persisted operation linkage or unavailable recovery
            read
        "503":
          description: Cursor signing key unavailable
  /v1/organizations/{organizationId}/projects/{projectId}:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getProject
      summary: Read a project in the authorized organization
      security:
        - organizationToken: []
      responses:
        "200":
          description: Project state
          content:
            application/json:
              schema:
                type: object
                required: [project]
                properties:
                  project:
                    $ref: "#/components/schemas/Project"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/organizations/{organizationId}/operations/{operationId}:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - name: operationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getOperation
      summary: Recover a project, environment, role or database operation
      security:
        - organizationToken: []
      responses:
        "200":
          description: Operation state
          content:
            application/json:
              schema:
                type: object
                required:
                  - operation
                properties:
                  operation:
                    $ref: "#/components/schemas/RecoveryOperation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "500":
          description:
            Ambiguous visible operation identifier or unavailable recovery
            read
      description:
        Requires operations:read. Historical metadata stays readable; query
        parameters are rejected. Ambiguous visible identifiers return 500 state_inconsistent.
  /v1/regions/{regionId}/catalogs:
    parameters:
      - $ref: "#/components/parameters/RegionId"
    post:
      operationId: publishRegionCatalog
      summary: Publish an immutable regional profile version
      description: >-
        Installation-only trusted configuration. The body is bounded to 16384
        UTF-8 bytes and 16 unique profiles. Versions cannot be replaced or
        deleted. Publishing does not open admission or prove qualification.
        The response omits internal storage mapping and backup locations/refs.
      security:
        - installationToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [version, profiles]
              properties:
                version:
                  $ref: "#/components/schemas/CatalogVersion"
                profiles:
                  type: array
                  minItems: 1
                  maxItems: 16
                  items:
                    $ref: "#/components/schemas/OperatorProfile"
      responses:
        "201":
          description: Immutable catalog published
          content:
            application/json:
              schema:
                type: object
                required: [catalog]
                properties:
                  catalog:
                    $ref: "#/components/schemas/PublicCatalog"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The version already exists (catalog_version_conflict)
  /v1/regions/{regionId}/admission:
    parameters:
      - $ref: "#/components/parameters/RegionId"
    get:
      operationId: getRegionAdmission
      summary: Read the separately mutable admission policy
      security:
        - installationToken: []
      responses:
        "200":
          $ref: "#/components/responses/AdmissionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: setRegionAdmission
      summary: Explicitly open or close admission for a published version
      description: >-
        Opening is an operator action after qualification; this API does not
        verify backup evidence. Closing prevents new creation but does not revoke
        already accepted environment operations or alter their frozen specs.
      security:
        - installationToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [catalogVersion, acceptingNewEnvironments]
              properties:
                catalogVersion:
                  $ref: "#/components/schemas/CatalogVersion"
                acceptingNewEnvironments:
                  type: boolean
      responses:
        "200":
          $ref: "#/components/responses/AdmissionResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: A disabled region cannot be opened
  /v1/organizations/{organizationId}/regions/{regionId}/catalogs/{catalogVersion}:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - $ref: "#/components/parameters/RegionId"
      - name: catalogVersion
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/CatalogVersion"
    get:
      operationId: getPublicRegionCatalog
      summary: Discover supported profiles without internal configuration
      security:
        - organizationToken: []
      responses:
        "200":
          description: Public catalog and current admission
          content:
            application/json:
              schema:
                type: object
                required: [catalog, admission]
                properties:
                  catalog:
                    $ref: "#/components/schemas/PublicCatalog"
                  admission:
                    $ref: "#/components/schemas/Admission"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/environment-admission-permits:
    post:
      operationId: issueEnvironmentAdmissionPermit
      summary: Commission one exactly bound environment without opening regional admission
      description: |
        Installation-only authority, retained under an installation-wide Idempotency-Key.
        The server resolves the immutable catalog profile and compares the supplied
        catalogHash and specHash. Expiry is canonical UTC and at most one hour from
        issuance. This supplies admission only: it does not qualify capacity, funding,
        runtime enforcement, native access, backup or recovery. Ordinary projects:write
        authorization and an unpaused project remain required when consuming the permit.
      security:
        - installationToken: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            pattern: ^[A-Za-z0-9._~-]{1,128}$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdmissionPermitInput"
      responses:
        "201":
          $ref: "#/components/responses/AdmissionPermitResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Hash/binding mismatch, unavailable scope, or changed idempotent request
        "500":
          description: Unavailable persistence or inconsistent retained identity
  /v1/environment-admission-permits/{permitId}:
    parameters:
      - name: permitId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: readEnvironmentAdmissionPermit
      summary: Read immutable commissioning binding and current terminal state
      security:
        - installationToken: []
      responses:
        "200":
          $ref: "#/components/responses/AdmissionPermitResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/environment-admission-permits/{permitId}/revoke:
    parameters:
      - name: permitId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: revokeEnvironmentAdmissionPermit
      summary: Revoke unspent commissioning authority idempotently
      description: |
        Consumed permits cannot be revoked. Exact replay returns the retained permit
        after terminal state changes; changed content conflicts. This never deletes
        an environment or changes regional admission.
      security:
        - installationToken: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            pattern: ^[A-Za-z0-9._~-]{1,128}$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              maxProperties: 0
      responses:
        "200":
          $ref: "#/components/responses/AdmissionPermitResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Consumed/revoked authority or changed idempotent request
  /v1/organizations/{organizationId}/projects/{projectId}/environments:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - $ref: "#/components/parameters/ProjectId"
    post:
      operationId: createEnvironment
      summary: Accept a frozen environment specification for regional execution
      description:
        Requires projects:write, an active logical project, and admission
        for the exact requested catalog version, or an explicitly supplied one-use
        commissioning permit bound to this exact organization/project/specification.
        Known project budget pause prevents fresh creation. There are no provider/customer defaults.
        Environment, queued operation, and idempotency identity are inserted atomically
        with fresh current-actor, project, region, catalog, budget-pause and admission checks.
        A supplied invalid permit never falls back to globally open admission.
        Identical retries preserve IDs and return current
        observed state even after admission closes; changed content under the same organization-wide
        environment key returns 409. No endpoint or credential is issued.
      security:
        - organizationToken: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            pattern: ^[A-Za-z0-9._~-]{1,128}$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnvironmentInput"
      responses:
        "202":
          description: Accepted environment and current operation state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvironmentOperationResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Admission closed, permit unavailable, budget paused, project not active, or idempotency conflict
    get:
      operationId: listEnvironments
      summary: Recover environments in the authorized parent
      description:
        Requires projects:read. Returns observed metadata and a current operation
        identifier, never credentials or execution authority. Pages are not a frozen
        snapshot. Missing or foreign parents return 404; owned empty parents return
        200. Only one limit and cursor are accepted.
      security:
        - organizationToken: []
      parameters:
        - $ref: "#/components/parameters/RecoveryLimit"
        - $ref: "#/components/parameters/RecoveryCursor"
      responses:
        "200":
          description: Bounded observed resource page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoveryEnvironmentsPage"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          description:
            Ambiguous persisted operation linkage or unavailable recovery
            read
        "503":
          description: Cursor signing key unavailable
  /v1/organizations/{organizationId}/projects/{projectId}/environments/{environmentId}:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - $ref: "#/components/parameters/ProjectId"
      - name: environmentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getEnvironment
      summary: Observe an environment in its authorized project
      security:
        - organizationToken: []
      responses:
        "200":
          description: Public environment state without credential references or secret values
          content:
            application/json:
              schema:
                type: object
                required: [environment]
                properties:
                  environment:
                    $ref: "#/components/schemas/Environment"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/organizations/{organizationId}/projects/{projectId}/environments/{environmentId}/connections:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - $ref: "#/components/parameters/ProjectId"
      - name: environmentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getEnvironmentConnection
      summary: Discover an opted-in private direct PostgreSQL endpoint
      description: >-
        Requires projects:read in the owning organization. No query parameters
        are accepted. A primary transaction rechecks the current token, project,
        region, runtime and requested budget state. The stored proof describes
        provisioning, not live reachability, policy realization, SQL availability
        or permission to wake. The client must have the installation-approved
        private network identity and verify the current server with this CA and
        host. This response contains no passwords or Secret references and uses
        Cache-Control no-store. Leaf identity and expiry are historical evidence;
        normal CNPG leaf renewal does not change endpoint authority. The CA must
        still be within its reported validity period.
      security:
        - organizationToken: []
      responses:
        "200":
          description: Owned private endpoint metadata and public CA
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [connection]
                properties:
                  connection:
                    $ref: "#/components/schemas/NativeConnection"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: >-
            Owned environment has no configured or valid bound native proof,
            is not ready/running, has paused requested budget state, or its
            project/region or reported CA is no longer available.
  /v1/organizations/{organizationId}/projects/{projectId}/environments/{environmentId}/backups:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/AccountingEnvironmentId"
    post:
      operationId: createManualBaseBackup
      summary: Retain an owned manual physical base-backup intent
      description: >-
        Requires projects:write and Idempotency-Key. Accepts exactly an empty
        object. Running runtime and requested budgets, active parents and ready
        owned specification are checked atomically with ordinary suspend and
        pending backup interlocks. Expired uncertain backup work retains its hold.
        Hard budget stop is never held or extended by this maintenance interlock.
        No caller path, credential, target or Kubernetes field is accepted.
      security:
        - organizationToken: []
      parameters:
        - $ref: "#/components/parameters/LifecycleIdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              maxProperties: 0
      responses:
        "202":
          description: Immutable accepted backup and operation metadata; no compute authority or credentials.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManualBackupResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Current authority, immutable checkpoint, idempotency or observation conflict.
    get:
      operationId: listEnvironmentBackups
      summary: Read scoped retained backup metadata
      description: Requires projects:read; observed primary page, signed cursor, no archive routing or secrets.
      security:
        - organizationToken: []
      parameters:
        - $ref: "#/components/parameters/RecoveryLimit"
        - $ref: "#/components/parameters/RecoveryCursor"
      responses:
        "200":
          description: Observed page of backup metadata and current operation identifiers.
          content:
            application/json:
              schema:
                type: object
                required: [backups, nextCursor, consistency, observedAt]
                properties:
                  backups:
                    type: array
                    items:
                      type: object
                      required: [backup, currentOperationId]
                      properties:
                        backup:
                          $ref: "#/components/schemas/ManualBackup"
                        currentOperationId:
                          type: [string, "null"]
                          format: uuid
                  nextCursor:
                    type: [string, "null"]
                  consistency:
                    const: observed-page
                  observedAt:
                    type: string
                    format: date-time
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Current authority, immutable checkpoint, idempotency or observation conflict.
