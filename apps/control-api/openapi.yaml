        "500":
          $ref: "#/components/responses/AccountingUnavailable"
  /v1/organizations/{organizationId}/projects/{projectId}/environments/{environmentId}/roles:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/AccountingEnvironmentId"
    get:
      operationId: listRoles
      summary: Recover roles in the authorized parent
      description:
        Requires projects:read. Returns observed metadata and a current operation
        identifier, never credentials or execution authority. Pages are not a frozen
        snapshot. Missing or foreign parents return 404; owned empty parents return
        200. Only one limit and cursor are accepted.
      security:
        - organizationToken: []
      parameters:
        - $ref: "#/components/parameters/RecoveryLimit"
        - $ref: "#/components/parameters/RecoveryCursor"
      responses:
        "200":
          description: Bounded observed resource page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoveryRolesPage"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          description:
            Ambiguous persisted operation linkage or unavailable recovery
            read
        "503":
          description: Cursor signing key unavailable
  /v1/organizations/{organizationId}/projects/{projectId}/environments/{environmentId}/databases:
