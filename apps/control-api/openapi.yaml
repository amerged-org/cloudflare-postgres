  /v1/regions/{regionId}/allowance-reservations:
    parameters:
      - $ref: "#/components/parameters/RegionId"
    post:
      operationId: reserveResourceAllowance
      summary: Reserve project/environment resource authority atomically
      description: >-
        cprgn operations:claim. Checks every applicable budget dimension, retains expired holds, and
        blocks on active/historical gaps. Same region/requestId/body replays receipt without extending
        expiry. Dedicated ALLOWANCE_FENCE_KEYS is required; no M3 runtime enforcer exists.
      security:
        - regionToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AllowanceIssueInput"
      responses:
        "200":
          description: Existing receipt replayed; expiry unchanged.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AllowanceReceiptResponse"
        "201":
          description: Authority reserved; not runtime-enforced.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AllowanceReceiptResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/AccountingConflict"
        "500":
          $ref: "#/components/responses/AccountingUnavailable"
        "503":
          $ref: "#/components/responses/AllowanceFenceUnavailable"
  /v1/regions/{regionId}/allowance-reservations/{reservationId}:
    parameters:
      - $ref: "#/components/parameters/RegionId"
      - $ref: "#/components/parameters/AllowanceReservationId"
    get:
      operationId: getAllowanceReservation
      summary: Read a regional receipt with its private replayable fence
      description: >-
        cprgn operations:claim. Historical readback permits disabled region with valid token. Retained
        key version in ALLOWANCE_FENCE_KEYS is required.
      security:
        - regionToken: []
      responses:
        "200":
          description: Receipt and private fence.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AllowanceReceiptResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/AccountingUnavailable"
        "503":
          $ref: "#/components/responses/AllowanceFenceUnavailable"
  /v1/regions/{regionId}/allowance-reservations/{reservationId}/settlement:
    parameters:
      - $ref: "#/components/parameters/RegionId"
      - $ref: "#/components/parameters/AllowanceReservationId"
    post:
      operationId: settleResourceAllowance
      summary: Settle a fenced receipt with current accepted final facts
      description: >-
        cprgn operations:report. Explicit final evidence, including zero, is required for every
        positive reserved metric. Existing links cannot be removed or moved. Actual overruns are
        charged; accepted evidence replay is deduplicated. Larger settlements require Workers Paid or
        a separately qualified lower Free reference limit.
      security:
        - regionToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AllowanceSettlementInput"
      responses:
        "200":
          description: Evidence settled and hold released; runtime enforcement pending.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AllowanceSettlementResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
