# SPDX-License-Identifier: Apache-2.0
[package]
name = "pgcf-pool-supervisor"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
publish = false

[features]
real-fixtures = []

[[test]]
name = "pgdata"
required-features = ["real-fixtures"]

[[test]]
name = "readonly"
required-features = ["real-fixtures"]

[[test]]
name = "inspection"
required-features = ["real-fixtures"]

[[test]]
name = "readonly_deadline"
required-features = ["real-fixtures"]

[[test]]
name = "readonly_lookup_deadline"
required-features = ["real-fixtures"]

[dependencies]
pgcf-native-protocol = { path = "../../packages/native-protocol" }
serde_json = "=1.0.151"
tokio = { version = "=1.53.2", features = ["rt-multi-thread", "net", "io-util", "macros", "sync", "time", "signal", "process"] }
libc = "=0.2.190"
sha2 = "=0.11.0"
base64 = "=0.23.1"
httparse = "=1.10.1"
rcgen = { version = "=0.14.10", default-features = false, features = ["ring", "pem"] }
rustls = { version = "=0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring", "tls12"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls-no-provider", "stream"] }
time = { version = "=0.3.55", features = ["formatting", "parsing"] }
hmac = "=0.13.0"
futures-util = "=0.3.34"

[dev-dependencies]
ring = "=0.17.14"
