# SPDX-License-Identifier: Apache-2.0
[package]
name = "pgcf-native-protocol"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
publish = false

[dependencies]
base64 = "=0.23.1"
hmac = "=0.13.0"
regex = "=1.13.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.11.0"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ring = "=0.17.14"
